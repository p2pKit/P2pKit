name: Native ordinary dependency-cache restore
description: Fixed real ordinary controller/provider restore; admission, HOLDs and qualification remain mandatory
inputs:
  profile:
    description: Exact full, desktop or jvm-library job profile; JVM uses Desktop dependency bytes only
    required: true
outputs:
  dependency_seed_ready:
    description: Native prepared target retained; not resolver or product acceptance
  dependency_cache_ready:
    description: Exact native restoration retained; actual Action success is also mandatory
  native_provider_ready:
    description: Native provider and original controller returned with known closure
  dependency_seed_home:
    description: Fixed original restore-home target
  dependency_seed_staging_sha256:
    description: SHA-256 of the original staging record
  preparation_sha256:
    description: SHA-256 of the original native preparation
  restoration_sha256:
    description: SHA-256 of the original accepted restoration
  cache_key:
    description: Exact qualified dependency-byte cohort key
  cache_path:
    description: Fixed original literal provider path
runs:
  using: node24
  main: index.cjs
