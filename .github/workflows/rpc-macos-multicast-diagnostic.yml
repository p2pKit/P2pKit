name: RPC current ARM multicast diagnosis (NOT release qualification)

on:
  push:
    branches: [work/rpc-macos-multicast-diagnostic-20261014]

permissions:
  contents: read

concurrency:
  group: rpc-current-arm-multicast-diagnosis
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Configure daemon prerequisite
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - run: printf 'P2PKIT_AUDIT_JDK21=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Configure unchanged fixture JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify diagnostic refusal controls
        run: |
          python3 -I -B -S scripts/tests/current-macos-multicast-diagnostic-test.py
          python3 -I -B -S scripts/tests/with-darwin-audit-session-test.py
      - name: Run diagnosis in a fresh ownership session without network changes
        run: |
          umask 077
          python_bin="$(python3 -I -B -S -c 'import sys; from pathlib import Path; print(Path(sys.executable).resolve(strict=True))')"
          session="$RUNNER_TEMP/p2pkit-mdns-session-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$session"
          # Existing bootstrap only assigns a fresh audit session, preserves its
          # policy, and irreversibly restores the invoking ordinary account.
          # It runs no native observer, product or test while privileged.
          exec "$python_bin" -I -B -S scripts/with-darwin-audit-session.py --parent "$session" -- \
            "$python_bin" -I -B -S "$GITHUB_WORKSPACE/scripts/diagnose-current-macos-multicast.py"
      - name: Retain closed source-bound observations only
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: multicast-diagnosis-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2pkit-mdns-${{ github.run_id }}-${{ github.run_attempt }}/export/summary.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
