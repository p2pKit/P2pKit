name: OSV Advisory Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      fail-on-vuln: true
      upload-sarif: true
      scan-args: |-
        --lockfile=./gradle.lockfile
        --lockfile=./library/p2p-core/gradle.lockfile
        --lockfile=./library/p2p-transport-lan/gradle.lockfile
        --lockfile=./library/p2p-network-provisioning-android/gradle.lockfile
        --lockfile=./library/p2p-network-provisioning-desktop/gradle.lockfile
        --lockfile=./samples/p2p-sample-android/gradle.lockfile
        --lockfile=./samples/p2p-sample-desktop/gradle.lockfile
        --lockfile=./samples/p2p-sample-desktop-ui/gradle.lockfile
        --lockfile=./samples/p2p-sample-diagnostics/gradle.lockfile
        --lockfile=./samples/sample-kmp-shared/gradle.lockfile
        --lockfile=gradle.lockfile:./settings-gradle.lockfile
