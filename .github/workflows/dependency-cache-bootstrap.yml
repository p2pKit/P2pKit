name: Initial receiver capacity probe only

# NEVER MERGE this probe branch. Its initial push is itself execution and needs
# separate exact-source owner authorization. It does not activate a productive
# bootstrap or replace the integration branch's unchanged exit125.
on:
  push:
    branches: [work/receiver-hosted-capacity-20260922-362aa96c]
    paths: [.github/workflows/dependency-cache-bootstrap.yml]

permissions:
  contents: read

concurrency:
  group: p2pkit-receiver-capacity-probe
  cancel-in-progress: false

jobs:
  receiver_capacity_only:
    if: >-
      ${{ github.repository == 'p2pKit/P2pKit' && github.event_name == 'push' &&
          github.ref == 'refs/heads/work/receiver-hosted-capacity-20260922-362aa96c' &&
          github.event.created && !github.event.deleted && !github.event.forced &&
          github.run_attempt == 1 && github.event.head_commit.id == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact public probe source
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Measure only the isolated receiver model
        id: receiver
        timeout-minutes: 3
        shell: bash
        env:
          PROBE_SHA: ${{ github.sha }}
          PROBE_REF: ${{ github.ref }}
          PROBE_RUN: ${{ github.run_id }}
          PROBE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set -C
          umask 077
          readonly CASE="$RUNNER_TEMP/p2pkit-receiver-capacity-$PROBE_RUN-$PROBE_ATTEMPT"
          readonly RESULTS="$CASE/results"
          mkdir -m 0700 -- "$CASE" "$RESULTS"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > "$RESULTS/launcher-started-at.txt"
          set +e
          /usr/bin/sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
            /usr/bin/bash --noprofile --norc \
            "$GITHUB_WORKSPACE/scripts/tests/run-initial-recipient-graph-probe.sh" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$PROBE_SHA" "$PROBE_REF" \
            "$PROBE_RUN" "$PROBE_ATTEMPT" "$ImageOS" "$ImageVersion" \
            </dev/null > "$RESULTS/launcher.stdout" 2> "$RESULTS/launcher.stderr"
          launcher_status=$?
          set -e
          # This is the observed completed sudo/launcher return, not the body's
          # status on entry to its EXIT trap. Capture failures also fail the step.
          printf '%s\n' "$launcher_status" > "$RESULTS/launcher.exit"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > "$RESULTS/launcher-finished-at.txt"
          (cd "$RESULTS" && find . -type f ! -path ./captures.sha256 -print0 |
            sort -z | xargs -0 sha256sum) > "$RESULTS/captures.sha256"
          printf 'RECEIVER_CAPACITY_LAUNCHER_EXIT=%s; MODEL_ONLY; NO_RELEASE_AUTHORITY\n' "$launcher_status"
          exit "$launcher_status"
      - name: Retain public model transcripts and runtime metadata only
        if: ${{ always() && steps.receiver.outcome != 'skipped' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receiver-capacity-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2pkit-receiver-capacity-${{ github.run_id }}-${{ github.run_attempt }}/results/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
