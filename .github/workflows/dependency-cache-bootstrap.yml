name: Dependency cache bootstrap (productive stage held)

# Source preparation only. Exact owner stage/run/attempt/source approval,
# gate/worker encrypted custody and hosted qualification remain prerequisites.
# There is no push/PR/schedule/registration event in this file.
on:
  workflow_dispatch:
    inputs:
      selection:
        description: Exact dependency cohort; not ordinary test acceptance
        type: choice
        required: true
        options:
          - desktop-linux-x64
          - desktop-windows-x64
          - desktop-macos-arm64
          - desktop-macos-x64
          - full-macos-arm64
          - full-macos-x64
      expected_sha:
        description: Full independently reviewed source commit
        type: string
        required: true
      expected_tree:
        description: Full independently reviewed source tree
        type: string
        required: true

permissions: {}

# The metadata gate is not a participant in the heavy-job queue. Preserve all
# allocated attempts instead of cancelling a waiting owner authorization.
concurrency:
  group: p2pkit-initial-recipient-bootstrap
  queue: max
  cancel-in-progress: false

jobs:
  initial-recipient-gate:
    # Keep the API job name equal to GITHUB_JOB: no display-name or matrix alias.
    if: ${{ github.repository == 'p2pKit/P2pKit' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/nonphysical-integration-20260915-022112' && github.sha == inputs.expected_sha }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: initial-recipient-execution
    steps:
      - name: Check out the actual reviewed event source without persisted credentials
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Fetch full no-tag history and verify source before repository Python
        timeout-minutes: 1
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          P2PKIT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          P2PKIT_EXPECTED_TREE: ${{ inputs.expected_tree }}
        # checkout's depth-zero path fetches all tags even with fetch-tags:false.
        # The public repository needs no token for this bounded source fetch.
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = p2pKit/P2pKit
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/work/nonphysical-integration-20260915-022112
          [[ "$P2PKIT_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$P2PKIT_EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$P2PKIT_EXPECTED_SHA"
          git fetch --no-tags --unshallow origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/work/nonphysical-integration-20260915-022112:refs/remotes/origin/work/nonphysical-integration-20260915-022112
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse HEAD)" = "$P2PKIT_EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$P2PKIT_EXPECTED_TREE"
          test "$(git rev-parse refs/remotes/origin/main)" = 3bc76f956f8f47447b51a62474fc878b9c43173c
          test "$(git rev-parse 'refs/remotes/origin/main^{tree}')" = 2a1105fde1d1ac299448489501e29d7a0d4a407a
          test "$(git rev-parse refs/remotes/origin/work/nonphysical-integration-20260915-022112)" = "$P2PKIT_EXPECTED_SHA"
          git merge-base --is-ancestor 3bc76f956f8f47447b51a62474fc878b9c43173c "$P2PKIT_EXPECTED_SHA"
          source_status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$source_status"
          repository_root="$(git rev-parse --show-toplevel)"
          workspace="$GITHUB_WORKSPACE"
          case "$RUNNER_OS" in
            Windows) repository_root="$(cygpath -u -- "$repository_root")"; workspace="$(cygpath -u -- "$workspace")" ;;
            Linux|macOS) ;;
            *) exit 125 ;;
          esac
          current_root="$(pwd -P)"
          repository_root="$(cd -- "$repository_root" && pwd -P)"
          workspace="$(cd -- "$workspace" && pwd -P)"
          test "$current_root" = "$repository_root"
          test "$current_root" = "$workspace"

      - name: Acquire original nonproductive Stage1 eligibility
        id: initial-originals
        timeout-minutes: 3
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
        # Native acquisition retains its original work75/final120 caps. This
        # step emits a provisional digest, not worker Admission or a job output.
        run: exec /usr/bin/python3 -I -B -S scripts/run-hosted-initial-recipient.py prepare-originals

      # These same-job steps share the original custody clock. Their coarse
      # Actions timeouts do not extend any native, stage or original job end.
      - name: Export the original nonproductive gate evidence
        id: initial-custody-export
        if: ${{ success() && steps.initial-originals.outcome == 'success' }}
        timeout-minutes: 6
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
          P2PKIT_INITIAL_PRIMARY_OUTCOME: ${{ steps.initial-originals.outcome }}
          P2PKIT_INITIAL_PRIMARY_RESULT_SHA256: ${{ steps.initial-originals.outputs.initialOriginalsSha256 }}
          P2PKIT_INITIAL_PRIMARY_HANDOFF_SHA256: ${{ steps.initial-originals.outputs.gateHandoffSha256 }}
        run: exec /usr/bin/python3 -I -B -S scripts/run-hosted-initial-recipient-custody.py collect-export --kind gate

      - name: Close gate custody with fresh post-export authority
        id: initial-custody
        if: ${{ success() && steps.initial-originals.outcome == 'success' && steps.initial-custody-export.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
          P2PKIT_INITIAL_PRIMARY_OUTCOME: ${{ steps.initial-originals.outcome }}
          P2PKIT_INITIAL_PRIMARY_RESULT_SHA256: ${{ steps.initial-originals.outputs.initialOriginalsSha256 }}
          P2PKIT_INITIAL_PRIMARY_HANDOFF_SHA256: ${{ steps.initial-originals.outputs.gateHandoffSha256 }}
          P2PKIT_INITIAL_CRYPTO_OUTCOME: ${{ steps.initial-custody-export.outcome }}
          P2PKIT_INITIAL_CRYPTO_STEP_SHA256: ${{ steps.initial-custody-export.outputs.initialCryptoStepSha256 }}
          P2PKIT_INITIAL_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody-export.outputs.initialExporterReturnSha256 }}
        run: exec /usr/bin/python3 -I -B -S scripts/run-hosted-initial-recipient-custody.py collect-close --kind gate

      - name: Seal the exact encrypted gate output
        id: initial-seal
        if: ${{ success() && steps.initial-originals.outcome == 'success' && steps.initial-custody-export.outcome == 'success' && steps.initial-custody.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
          P2PKIT_INITIAL_PRIMARY_OUTCOME: ${{ steps.initial-originals.outcome }}
          P2PKIT_INITIAL_PRIMARY_RESULT_SHA256: ${{ steps.initial-originals.outputs.initialOriginalsSha256 }}
          P2PKIT_INITIAL_PRIMARY_HANDOFF_SHA256: ${{ steps.initial-originals.outputs.gateHandoffSha256 }}
          P2PKIT_INITIAL_CRYPTO_OUTCOME: ${{ steps.initial-custody-export.outcome }}
          P2PKIT_INITIAL_CRYPTO_STEP_SHA256: ${{ steps.initial-custody-export.outputs.initialCryptoStepSha256 }}
          P2PKIT_INITIAL_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody-export.outputs.initialExporterReturnSha256 }}
          P2PKIT_INITIAL_CUSTODY_OUTCOME: ${{ steps.initial-custody.outcome }}
          P2PKIT_INITIAL_CUSTODY_SHA256: ${{ steps.initial-custody.outputs.initialCustodySha256 }}
          P2PKIT_INITIAL_CUSTODY_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody.outputs.initialExporterReturnSha256 }}
        run: exec /usr/bin/python3 -I -B -S scripts/run-hosted-initial-recipient-custody.py seal --kind gate

      - name: Check the original gate upload window
        id: initial-upload-before
        if: ${{ success() && steps.initial-originals.outcome == 'success' && steps.initial-custody-export.outcome == 'success' && steps.initial-custody.outcome == 'success' && steps.initial-seal.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
          P2PKIT_INITIAL_PRIMARY_OUTCOME: ${{ steps.initial-originals.outcome }}
          P2PKIT_INITIAL_PRIMARY_RESULT_SHA256: ${{ steps.initial-originals.outputs.initialOriginalsSha256 }}
          P2PKIT_INITIAL_PRIMARY_HANDOFF_SHA256: ${{ steps.initial-originals.outputs.gateHandoffSha256 }}
          P2PKIT_INITIAL_CRYPTO_OUTCOME: ${{ steps.initial-custody-export.outcome }}
          P2PKIT_INITIAL_CRYPTO_STEP_SHA256: ${{ steps.initial-custody-export.outputs.initialCryptoStepSha256 }}
          P2PKIT_INITIAL_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody-export.outputs.initialExporterReturnSha256 }}
          P2PKIT_INITIAL_CUSTODY_OUTCOME: ${{ steps.initial-custody.outcome }}
          P2PKIT_INITIAL_CUSTODY_SHA256: ${{ steps.initial-custody.outputs.initialCustodySha256 }}
          P2PKIT_INITIAL_CUSTODY_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody.outputs.initialExporterReturnSha256 }}
          P2PKIT_INITIAL_SEAL_OUTCOME: ${{ steps.initial-seal.outcome }}
          P2PKIT_INITIAL_SEAL_SHA256: ${{ steps.initial-seal.outputs.initialSealSha256 }}
        run: exec /usr/bin/python3 -I -B -S scripts/run-hosted-initial-recipient-custody.py upload-before --kind gate

      - name: Retain only encrypted gate evidence and its public manifest
        id: initial-evidence
        if: ${{ success() && steps.initial-originals.outcome == 'success' && steps.initial-custody-export.outcome == 'success' && steps.initial-custody.outcome == 'success' && steps.initial-seal.outcome == 'success' && steps.initial-upload-before.outcome == 'success' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage1-gate-evidence-${{ inputs.selection }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p2pkit-initial-recipient-${{ github.run_id }}-${{ github.run_attempt }}-gate-custody/export-output/evidence.tar.gz.gpg
            ${{ runner.temp }}/p2pkit-initial-recipient-${{ github.run_id }}-${{ github.run_attempt }}-gate-custody/export-output/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Bind actual gate upload success inside the original deadline
        id: initial-upload-after
        if: ${{ success() && steps.initial-originals.outcome == 'success' && steps.initial-custody-export.outcome == 'success' && steps.initial-custody.outcome == 'success' && steps.initial-seal.outcome == 'success' && steps.initial-upload-before.outcome == 'success' && steps.initial-evidence.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
          P2PKIT_INITIAL_PRIMARY_OUTCOME: ${{ steps.initial-originals.outcome }}
          P2PKIT_INITIAL_PRIMARY_RESULT_SHA256: ${{ steps.initial-originals.outputs.initialOriginalsSha256 }}
          P2PKIT_INITIAL_PRIMARY_HANDOFF_SHA256: ${{ steps.initial-originals.outputs.gateHandoffSha256 }}
          P2PKIT_INITIAL_CRYPTO_OUTCOME: ${{ steps.initial-custody-export.outcome }}
          P2PKIT_INITIAL_CRYPTO_STEP_SHA256: ${{ steps.initial-custody-export.outputs.initialCryptoStepSha256 }}
          P2PKIT_INITIAL_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody-export.outputs.initialExporterReturnSha256 }}
          P2PKIT_INITIAL_CUSTODY_OUTCOME: ${{ steps.initial-custody.outcome }}
          P2PKIT_INITIAL_CUSTODY_SHA256: ${{ steps.initial-custody.outputs.initialCustodySha256 }}
          P2PKIT_INITIAL_CUSTODY_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody.outputs.initialExporterReturnSha256 }}
          P2PKIT_INITIAL_SEAL_OUTCOME: ${{ steps.initial-seal.outcome }}
          P2PKIT_INITIAL_SEAL_SHA256: ${{ steps.initial-seal.outputs.initialSealSha256 }}
          P2PKIT_INITIAL_UPLOAD_BEFORE_OUTCOME: ${{ steps.initial-upload-before.outcome }}
          P2PKIT_INITIAL_UPLOAD_WINDOW_SHA256: ${{ steps.initial-upload-before.outputs.initialUploadWindowSha256 }}
          P2PKIT_INITIAL_UPLOAD_OUTCOME: ${{ steps.initial-evidence.outcome }}
          P2PKIT_INITIAL_ARTIFACT_ID: ${{ steps.initial-evidence.outputs.artifact-id }}
          P2PKIT_INITIAL_ARTIFACT_DIGEST: ${{ steps.initial-evidence.outputs.artifact-digest }}
        run: exec /usr/bin/python3 -I -B -S scripts/run-hosted-initial-recipient-custody.py upload-after --kind gate

  populate:
    needs: initial-recipient-gate
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON('{"desktop-linux-x64":"ubuntu-latest","desktop-windows-x64":"windows-latest","desktop-macos-arm64":"macos-26","desktop-macos-x64":"macos-15-intel","full-macos-arm64":"macos-26","full-macos-x64":"macos-15-intel"}')[inputs.selection] }}
    timeout-minutes: 20
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    # Nonproductive prefix only. Its outer envelope does not extend init120,
    # any native component cap or the unadmitted bootstrap5400 proposal.
    # Do not dispatch before both jobs have reviewed encrypted custody/sealing.
    steps:
      - name: Check out the actual reviewed event source without persisted credentials
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Fetch full no-tag history and verify source before repository Python
        timeout-minutes: 1
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          P2PKIT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          P2PKIT_EXPECTED_TREE: ${{ inputs.expected_tree }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = p2pKit/P2pKit
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/work/nonphysical-integration-20260915-022112
          [[ "$P2PKIT_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$P2PKIT_EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$P2PKIT_EXPECTED_SHA"
          git fetch --no-tags --unshallow origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/work/nonphysical-integration-20260915-022112:refs/remotes/origin/work/nonphysical-integration-20260915-022112
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse HEAD)" = "$P2PKIT_EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$P2PKIT_EXPECTED_TREE"
          test "$(git rev-parse refs/remotes/origin/main)" = 3bc76f956f8f47447b51a62474fc878b9c43173c
          test "$(git rev-parse 'refs/remotes/origin/main^{tree}')" = 2a1105fde1d1ac299448489501e29d7a0d4a407a
          test "$(git rev-parse refs/remotes/origin/work/nonphysical-integration-20260915-022112)" = "$P2PKIT_EXPECTED_SHA"
          git merge-base --is-ancestor 3bc76f956f8f47447b51a62474fc878b9c43173c "$P2PKIT_EXPECTED_SHA"
          source_status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$source_status"
          repository_root="$(git rev-parse --show-toplevel)"
          workspace="$GITHUB_WORKSPACE"
          case "$RUNNER_OS" in
            Windows) repository_root="$(cygpath -u -- "$repository_root")"; workspace="$(cygpath -u -- "$workspace")" ;;
            Linux|macOS) ;;
            *) exit 125 ;;
          esac
          current_root="$(pwd -P)"
          repository_root="$(cd -- "$repository_root" && pwd -P)"
          workspace="$(cd -- "$workspace" && pwd -P)"
          test "$current_root" = "$repository_root"
          test "$current_root" = "$workspace"

      - name: Configure native daemon Java 21 and wrapper Java 17
        timeout-minutes: 3
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Bind the native Stage1 daemon JDK
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in X64|ARM64) ;; *) echo 'FATAL: unsupported native Java architecture' >&2; exit 1 ;; esac
          daemon_variable="JAVA_HOME_21_${RUNNER_ARCH}"
          daemon_home="${!daemon_variable}"
          case "$daemon_home" in ''|*$'\n'*|*$'\r'*) echo 'FATAL: missing or invalid daemon JDK path' >&2; exit 1 ;; esac
          printf 'P2PKIT_AUDIT_JDK21=%s\n' "$daemon_home" >> "$GITHUB_ENV"

      - name: Initialize the exact Stage1 source within existing component windows
        id: canonical-initialization
        timeout-minutes: 12
        uses: ./.github/actions/initial-recipient-initialize

      - name: Export the original nonproductive worker evidence
        id: initial-custody-export
        if: ${{ success() && steps.canonical-initialization.outcome == 'success' }}
        timeout-minutes: 6
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
          P2PKIT_INITIAL_PRIMARY_OUTCOME: ${{ steps.canonical-initialization.outcome }}
          P2PKIT_INITIAL_PRIMARY_RESULT_SHA256: ${{ steps.canonical-initialization.outputs.initialization-sha256 }}
          P2PKIT_INITIAL_PRIMARY_HANDOFF_SHA256: ${{ steps.canonical-initialization.outputs.worker-handoff-sha256 }}
        run: |
          case "$RUNNER_OS" in
            Windows) exec python -I -B -S scripts/run-hosted-initial-recipient-custody.py collect-export --kind worker ;;
            Linux|macOS) exec python3 -I -B -S scripts/run-hosted-initial-recipient-custody.py collect-export --kind worker ;;
            *) exit 125 ;;
          esac

      - name: Close worker custody with fresh post-export authority
        id: initial-custody
        if: ${{ success() && steps.canonical-initialization.outcome == 'success' && steps.initial-custody-export.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
          P2PKIT_INITIAL_PRIMARY_OUTCOME: ${{ steps.canonical-initialization.outcome }}
          P2PKIT_INITIAL_PRIMARY_RESULT_SHA256: ${{ steps.canonical-initialization.outputs.initialization-sha256 }}
          P2PKIT_INITIAL_PRIMARY_HANDOFF_SHA256: ${{ steps.canonical-initialization.outputs.worker-handoff-sha256 }}
          P2PKIT_INITIAL_CRYPTO_OUTCOME: ${{ steps.initial-custody-export.outcome }}
          P2PKIT_INITIAL_CRYPTO_STEP_SHA256: ${{ steps.initial-custody-export.outputs.initialCryptoStepSha256 }}
          P2PKIT_INITIAL_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody-export.outputs.initialExporterReturnSha256 }}
        run: |
          case "$RUNNER_OS" in
            Windows) exec python -I -B -S scripts/run-hosted-initial-recipient-custody.py collect-close --kind worker ;;
            Linux|macOS) exec python3 -I -B -S scripts/run-hosted-initial-recipient-custody.py collect-close --kind worker ;;
            *) exit 125 ;;
          esac

      - name: Seal the exact encrypted worker output
        id: initial-seal
        if: ${{ success() && steps.canonical-initialization.outcome == 'success' && steps.initial-custody-export.outcome == 'success' && steps.initial-custody.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
          P2PKIT_INITIAL_PRIMARY_OUTCOME: ${{ steps.canonical-initialization.outcome }}
          P2PKIT_INITIAL_PRIMARY_RESULT_SHA256: ${{ steps.canonical-initialization.outputs.initialization-sha256 }}
          P2PKIT_INITIAL_PRIMARY_HANDOFF_SHA256: ${{ steps.canonical-initialization.outputs.worker-handoff-sha256 }}
          P2PKIT_INITIAL_CRYPTO_OUTCOME: ${{ steps.initial-custody-export.outcome }}
          P2PKIT_INITIAL_CRYPTO_STEP_SHA256: ${{ steps.initial-custody-export.outputs.initialCryptoStepSha256 }}
          P2PKIT_INITIAL_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody-export.outputs.initialExporterReturnSha256 }}
          P2PKIT_INITIAL_CUSTODY_OUTCOME: ${{ steps.initial-custody.outcome }}
          P2PKIT_INITIAL_CUSTODY_SHA256: ${{ steps.initial-custody.outputs.initialCustodySha256 }}
          P2PKIT_INITIAL_CUSTODY_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody.outputs.initialExporterReturnSha256 }}
        run: |
          case "$RUNNER_OS" in
            Windows) exec python -I -B -S scripts/run-hosted-initial-recipient-custody.py seal --kind worker ;;
            Linux|macOS) exec python3 -I -B -S scripts/run-hosted-initial-recipient-custody.py seal --kind worker ;;
            *) exit 125 ;;
          esac

      - name: Check the original worker upload window
        id: initial-upload-before
        if: ${{ success() && steps.canonical-initialization.outcome == 'success' && steps.initial-custody-export.outcome == 'success' && steps.initial-custody.outcome == 'success' && steps.initial-seal.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
          P2PKIT_INITIAL_PRIMARY_OUTCOME: ${{ steps.canonical-initialization.outcome }}
          P2PKIT_INITIAL_PRIMARY_RESULT_SHA256: ${{ steps.canonical-initialization.outputs.initialization-sha256 }}
          P2PKIT_INITIAL_PRIMARY_HANDOFF_SHA256: ${{ steps.canonical-initialization.outputs.worker-handoff-sha256 }}
          P2PKIT_INITIAL_CRYPTO_OUTCOME: ${{ steps.initial-custody-export.outcome }}
          P2PKIT_INITIAL_CRYPTO_STEP_SHA256: ${{ steps.initial-custody-export.outputs.initialCryptoStepSha256 }}
          P2PKIT_INITIAL_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody-export.outputs.initialExporterReturnSha256 }}
          P2PKIT_INITIAL_CUSTODY_OUTCOME: ${{ steps.initial-custody.outcome }}
          P2PKIT_INITIAL_CUSTODY_SHA256: ${{ steps.initial-custody.outputs.initialCustodySha256 }}
          P2PKIT_INITIAL_CUSTODY_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody.outputs.initialExporterReturnSha256 }}
          P2PKIT_INITIAL_SEAL_OUTCOME: ${{ steps.initial-seal.outcome }}
          P2PKIT_INITIAL_SEAL_SHA256: ${{ steps.initial-seal.outputs.initialSealSha256 }}
        run: |
          case "$RUNNER_OS" in
            Windows) exec python -I -B -S scripts/run-hosted-initial-recipient-custody.py upload-before --kind worker ;;
            Linux|macOS) exec python3 -I -B -S scripts/run-hosted-initial-recipient-custody.py upload-before --kind worker ;;
            *) exit 125 ;;
          esac

      - name: Retain only encrypted worker evidence and its public manifest
        id: initial-evidence
        if: ${{ success() && steps.canonical-initialization.outcome == 'success' && steps.initial-custody-export.outcome == 'success' && steps.initial-custody.outcome == 'success' && steps.initial-seal.outcome == 'success' && steps.initial-upload-before.outcome == 'success' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage1-worker-evidence-${{ inputs.selection }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p2pkit-initial-recipient-${{ github.run_id }}-${{ github.run_attempt }}-worker-custody/export-output/evidence.tar.gz.gpg
            ${{ runner.temp }}/p2pkit-initial-recipient-${{ github.run_id }}-${{ github.run_attempt }}-worker-custody/export-output/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Bind actual worker upload success inside the original deadline
        id: initial-upload-after
        if: ${{ success() && steps.canonical-initialization.outcome == 'success' && steps.initial-custody-export.outcome == 'success' && steps.initial-custody.outcome == 'success' && steps.initial-seal.outcome == 'success' && steps.initial-upload-before.outcome == 'success' && steps.initial-evidence.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        env:
          P2PKIT_ACTIONS_READ_TOKEN: ${{ github.token }}
          P2PKIT_INITIAL_PRIMARY_OUTCOME: ${{ steps.canonical-initialization.outcome }}
          P2PKIT_INITIAL_PRIMARY_RESULT_SHA256: ${{ steps.canonical-initialization.outputs.initialization-sha256 }}
          P2PKIT_INITIAL_PRIMARY_HANDOFF_SHA256: ${{ steps.canonical-initialization.outputs.worker-handoff-sha256 }}
          P2PKIT_INITIAL_CRYPTO_OUTCOME: ${{ steps.initial-custody-export.outcome }}
          P2PKIT_INITIAL_CRYPTO_STEP_SHA256: ${{ steps.initial-custody-export.outputs.initialCryptoStepSha256 }}
          P2PKIT_INITIAL_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody-export.outputs.initialExporterReturnSha256 }}
          P2PKIT_INITIAL_CUSTODY_OUTCOME: ${{ steps.initial-custody.outcome }}
          P2PKIT_INITIAL_CUSTODY_SHA256: ${{ steps.initial-custody.outputs.initialCustodySha256 }}
          P2PKIT_INITIAL_CUSTODY_EXPORTER_RETURN_SHA256: ${{ steps.initial-custody.outputs.initialExporterReturnSha256 }}
          P2PKIT_INITIAL_SEAL_OUTCOME: ${{ steps.initial-seal.outcome }}
          P2PKIT_INITIAL_SEAL_SHA256: ${{ steps.initial-seal.outputs.initialSealSha256 }}
          P2PKIT_INITIAL_UPLOAD_BEFORE_OUTCOME: ${{ steps.initial-upload-before.outcome }}
          P2PKIT_INITIAL_UPLOAD_WINDOW_SHA256: ${{ steps.initial-upload-before.outputs.initialUploadWindowSha256 }}
          P2PKIT_INITIAL_UPLOAD_OUTCOME: ${{ steps.initial-evidence.outcome }}
          P2PKIT_INITIAL_ARTIFACT_ID: ${{ steps.initial-evidence.outputs.artifact-id }}
          P2PKIT_INITIAL_ARTIFACT_DIGEST: ${{ steps.initial-evidence.outputs.artifact-digest }}
        run: |
          case "$RUNNER_OS" in
            Windows) exec python -I -B -S scripts/run-hosted-initial-recipient-custody.py upload-after --kind worker ;;
            Linux|macOS) exec python3 -I -B -S scripts/run-hosted-initial-recipient-custody.py upload-after --kind worker ;;
            *) exit 125 ;;
          esac

      # Success of the initializer cannot admit producer/cache work. Earlier
      # failures already stop this normal path; there is no cleanup/build tail.
      - name: Hold the unqualified productive bootstrap
        timeout-minutes: 1
        shell: bash
        run: |
          echo 'INITIAL_RECIPIENT_STAGE1=HOLD; PRODUCTIVE_BOOTSTRAP_NOT_QUALIFIED' >&2
          exit 125
