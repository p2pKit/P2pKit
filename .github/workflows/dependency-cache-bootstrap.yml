name: Dependency cache bootstrap registration only

# Reserved-branch service probe only; never merge this replacement into main or
# integration. Pushing the reviewed commit needs separate execution authority.
# Success would test workflow registration, not admit any bootstrap.
on:
  push:
    branches: [work/register-cache-bootstrap-20260922-24bbe8e9]
    paths: [.github/workflows/dependency-cache-bootstrap.yml]

permissions: {}

jobs:
  registration_only:
    if: ${{ github.repository == 'p2pKit/P2pKit' && github.event_name == 'push' && github.ref == 'refs/heads/work/register-cache-bootstrap-20260922-24bbe8e9' && github.event.created == true && github.event.deleted == false && github.event.before == '0000000000000000000000000000000000000000' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Record registration-only execution without admission
        shell: bash
        run: printf '%s\n' 'CACHE_BOOTSTRAP_REGISTRATION_ONLY; NO_ADMISSION_OR_PROVIDER_EXECUTION'
