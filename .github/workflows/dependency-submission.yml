name: Dependency submission
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  submit:
    if: ${{ github.repository == 'p2pKit/P2pKit' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out exact main source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure Java 21 daemon toolchain
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Java 17 library toolchain
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install reviewed platform tools
        run: bash scripts/setup-ci-component.sh dependencies
      - name: Submit the actual Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-home-cache-excludes: caches/build-cache-1
          # The standard action discovers actual projects; never a hand-written
          # ten/fourteen-project approximation. It defaults to verification=off.
          additional-arguments: --dependency-verification strict
