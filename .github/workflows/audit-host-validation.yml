name: Audit host validation

# Run revision: 18. Change this comment in a reviewed audit-branch push to
# request a new frozen-source run. Helpers/docs-only pushes do not trigger it.
on:
  push:
    branches: [audit/complete-2026-09-04]
    paths: [.github/workflows/audit-host-validation.yml]

permissions:
  contents: read

concurrency:
  group: p2pkit-audit-host-validation
  cancel-in-progress: false

# No setup-gradle/actions cache, publication credentials, PR, tag or dispatch trigger.
# The operator holds the separate global local/remote build lease through upload.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  selected_host:
    name: Audit native Apple provenance reuse and isolated cancellation
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: python3 {0}
    env:
      P2PKIT_AUDIT_ROLE: macos-arm64
      P2PKIT_AUDIT_SCOPE: apple-provenance
      P2PKIT_AUDIT_DRIVER_TIMEOUT_SECONDS: "8400"
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    outputs: &host_outputs
      safe_to_continue: ${{ steps.handoff.outcome == 'success' && steps.handoff.outputs.safe_to_continue == 'true' }}
      artifact_uploaded: ${{ steps.evidence.outcome == 'success' && steps.evidence.outputs['artifact-id'] != '' }}
      artifact_id: ${{ steps.evidence.outputs['artifact-id'] }}
    steps:
      # Named steps keep inline-body checks bound to the executed source.
      - &allocate
        name: Allocate fresh external state parent and bootstrap evidence
        id: allocate
        run: |
          import json
          import os
          from pathlib import Path
          import platform
          import sys
          import tempfile
          from datetime import datetime, timezone

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          if not temporary.is_dir() or temporary.is_relative_to(root):
              raise RuntimeError("RUNNER_TEMP must be outside the source checkout")
          role = os.environ["P2PKIT_AUDIT_ROLE"]
          parent = Path(tempfile.mkdtemp(prefix="p2pkit-audit-" + role + "-", dir=temporary))
          bootstrap = parent / "bootstrap-evidence"
          bootstrap.mkdir(mode=0o700)
          state = parent / "state"  # The driver, not this step, creates/owns state after admission.
          record = {
              "schema": 1, "role": role, "requestedScope": os.environ["P2PKIT_AUDIT_SCOPE"], "startedUtc": datetime.now(timezone.utc).isoformat(),
              "expectedCommit": os.environ["GITHUB_SHA"], "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"], "ref": os.environ["GITHUB_REF"],
              "os": platform.platform(), "architecture": platform.machine(), "python": sys.executable,
              "pythonVersion": platform.python_version(), "imageOS": os.environ.get("ImageOS"),
              "imageVersion": os.environ.get("ImageVersion"), "sourceAdmitted": False,
          }
          with (bootstrap / "workflow-start.json").open("x", encoding="utf-8") as stream:
              json.dump(record, stream, indent=2, allow_nan=False)
              stream.write("\n")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for key, value in (("P2PKIT_AUDIT_BOOTSTRAP_DIR", bootstrap), ("P2PKIT_AUDIT_STATE_DIR", state)):
                  if any(char in str(value) for char in "\r\n\0"):
                      raise RuntimeError("Invalid audit path")
                  stream.write(key + "=" + str(value) + "\n")

      - &checkout
        name: Check out the exact pushed commit without persisted credentials
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - &java21
        name: Configure daemon prerequisite Java 21
        id: java21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - &keep_java21
        name: Retain the Java 21 path before selecting launcher Java 17
        id: keep_java21
        run: |
          import os
          from pathlib import Path

          home = Path(os.environ["JAVA_HOME"]).resolve(strict=True)
          if not home.is_dir() or any(char in str(home) for char in "\r\n\0"):
              raise RuntimeError("Java 21 home is not a usable absolute directory")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write("P2PKIT_AUDIT_JDK21=" + str(home) + "\n")

      - &java17
        name: Configure launcher and library toolchain Java 17
        id: java17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify source-bound Apple reuse and isolated cancellation then finalize ownership
        id: audit
        timeout-minutes: 150
        run: &run_host |
          import os
          from pathlib import Path
          import runpy
          import sys

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          bootstrap = Path(os.environ["P2PKIT_AUDIT_BOOTSTRAP_DIR"])
          driver = root / "scripts/run-audit-host.py"
          if driver.is_symlink() or not driver.is_file():
              raise RuntimeError("Missing exact checked-out host driver")
          sys.stdout.flush()
          sys.stderr.flush()
          for descriptor, name in ((1, "driver.stdout.log"), (2, "driver.stderr.log")):
              with (bootstrap / name).open("xb", buffering=0) as stream:
                  os.dup2(stream.fileno(), descriptor)
          # Same process: no wrapper child can outlive a caught KeyboardInterrupt.
          # The real driver's ownership, deadline and signal finalizers remain in charge.
          os.chdir(root)
          sys.argv = [str(driver), os.environ["P2PKIT_AUDIT_ROLE"], "--timeout-seconds",
                      os.environ["P2PKIT_AUDIT_DRIVER_TIMEOUT_SECONDS"], "--scope", os.environ["P2PKIT_AUDIT_SCOPE"]]
          try:
              runpy.run_path(str(driver), run_name="__main__")
          finally:
              sys.stdout.flush()
              sys.stderr.flush()

      - &handoff
        name: Retain setup outcomes and verify the sealed cleanup handoff
        id: handoff
        if: >-
          ${{ always() && steps.allocate.outcome == 'success' &&
              env.P2PKIT_AUDIT_BOOTSTRAP_DIR != '' && env.P2PKIT_AUDIT_STATE_DIR != '' }}
        env:
          AUDIT_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          AUDIT_JAVA21_OUTCOME: ${{ steps.java21.outcome }}
          AUDIT_KEEP_JAVA21_OUTCOME: ${{ steps.keep_java21.outcome }}
          AUDIT_JAVA17_OUTCOME: ${{ steps.java17.outcome }}
          AUDIT_DRIVER_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_DRIVER_SAFE: ${{ steps.audit.outputs.safe_to_continue }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import sys
          from datetime import datetime, timezone

          MAX_JSON = 4 * 1024 * 1024
          MAX_MANIFEST = 16 * 1024 * 1024
          MAX_FILES = 100000
          MAX_FILE_BYTES = 8 * 1024 ** 3
          MAX_TOTAL_BYTES = 16 * 1024 ** 3
          MAX_SALVAGE_FILES = 10000
          MAX_SALVAGE_FILE_BYTES = 128 * 1024 ** 2
          MAX_SALVAGE_BYTES = 1024 ** 3
          MAX_OMISSION_DETAILS = 256
          PATH_ERRORS = (OSError, ValueError)
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          state = Path(os.environ["P2PKIT_AUDIT_STATE_DIR"])
          bootstrap = Path(os.environ["P2PKIT_AUDIT_BOOTSTRAP_DIR"])
          evidence = state / "evidence"
          role = os.environ["P2PKIT_AUDIT_ROLE"]
          scope = os.environ["P2PKIT_AUDIT_SCOPE"]
          safe, error, summary = False, None, None
          attempt = {"schema": 1, "role": role, "commit": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          outcomes = {name: os.environ.get("AUDIT_" + name.upper() + "_OUTCOME", "")
              for name in ("checkout", "java21", "keep_java21", "java17", "driver")}

          def need(condition, message):
              if not condition:
                  raise ValueError(message)

          def strict_walk(path):
              def fail(error):
                  raise error
              count = 0
              for row in os.walk(path, followlinks=False, onerror=fail):
                  count += len(row[1]) + len(row[2])
                  need(count <= MAX_FILES, "Traversal cap")
                  yield row

          def physical(path):
              need(path.is_absolute() and ".." not in path.parts, "Unsafe absolute path")
              for item in (path, *path.parents):
                  info = item.lstat()
                  need(not stat.S_ISLNK(info.st_mode) and not getattr(info, "st_file_attributes", 0) & 0x400,
                      "Link/reparse path")
              return path.stat()

          def bounded(path, limit):
              info = physical(path)
              need(stat.S_ISREG(info.st_mode) and 0 < info.st_size <= limit, "Invalid control file")
              with path.open("rb") as stream:
                  raw = stream.read(limit + 1)
              need(len(raw) == info.st_size and len(raw) <= limit, "Changed/oversize control")
              return raw

          def pairs(values):
              result = {}
              for key, value in values:
                  need(key not in result, "Duplicate JSON key")
                  result[key] = value
              return result

          def read_json(path):
              value = json.loads(bounded(path, MAX_JSON), object_pairs_hook=pairs,
                  parse_constant=lambda _: need(False, "Nonfinite JSON"))
              need(type(value) is dict, "Non-object control")
              return value

          def safe_name(name):
              parts = PurePosixPath(name)
              need(not parts.is_absolute() and name == parts.as_posix() and
                  all(part not in ("", ".", "..") for part in name.split("/")) and
                  not any(char in name for char in "\\:") and
                  not any(ord(char) < 32 or ord(char) == 127 for char in name),
                  "Unsafe relative path")
              name.encode("utf-8", errors="strict")
              return name

          def state_path():
              need(state.is_absolute() and state.name == "state" and state.parent == bootstrap.parent and
                  not state.is_relative_to(root) and not root.is_relative_to(state),
                  "Wrong allocated state")
              need(stat.S_ISDIR(physical(evidence).st_mode), "Nonphysical evidence root")

          def git(*args):
              env = dict(os.environ)
              for name in ("GIT_DIR", "GIT_WORK_TREE", "GIT_INDEX_FILE", "GIT_OBJECT_DIRECTORY",
                  "GIT_ALTERNATE_OBJECT_DIRECTORIES", "GIT_EXTERNAL_DIFF"):
                  env.pop(name, None)
              return subprocess.check_output(["git", "--no-replace-objects", "-C", str(root), *args],
                  env=env, stderr=subprocess.PIPE, timeout=30)

          def file_hash(path):
              before = physical(path)
              need(stat.S_ISREG(before.st_mode) and before.st_size <= MAX_FILE_BYTES, "Invalid/oversize file")
              value, size = hashlib.sha256(), 0
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(262144), b""):
                      size += len(block)
                      need(size <= MAX_FILE_BYTES, "Growing/oversize file")
                      value.update(block)
              after = physical(path)
              need(size == before.st_size == after.st_size and before.st_mtime_ns == after.st_mtime_ns
                  and before.st_ino == after.st_ino, "Evidence changed")
              return value.hexdigest(), size

          def finalized(receipt, identity=None, purpose=None, status=None):
              need(type(receipt.get("schema")) is int and receipt["schema"] == 1 and
                  type(receipt.get("id")) is str and re.fullmatch(r"[0-9a-f]{32}", receipt["id"]) and
                  receipt.get("jobId") == context["id"] and receipt.get("host") == role, "Wrong invocation identity")
              need((identity is None or receipt["id"] == identity) and
                  (purpose is None or receipt.get("purpose") == purpose), "Wrong invocation binding")
              need(receipt.get("sourceBefore") == current == receipt.get("sourceAfter") and
                  receipt.get("sourceUnchanged") is True, "Invocation source changed")
              need(type(receipt.get("stopExitCode")) is int and receipt["stopExitCode"] == 0 and
                  type(receipt.get("finalExitCode")) is int and receipt["finalExitCode"] != 125 and
                  (status is None or receipt["finalExitCode"] == status) and
                  all(type(receipt.get(key)) is list and receipt[key] == [] for key in ("errors", "ownedSurvivors")),
                  "Unsafe invocation")

          def salvage_text(reason):
              salvage = bootstrap / "evidence-salvage"
              need(not salvage.exists(), "Nonfresh salvage")
              salvage.mkdir(mode=0o700)
              records, omissions, omitted, total = [], [], 0, 0
              candidates, scanned = [], 0

              def omit(name, why):
                  nonlocal omitted
                  omitted += 1
                  if len(omissions) < MAX_OMISSION_DETAILS:
                      omissions.append({"path": str(name)[:4096], "reason": str(why)[:4096]})

              try:
                  state_path()
                  pending = [evidence]
                  while pending:
                      directory = pending.pop()
                      try:
                          need(stat.S_ISDIR(physical(directory).st_mode), "Not a physical directory")
                          with os.scandir(directory) as entries:
                              for entry in entries:
                                  scanned += 1
                                  need(scanned <= MAX_FILES, "Salvage entry cap")
                                  path = directory / entry.name
                                  name = path.relative_to(evidence).as_posix()
                                  try:
                                      safe_name(name)
                                      info = physical(path)
                                      if stat.S_ISDIR(info.st_mode):
                                          pending.append(path)
                                      elif not stat.S_ISREG(info.st_mode):
                                          omit(name, "Nonregular evidence node")
                                      elif path.suffix not in (".json", ".log", ".txt", ".xml", ".sha256"):
                                          omit(name, "Not allowed text")
                                      else:
                                          candidates.append(path)
                                  except PATH_ERRORS as failure:
                                      omit(name, type(failure).__name__ + ": " + str(failure))
                      except PATH_ERRORS as failure:
                          omit(directory.relative_to(evidence).as_posix(), failure)
                          if scanned > MAX_FILES:
                              pending.clear()
              except PATH_ERRORS as failure:
                  omit(".", "Evidence root unavailable: " + str(failure))

              priority = {"receipt.json", "start.json", "context.json", "admission.json", "host-summary.json",
                  "product.stdout.log", "product.stderr.log", "stop.stdout.log", "stop.stderr.log"}
              candidates.sort(key=lambda path: (path.name not in priority,
                  len(path.relative_to(evidence).parts),
                  path.relative_to(evidence).as_posix()))
              for path in candidates:
                  name = path.relative_to(evidence).as_posix()
                  target = salvage / "files" / name
                  created = False
                  try:
                      before = physical(path)
                      need(stat.S_ISREG(before.st_mode) and before.st_size <= MAX_SALVAGE_FILE_BYTES,
                          "Invalid salvage file")
                      need(len(records) < MAX_SALVAGE_FILES and total + before.st_size <= MAX_SALVAGE_BYTES,
                          "Salvage size cap")
                      parent = salvage
                      for part in ("files", *PurePosixPath(name).parts[:-1]):
                          parent = parent / part
                          try:
                              parent.mkdir(mode=0o700)
                          except FileExistsError:
                              pass
                          need(stat.S_ISDIR(physical(parent).st_mode), "Unsafe salvage directory")
                      value, size = hashlib.sha256(), 0
                      with path.open("rb") as incoming, target.open("xb") as outgoing:
                          created = True
                          for block in iter(lambda: incoming.read(262144), b""):
                              size += len(block)
                              need(size <= MAX_SALVAGE_FILE_BYTES and total + size <= MAX_SALVAGE_BYTES,
                                  "Salvage file grew")
                              outgoing.write(block)
                              value.update(block)
                          outgoing.flush()
                          os.fsync(outgoing.fileno())
                      after = physical(path)
                      need(size == before.st_size == after.st_size and before.st_mtime_ns == after.st_mtime_ns
                          and before.st_ino == after.st_ino, "Salvage source changed")
                      copied, copied_size = file_hash(target)
                      need(copied == value.hexdigest() and copied_size == size, "Salvage copy changed")
                      records.append({"path": target.relative_to(salvage).as_posix(), "sha256": copied, "bytes": size})
                      total += size
                  except PATH_ERRORS as failure:
                      omit(name, type(failure).__name__ + ": " + str(failure))
                      if created:
                          try:
                              need(stat.S_ISREG(physical(target).st_mode), "Partial copy changed")
                              target.unlink()
                          except PATH_ERRORS as removal_failure:
                              raise ValueError("Unsafe partial-copy removal") from removal_failure

              details = {
                  **attempt,
                  "fullTreeCompleteness": "NOT_PROVEN", "reason": reason,
                  "retainedFiles": len(records), "retainedBytes": total,
                  "omissionCount": omitted, "omissions": omissions,
                  "omissionDetailsTruncated": omitted > len(omissions),
                  "limits": {"files": MAX_SALVAGE_FILES, "fileBytes": MAX_SALVAGE_FILE_BYTES,
                  "totalBytes": MAX_SALVAGE_BYTES, "traversedEntries": MAX_FILES},
                  "limitation": "Partial historical text; no cleanup, completeness or acceptance proof.",
              }
              with (salvage / "salvage-summary.json").open("x", encoding="utf-8") as stream:
                  json.dump(details, stream, indent=2, allow_nan=False)
                  stream.write("\n")
              checksum, size = file_hash(salvage / "salvage-summary.json")
              records.append({"path": "salvage-summary.json", "sha256": checksum, "bytes": size})
              with (salvage / "manifest.sha256").open("x", encoding="utf-8") as stream:
                  for row in sorted(records, key=lambda row: row["path"]):
                      stream.write(row["sha256"] + "  " + row["path"] + "\n")
              details["manifestSha256"] = file_hash(salvage / "manifest.sha256")[0]
              return details

          try:
              need(bootstrap.is_absolute() and bootstrap.name == "bootstrap-evidence" and
                  bootstrap.parent.name.startswith("p2pkit-audit-" + role + "-") and
                  not bootstrap.is_relative_to(root) and not root.is_relative_to(bootstrap.parent) and
                  stat.S_ISDIR(physical(bootstrap).st_mode), "Wrong bootstrap allocation")
              allocation = read_json(bootstrap / "workflow-start.json")
              need(type(allocation.get("schema")) is int and allocation["schema"] == 1 and
                  allocation.get("role") == role and allocation.get("requestedScope") == scope and
                  allocation.get("expectedCommit") == attempt["commit"] and
                  allocation.get("runId") == attempt["runId"] and
                  allocation.get("runAttempt") == attempt["runAttempt"], "Bootstrap allocation differs")
          except (OSError, ValueError, KeyError, TypeError) as failure:
              print("FATAL: unsafe bootstrap: " + str(failure), file=sys.stderr)
              raise SystemExit(1)

          try:
              need(all(outcomes[name] == "success" for name in ("checkout", "java21", "keep_java21", "java17")),
                  "Setup failed")
              need(outcomes["driver"] in ("success", "failure") and os.environ.get("AUDIT_DRIVER_SAFE") == "true",
                  "Unsafe driver output")
              state_path()
              manifest = {}
              for line in bounded(evidence / "manifest.sha256", MAX_MANIFEST).decode("utf-8").splitlines():
                  match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
                  need(match is not None, "Malformed manifest record")
                  name = safe_name(match[2])
                  need(name != "manifest.sha256", "Self-referential manifest path")
                  need(name not in manifest and len(manifest) < MAX_FILES, "Manifest duplicate/cap")
                  manifest[name] = match[1]
              need(manifest, "Empty evidence manifest")
              observed = set()
              total = 0
              for directory, children, files in strict_walk(evidence):
                  for name in children:
                      need(stat.S_ISDIR(physical(Path(directory) / name).st_mode), "Invalid directory")
                  for name in files:
                      path = Path(directory) / name
                      physical(path)
                      if path == evidence / "manifest.sha256":
                          continue
                      rel = path.relative_to(evidence).as_posix()
                      need(rel in manifest and len(observed) < MAX_FILES, "Unlisted/capped evidence")
                      actual, size = file_hash(path)
                      need(actual == manifest[rel], "Evidence hash mismatch")
                      total += size
                      need(total <= MAX_TOTAL_BYTES, "Evidence size cap")
                      observed.add(rel)
              need(observed == set(manifest), "Missing manifest files")
              summary = read_json(evidence / "host-summary.json")
              need(type(summary.get("schema")) is int and summary["schema"] == 1, "Bad summary schema")
              need(summary.get("role") == role and summary.get("safeToContinue") is True, "Unsafe/wrong-role summary")
              need(summary.get("requestedScope") == scope and summary.get("hostQualification") ==
                  ("FULL_COMPONENT_SCOPE" if scope == "full" else "NOT_ESTABLISHED_BY_FOCUSED_SCOPE"),
                  "Wrong scope/qualification")
              need(summary.get("result") in ("PASS", "FAIL"), "Unknown result")
              expected = "success" if summary["result"] == "PASS" else "failure"
              need(outcomes["driver"] == expected, "Step/result mismatch")
              current = {
                  "commit": git("rev-parse", "HEAD").decode("ascii").strip(),
                  "tree": git("rev-parse", "HEAD^{tree}").decode("ascii").strip(),
                  "status": git("status", "--porcelain=v1", "--untracked-files=all").decode("utf-8", errors="surrogateescape"),
                  "diffSha256": hashlib.sha256(git("diff", "--binary", "--no-ext-diff", "--no-textconv", "HEAD", "--")).hexdigest(),
              }
              need(current["commit"] == attempt["commit"] and current["status"] == "" and
                  current["diffSha256"] == hashlib.sha256(b"").hexdigest() and
                  re.fullmatch(r"[0-9a-f]{40}", current["tree"]), "Wrong/dirty source")
              source = summary.get("source")
              need(type(source) is dict and all(source.get(key) == value for key, value in {
                  "commit": current["commit"], "tree": current["tree"], "role": role, "requestedScope": scope,
                  "ref": "refs/heads/audit/complete-2026-09-04", "runId": attempt["runId"],
                  "runAttempt": attempt["runAttempt"],
              }.items()) and summary.get("sourceAfter") == current, "Source/attempt differs")
              context = read_json(evidence / "context.json")
              need(type(context.get("schema")) is int and context["schema"] == 1 and context.get("host") == role and
                  context.get("expectedCommit") == current["commit"] and context.get("tree") == current["tree"] and
                  context.get("source") == current and context.get("root") == str(root) and
                  type(context.get("id")) is str and re.fullmatch(r"[0-9a-f]{32}", context["id"]), "Wrong context")
              rows = summary.get("components")
              need(type(rows) is list and rows, "No components")
              names = set()
              for row in rows:
                  need(type(row) is dict and type(row.get("component")) is str and
                      re.fullmatch(r"[a-z0-9-]+", row["component"]) and row["component"] not in names and
                      row.get("result") in ("PASS", "FAIL"), "Invalid/duplicate component")
                  names.add(row["component"])
                  if row.get("inspectionOnly") is True:
                      need("cleanupComplete" not in row and "exitCode" not in row, "Mixed inspection/command row")
                      continue
                  need("inspectionOnly" not in row and row.get("cleanupComplete") is True and
                      type(row.get("exitCode")) is int and row["exitCode"] != 125 and
                      row["result"] == ("PASS" if row["exitCode"] == 0 else "FAIL"), "Unsafe command")
                  need(row.get("receipt") == "host-" + row["component"] + ".json", "Wrong receipt path")
                  receipt = read_json(evidence / row["receipt"])
                  finalized(receipt, purpose=row["component"], status=row["exitCode"])
                  need(file_hash(evidence / row["receipt"])[0] ==
                      file_hash(evidence / receipt["id"] / "receipt.json")[0], "Receipt copies differ")
              leaves = 0
              for directory in evidence.iterdir():
                  if not re.fullmatch(r"[0-9a-f]{32}", directory.name):
                      continue
                  need(stat.S_ISDIR(physical(directory).st_mode), "Invalid invocation dir")
                  receipt = read_json(directory / "receipt.json")
                  finalized(receipt, identity=directory.name)
                  leaves += 1
              need(leaves > 0, "No retained finalized leaves")
              need(any(row["component"] == "executor-native-controls" and row["result"] == "PASS" and
                  row.get("inspectionOnly") is not True for row in rows),
                  "Native controls failed")
              need(summary["result"] != "PASS" or all(row["result"] == "PASS" for row in rows),
                  "False PASS summary")
              need(summary.get("releaseGateMonolith") == "NOT_EXECUTED_COMPONENT_REPLAY", "Unexpected gate scope")
              safe = True
          except (OSError, ValueError, KeyError, TypeError, subprocess.SubprocessError) as failure:
              error = type(failure).__name__ + ": " + str(failure)[:4096]
          salvage = None
          if not safe:
              salvage = salvage_text(error or "Driver cleanup/source/evidence handoff is not proved")
          record = {
              **attempt, "requestedScope": scope, "finishedUtc": datetime.now(timezone.utc).isoformat(),
              "setupAndDriverOutcomes": outcomes,
              "driverSafeOutput": os.environ.get("AUDIT_DRIVER_SAFE", ""),
              "safeToContinue": safe, "handoffError": error,
              "evidenceUploadKind": "FULL_SEALED" if safe else
              "PARTIAL_SALVAGE" if salvage["retainedFiles"] else "BOOTSTRAP_ONLY",
              "fullTreeCompleteness": "PROVED" if safe else "NOT_PROVEN", "salvage": salvage,
              "hostResult": summary.get("result") if type(summary) is dict else None,
              "limitation": "Upload also required; not product/release/physical acceptance.",
          }
          with (bootstrap / "workflow-handoff.json").open("x", encoding="utf-8") as stream:
              json.dump(record, stream, indent=2, allow_nan=False)
              stream.write("\n")
          hashes, bsize = {}, 0
          for directory, children, files in strict_walk(bootstrap):
              for name in children:
                  path = Path(directory) / name
                  need(stat.S_ISDIR(physical(path).st_mode) and
                      path.relative_to(bootstrap).parts[0] == "evidence-salvage", "Wrong bootstrap dir")
              for name in files:
                  path = Path(directory) / name
                  rel = safe_name(path.relative_to(bootstrap).as_posix())
                  need(rel.split("/")[0] in ("workflow-start.json", "workflow-handoff.json",
                      "driver.stdout.log", "driver.stderr.log", "evidence-salvage"), "Wrong bootstrap file")
                  checksum, size = file_hash(path)
                  bsize += size
                  need(len(hashes) < MAX_FILES and bsize <= MAX_TOTAL_BYTES,
                      "Bootstrap size cap")
                  hashes[rel] = checksum
          with (bootstrap / "bootstrap-manifest.sha256").open("x", encoding="utf-8") as stream:
              for name, checksum in sorted(hashes.items()):
                  stream.write(checksum + "  " + name + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write("bootstrap_path=" + str(bootstrap) + "\n")
              stream.write("driver_evidence_path=" + (str(evidence) if safe else "") + "\n")
              stream.write("safe_to_continue=" + ("true" if safe else "false") + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write(f"{role}: {record['hostResult']}, safe={safe}. Not release/physical acceptance.\n")
          if not safe:
              raise SystemExit(1)

      - &evidence
        name: Always retain only owned bootstrap and driver evidence
        id: evidence
        # Use only the proved regular bootstrap/salvage and (when safe) complete
        # driver tree. Never let this action follow a rejected evidence symlink.
        # Failed allocation/path proof leaves job logs and cannot release a host.
        if: >-
          ${{ always() && steps.allocate.outcome == 'success' &&
              steps.handoff.outputs.bootstrap_path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-host-${{ env.P2PKIT_AUDIT_ROLE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.handoff.outputs.bootstrap_path }}
            ${{ steps.handoff.outputs.driver_evidence_path }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 14
