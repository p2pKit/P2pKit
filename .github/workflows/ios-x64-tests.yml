name: Diagnostic Intel Simulator loopback DNS-SD route

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-loopback-route-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  loopback-route-probe:
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    runs-on: macos-15-intel
    # Diagnostic branch only: this is not the canonical ios-x64 qualification job.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Execute one Simulator loopback route diagnostic
        id: loopback-route-probe
        run: python3 scripts/run-ios-dns-sd-loopback-probe.py

      - name: Upload loopback diagnostic evidence
        id: loopback-route-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-loopback-route-probe-${{ github.run_attempt }}
          path: build/reports/ios-dns-sd-loopback-probe/**
          if-no-files-found: error
          retention-days: 7
