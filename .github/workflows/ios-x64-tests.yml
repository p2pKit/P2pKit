name: Intel iOS simulator tests
on:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'
permissions:
  contents: read
  actions: read
jobs:
  component:
    name: apple-x64
    uses: ./.github/workflows/ci-component.yml
    with:
      component: apple-x64
      runner: macos-15-intel
      minutes: 120
      job_minutes: 130
