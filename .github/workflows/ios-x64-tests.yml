name: DIAGNOSTIC Intel ordinary Bonjour versus include-TXT descriptors

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-x64-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-x64:
    name: DIAGNOSTIC BARE browser descriptor pair - not native qualification
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out exact isolated diagnostic source
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compare fixed BONJOUR and WITH_TXT CLI arms once and retire owned resources
        timeout-minutes: 37
        shell: bash
        run: |
          umask 077
          mkdir -p build/reports/intel-lan-host
          python3 -I -B -S scripts/diagnostics/intel-lan-host/run.py \
            2>build/reports/intel-lan-host/controller.stderr

      - name: Upload DIAGNOSTIC originals - no native qualification
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-x64-browser-descriptor-${{ github.run_attempt }}-DIAGNOSTIC
          path: build/reports/intel-lan-host/**
          if-no-files-found: error
          retention-days: 7
