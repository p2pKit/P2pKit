name: Intel iOS simulator tests

on:
  workflow_dispatch:
    inputs:
      diagnostics-only:
        description: "Read-only Intel Bonjour environment observations; NOT qualification"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ios-x64-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostics-only != true }}
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Install Android SDKs for project configuration
        run: |
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'platforms;android-37.0'

      - name: Verify offline configuration transaction controls
        id: check-intel-advertising
        run: |
          python3 -I -S -B scripts/tests/rpc-apple-bonjour-environment-test.py
          python3 -I -S -B scripts/tests/intel-bonjour-advertising-test.py

      - name: Prepare reversible ordinary-runner Bonjour advertising
        id: prepare-intel-advertising
        run: python3 -I -S -B scripts/with-intel-bonjour-advertising.py prepare

      - name: Execute Intel simulator suites
        id: platform-tests
        run: python3 scripts/run-platform-tests.py ios-x64

      - name: Stop Gradle after tests
        id: stop-platform-gradle
        if: ${{ always() }}
        run: ./gradlew --stop

      - name: Restore the original Bonjour advertising preference
        id: restore-intel-advertising
        if: ${{ always() }}
        run: python3 -I -S -B scripts/with-intel-bonjour-advertising.py restore

      - name: Upload closed Bonjour configuration observations
        id: intel-advertising-report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-advertising-configuration-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpc-intel-bonjour-advertising-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Intel test evidence
        id: platform-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-x64-tests-${{ github.run_attempt }}
          path: |
            build/reports/platform-tests/**
            library/p2p-core/build/test-results/iosX64Test/**
            library/p2p-transport-lan/build/test-results/iosX64Test/**
            library/p2p-rpc/build/test-results/iosX64Test/**
            samples/p2p-sample-rpc/build/test-results/iosX64Test/**
          if-no-files-found: warn
          retention-days: 7

  intel-environment-diagnostics:
    name: Intel Bonjour environment (READ ONLY, NOT QUALIFICATION)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics-only == true }}
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - name: Check out the exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check offline refusal and output-schema controls
        timeout-minutes: 1
        run: python3 -I -S -B scripts/tests/intel-bonjour-environment-test.py

      - name: Observe protected Bonjour configuration without changing it
        timeout-minutes: 2
        run: python3 -I -S -B scripts/diagnose-intel-bonjour-environment.py

      - name: Upload only closed read-only observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-bonjour-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpc-intel-bonjour-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
