name: Optional RPC remaining qualification

# Distinct owner-authorized feature queue. No Foundation/campaign/release jobs.
# Ordinary feature pushes register this workflow but allocate no runner.
on:
  push:
    branches: [work/rpc-lan-20260927-054728-8b1b11da]

permissions:
  contents: read

concurrency:
  group: rpc-remaining-qualification-${{ github.ref }}-${{ (contains(github.event.head_commit.message, '[rpc-admit]') || contains(github.event.head_commit.message, '[rpc-apple-admit]') || contains(github.event.head_commit.message, '[rpc-intel-admit]')) && 'admission' || contains(github.event.head_commit.message, '[rpc-intel-qualify]') && 'intel-product' || contains(github.event.head_commit.message, '[rpc-arm-qualify]') && 'arm-product' || 'product' }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.repository == 'p2pKit/P2pKit' &&
      github.ref == 'refs/heads/work/rpc-lan-20260927-054728-8b1b11da' &&
      github.event_name == 'push' && !github.event.deleted &&
      (contains(github.event.head_commit.message, '[rpc-qualify]') || contains(github.event.head_commit.message, '[rpc-admit]') || contains(github.event.head_commit.message, '[rpc-art]') || contains(github.event.head_commit.message, '[rpc-apple-admit]') || contains(github.event.head_commit.message, '[rpc-intel-admit]') || contains(github.event.head_commit.message, '[rpc-apple-qualify]') || contains(github.event.head_commit.message, '[rpc-intel-qualify]') || contains(github.event.head_commit.message, '[rpc-arm-qualify]') || contains(github.event.head_commit.message, '[rpc-intel-investigate]') || contains(github.event.head_commit.message, '[rpc-intel-native-investigate]') || contains(github.event.head_commit.message, '[rpc-intel-network-investigate]'))
    name: ${{ matrix.lane }}${{ matrix.investigation && format(' ({0} diagnostic)', matrix.investigation) || '' }} (feature only, not release or capacity)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Scoped ART and Apple-diagnostic requests must not repeat unrelated lanes.
      matrix: ${{ fromJSON(contains(github.event.head_commit.message, '[rpc-intel-investigate]') && '{"include":[{"lane":"apple-x64","os":"macos-15-intel","developer":"/Applications/Xcode_26.3.app/Contents/Developer","investigation":"native"},{"lane":"apple-x64","os":"macos-15-intel","developer":"/Applications/Xcode_26.3.app/Contents/Developer","investigation":"cold-boot"}]}' || contains(github.event.head_commit.message, '[rpc-intel-native-investigate]') && '{"include":[{"lane":"apple-x64","os":"macos-15-intel","developer":"/Applications/Xcode_26.3.app/Contents/Developer","investigation":"native"}]}' || contains(github.event.head_commit.message, '[rpc-intel-network-investigate]') && '{"include":[{"lane":"apple-x64","os":"macos-15-intel","developer":"/Applications/Xcode_26.3.app/Contents/Developer","investigation":"network"}]}' || (contains(github.event.head_commit.message, '[rpc-intel-admit]') || contains(github.event.head_commit.message, '[rpc-intel-qualify]')) && '{"include":[{"lane":"apple-x64","os":"macos-15-intel","developer":"/Applications/Xcode_26.3.app/Contents/Developer"}]}' || contains(github.event.head_commit.message, '[rpc-arm-qualify]') && '{"include":[{"lane":"apple-arm64","os":"macos-26","developer":"/Applications/Xcode_26.5.app/Contents/Developer"}]}' || contains(github.event.head_commit.message, '[rpc-art]') && '{"include":[{"lane":"android-art","os":"ubuntu-24.04","developer":""}]}' || (contains(github.event.head_commit.message, '[rpc-apple-admit]') || contains(github.event.head_commit.message, '[rpc-intel-admit]') || contains(github.event.head_commit.message, '[rpc-apple-qualify]') || contains(github.event.head_commit.message, '[rpc-intel-qualify]')) && '{"include":[{"lane":"apple-arm64","os":"macos-26","developer":"/Applications/Xcode_26.5.app/Contents/Developer"},{"lane":"apple-x64","os":"macos-15-intel","developer":"/Applications/Xcode_26.3.app/Contents/Developer"}]}' || '{"include":[{"lane":"apple-arm64","os":"macos-26","developer":"/Applications/Xcode_26.5.app/Contents/Developer"},{"lane":"apple-x64","os":"macos-15-intel","developer":"/Applications/Xcode_26.3.app/Contents/Developer"},{"lane":"android-art","os":"ubuntu-24.04","developer":""}]}') }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      DEVELOPER_DIR: ${{ matrix.developer }}
      RPC_INTEL_INVESTIGATION: ${{ matrix.investigation || '' }}
      # Explicit experiment, not the production/default execution context.
      RPC_APPLE_SSH_CONTEXT: 'false'
      RPC_APPLE_LAUNCHD_CONTEXT: ${{ matrix.investigation == 'network' }}
      RPC_ADMISSION_ONLY: ${{ contains(github.event.head_commit.message, '[rpc-admit]') || contains(github.event.head_commit.message, '[rpc-apple-admit]') || contains(github.event.head_commit.message, '[rpc-intel-admit]') }}
      RPC_QUALIFY_REQUESTED: ${{ (contains(github.event.head_commit.message, '[rpc-qualify]') || contains(github.event.head_commit.message, '[rpc-admit]') || contains(github.event.head_commit.message, '[rpc-art]') || contains(github.event.head_commit.message, '[rpc-apple-admit]') || contains(github.event.head_commit.message, '[rpc-intel-admit]') || contains(github.event.head_commit.message, '[rpc-apple-qualify]') || contains(github.event.head_commit.message, '[rpc-intel-qualify]') || contains(github.event.head_commit.message, '[rpc-arm-qualify]') || contains(github.event.head_commit.message, '[rpc-intel-investigate]') || contains(github.event.head_commit.message, '[rpc-intel-native-investigate]') || contains(github.event.head_commit.message, '[rpc-intel-network-investigate]')) }}
    steps:
      - name: Check out the exact feature source without stored credentials or tags
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Fetch only complete main and feature history without tags
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git config remote.origin.tagOpt --no-tags
          git fetch --no-tags --unshallow origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/work/rpc-lan-20260927-054728-8b1b11da:refs/remotes/origin/work/rpc-lan-20260927-054728-8b1b11da
          test "$(git rev-parse --is-shallow-repository)" = false
          test -z "$(git for-each-ref --format='%(refname)' refs/tags)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Allocate fresh private job state without restoring caches
        id: allocate
        timeout-minutes: 1
        run: |
          set -euo pipefail
          parent=$(mktemp -d "$RUNNER_TEMP/rpc-qualification.XXXXXXXX")
          mkdir "$parent/java-settings"
          printf 'RPC_QUALIFICATION_PARENT=%s\n' "$parent" >> "$GITHUB_ENV"

      - name: Install the native Gradle daemon toolchain
        timeout-minutes: 10
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          settings-path: ${{ env.RPC_QUALIFICATION_PARENT }}/java-settings

      - name: Retain the daemon toolchain selection
        run: printf 'P2PKIT_AUDIT_JDK21=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install the native launcher and library compiler
        timeout-minutes: 10
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          settings-path: ${{ env.RPC_QUALIFICATION_PARENT }}/java-settings

      - name: Check offline admission and public-evidence controls
        timeout-minutes: 3
        run: |
          python3 scripts/tests/run-rpc-qualification-test.py
          python3 scripts/tests/rpc-product-diagnostics-test.py
          python3 scripts/tests/rpc-apple-network-diagnostics-test.py
          python3 scripts/tests/analyze-rpc-capacity-diagnostics-test.py
          python3 scripts/tests/with-darwin-audit-session-test.py
          python3 scripts/tests/with-darwin-ssh-context-test.py
          python3 scripts/tests/with-darwin-launchd-context-test.py

      - name: Execute source-bound native admission and original bounded gates
        id: execution
        timeout-minutes: 325
        run: |
          args=()
          if test "$RPC_ADMISSION_ONLY" = true; then args+=(--admission-only); fi
          if test -n "$RPC_INTEL_INVESTIGATION"; then args+=(--intel-investigation "$RPC_INTEL_INVESTIGATION"); fi
          if test '${{ matrix.lane }}' != android-art; then
            # Process-local session setup drops all setup privilege BEFORE the
            # unchanged native admission, observer, tests and cleanup execute.
            if test "$RPC_APPLE_LAUNCHD_CONTEXT" = true; then
              python3 scripts/with-darwin-launchd-context.py --parent "$RPC_QUALIFICATION_PARENT" \
                --lane '${{ matrix.lane }}' "${args[@]}"
            elif test "$RPC_APPLE_SSH_CONTEXT" = true; then
              python3 scripts/with-darwin-ssh-context.py --parent "$RPC_QUALIFICATION_PARENT" \
                --lane '${{ matrix.lane }}' "${args[@]}"
            else
              python3 scripts/with-darwin-audit-session.py --parent "$RPC_QUALIFICATION_PARENT" -- \
                python3 scripts/run-rpc-qualification.py run --lane '${{ matrix.lane }}' "${args[@]}"
            fi
          else
            python3 scripts/run-rpc-qualification.py run --lane '${{ matrix.lane }}' "${args[@]}"
          fi

      - name: Select only bounded, sanitized counts and source-bound verdicts
        if: ${{ always() && steps.allocate.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          args=()
          if test "$RPC_ADMISSION_ONLY" = true; then args+=(--admission-only); fi
          if test -n "$RPC_INTEL_INVESTIGATION"; then args+=(--intel-investigation "$RPC_INTEL_INVESTIGATION"); fi
          python3 scripts/run-rpc-qualification.py collect --lane '${{ matrix.lane }}' "${args[@]}"

      - name: Upload only the explicit public summary, never raw evidence or binaries
        if: ${{ always() && steps.allocate.outcome == 'success' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpc-qualification-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}${{ matrix.investigation && format('-intel-{0}', matrix.investigation) || '' }}
          path: ${{ env.RPC_QUALIFICATION_PARENT }}/public/summary.json
          if-no-files-found: warn
          retention-days: 7
