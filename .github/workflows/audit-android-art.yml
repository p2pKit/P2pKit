name: Audit Android ART smoke

# Run revision: 2. A reviewed change to this file plus [audit-art] in the
# pushed head commit message requests one run; other pushes do not run this job.
# Separate opt-in slice: never replace the required CI/release or physical matrix.
on:
  push:
    branches: [audit/complete-2026-09-04]
    paths: [.github/workflows/audit-android-art.yml]

permissions:
  contents: read

# Same repository-wide hosted audit queue as Mac/Windows; the operator also
# holds the cooperative local/remote build lease until evidence is retained.
concurrency:
  group: p2pkit-audit-host-validation
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  android_art:
    name: API37 permission/lifecycle and API37/24/25 repeated export (emulator only)
    if: ${{ github.repository == 'p2pKit/P2pKit' && github.event_name == 'push' && !github.event.deleted && contains(github.event.head_commit.message, '[audit-art]') }}
    runs-on: ubuntu-24.04
    # 20m setup + 135m owned command + 12m finalization/upload + 3m runner margin.
    timeout-minutes: 170
    defaults:
      run:
        shell: bash
    steps:
      - name: Allocate isolated state and safe bootstrap evidence
        id: allocate
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          parent=$(mktemp -d "$RUNNER_TEMP/p2pkit-android-art.XXXXXXXX")
          mkdir "$parent/bootstrap"
          printf 'P2PKIT_AUDIT_STATE_DIR=%s/state\nP2PKIT_AUDIT_BOOTSTRAP_DIR=%s/bootstrap\n' "$parent" "$parent" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$parent/bootstrap/expected-commit.txt"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$parent/bootstrap/run.txt"
          printf 'bootstrap=%s/bootstrap\n' "$parent" >> "$GITHUB_OUTPUT"

      - name: Check out the exact candidate without retained credentials
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Gradle daemon Java 21
        timeout-minutes: 5
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Keep the daemon toolchain path
        timeout-minutes: 1
        run: printf 'P2PKIT_AUDIT_JDK21=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Configure launcher and compiler Java 17
        timeout-minutes: 5
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Admit source and isolated Gradle ownership
        id: init
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 scripts/run-audit-command.py init --root "$GITHUB_WORKSPACE" \
            --state "$P2PKIT_AUDIT_STATE_DIR" --expected-commit "$GITHUB_SHA" --host linux-x64
          cp -- "$P2PKIT_AUDIT_STATE_DIR/context.json" "$P2PKIT_AUDIT_BOOTSTRAP_DIR/context.json"

      - name: Admit KVM for this hosted job user
        id: kvm
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test -c /dev/kvm
          getfacl -p /dev/kvm > "$P2PKIT_AUDIT_BOOTSTRAP_DIR/kvm-original.acl"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Build one APK and execute three sequential source-bound ART scenarios
        id: smoke
        timeout-minutes: 135
        run: |
          set -euo pipefail
          python3 scripts/run-audit-command.py --cwd "$GITHUB_WORKSPACE" \
            --wrapper "$GITHUB_WORKSPACE/gradlew" --kind command --purpose android-art \
            --timeout 7200 --receipt "$P2PKIT_AUDIT_BOOTSTRAP_DIR/command-receipt.json" -- \
            python3 scripts/run-android-art-smoke.py run

      - name: Restore the original hosted KVM access policy
        timeout-minutes: 2
        if: ${{ always() && steps.allocate.outcome == 'success' }}
        run: |
          set -euo pipefail
          original="$P2PKIT_AUDIT_BOOTSTRAP_DIR/kvm-original.acl"
          if test -f "$original"; then
            sudo setfacl --restore="$original"
            getfacl -p /dev/kvm > "$P2PKIT_AUDIT_BOOTSTRAP_DIR/kvm-final.acl"
            cmp "$original" "$P2PKIT_AUDIT_BOOTSTRAP_DIR/kvm-final.acl"
            touch "$P2PKIT_AUDIT_BOOTSTRAP_DIR/kvm-restored"
          fi

      - name: Preserve verdict and clean only proved owned disposable state
        id: finalize
        timeout-minutes: 5
        if: ${{ always() && steps.init.outcome == 'success' }}
        run: python3 scripts/run-android-art-smoke.py finalize

      - name: Retain bounded safe evidence on success or failure
        timeout-minutes: 5
        if: ${{ always() && steps.allocate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-android-art-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.allocate.outputs.bootstrap }}/expected-commit.txt
            ${{ steps.allocate.outputs.bootstrap }}/run.txt
            ${{ steps.allocate.outputs.bootstrap }}/context.json
            ${{ steps.allocate.outputs.bootstrap }}/kvm-*.acl
            ${{ steps.allocate.outputs.bootstrap }}/kvm-restored
            ${{ steps.allocate.outputs.bootstrap }}/command-receipt.json
            ${{ steps.allocate.outputs.bootstrap }}/android-art-final.json
            ${{ steps.allocate.outputs.bootstrap }}/cache-cleanup-*-start.json
            ${{ steps.allocate.outputs.bootstrap }}/evidence-sha256.json
            ${{ steps.finalize.outputs.evidence }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 14
