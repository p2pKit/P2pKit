name: Release dry run

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag to validate without publishing remotely
        required: true
        type: string
      release_sha:
        description: Exact lowercase 40-hex commit already contained in main
        required: true
        type: string

permissions:
  contents: read

jobs:
  local-release:
    # Qualification already executed the actual platform tests and packages.
    # A dry run verifies that exact result, ancestry and coordinate availability.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Validate immutable release inputs
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out exact approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release identity
        run: |
          scripts/check-release-identity.sh "$RELEASE_TAG" "$RELEASE_SHA" allow-missing-tag
          scripts/check-release-metadata.sh
          scripts/check-maven-central-version.sh absent
      - name: Verify current exact-source qualification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_QUALIFICATION_BINDING: ${{ vars.RELEASE_QUALIFICATION_BINDING }}
        run: python3 -B scripts/ci_qualification.py verify --source "$RELEASE_SHA" --output "$RUNNER_TEMP/qualification.json"
      - name: Retain secret-free qualification reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evidence-${{ env.RELEASE_TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
