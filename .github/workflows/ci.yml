name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  # Pushes/manual runs must not cancel the weekly default-branch backstop.
  # Keep ordinary per-ref supersession, but let a running schedule finish.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || 'change' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  initial-recipient-interlock:
    permissions: {}
    runs-on: "ubuntu-latest"
    timeout-minutes: 1
    steps:
      - name: "Hold whole JVM jobs until initial-recipient admission is implemented"
        shell: "bash"
        run: |
          echo 'INITIAL_RECIPIENT_STAGE2=HOLD; WHOLE_JVM_JOB_ADMISSION_REQUIRED' >&2
          exit 125
  recipient-route:
    needs: "initial-recipient-interlock"
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    timeout-minutes: 6
    outputs:
      origin: "${{ steps.source-mode.outputs.origin }}"
      route_sha256: "${{ steps.source-mode.outputs.route_sha256 }}"
    steps:
      - name: "Check out exact event source"
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: "Select trusted policy origin without worker authority"
        id: "source-mode"
        timeout-minutes: 3
        shell: "bash"
        run: "python3 -I -B -S scripts/run-hosted-recipient-routing.py source-mode --profile full"
  initial-recipient-gate:
    needs:
      - "initial-recipient-interlock"
      - "recipient-route"
    if: "${{ !cancelled() && needs.initial-recipient-interlock.result == 'success' && needs.recipient-route.result == 'success' && needs.recipient-route.outputs.origin == 'initial' }}"
    permissions:
      contents: "read"
      actions: "read"
    environment: "initial-recipient-execution"
    runs-on: "ubuntu-latest"
    timeout-minutes: 6
    outputs:
      initial_gate_ready: "${{ steps.initial-current.outputs.initial_gate_ready }}"
      initial_gate_sha256: "${{ steps.initial-current.outputs.initial_gate_sha256 }}"
    steps:
      - name: "Check out exact event source"
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: "Acquire the original protected initial-recipient gate"
        id: "initial-current"
        timeout-minutes: 3
        shell: "bash"
        env:
          P2PKIT_ACTIONS_READ_TOKEN: "${{ github.token }}"
        run: "python3 -I -B -S scripts/run-hosted-recipient-routing.py initial-gate --profile full"

  jvm-library-checks:
    name: JVM libraries (${{ matrix.os }})
    needs: ["initial-recipient-interlock", "recipient-route", "initial-recipient-gate"]
    if: ${{ !cancelled() && needs.initial-recipient-interlock.result == 'success' && needs.recipient-route.result == 'success' && needs.recipient-route.outputs.route_sha256 != '' && ((needs.recipient-route.outputs.origin == 'ordinary' && needs.initial-recipient-gate.result == 'skipped' && needs.initial-recipient-gate.outputs.initial_gate_ready == '' && needs.initial-recipient-gate.outputs.initial_gate_sha256 == '') || (needs.recipient-route.outputs.origin == 'initial' && needs.initial-recipient-gate.result == 'success' && needs.initial-recipient-gate.outputs.initial_gate_ready == 'true' && needs.initial-recipient-gate.outputs.initial_gate_sha256 != '')) }}
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            wrapper: ./gradlew
          - os: windows-latest
            wrapper: .\gradlew.bat
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Run library JVM tests on the host
        id: library-tests
        # Native runner defaults: Bash on Ubuntu, PowerShell on Windows.
        run: >-
          ${{ matrix.wrapper }} --no-daemon
          :p2p-core:jvmTest
          :p2p-transport-lan:jvmTest
          :p2p-network-provisioning-desktop:test
          --continue --no-build-cache --dependency-verification strict
          --max-workers=2 --no-parallel --console=plain

      - name: Stop Gradle after tests
        id: stop-gradle
        if: ${{ always() }}
        run: ${{ matrix.wrapper }} --stop

      - name: Upload library JVM test evidence
        id: library-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-library-tests-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            library/p2p-core/build/test-results/jvmTest/**
            library/p2p-core/build/reports/tests/jvmTest/**
            library/p2p-transport-lan/build/test-results/jvmTest/**
            library/p2p-transport-lan/build/reports/tests/jvmTest/**
            library/p2p-network-provisioning-desktop/build/test-results/test/**
            library/p2p-network-provisioning-desktop/build/reports/tests/test/**
          # Compilation/setup failure can precede report creation; the test
          # step is blocking even when there is no report to upload.
          if-no-files-found: warn
          retention-days: 7

  complete-gate:
    permissions:
      contents: read
      actions: read
    needs: ["jvm-library-checks", "initial-recipient-interlock", "recipient-route", "initial-recipient-gate"]
    # A skipped required job can otherwise count as successful. Always run
    # the explicit dependency-result guard, including on failure/cancellation.
    if: ${{ always() }}
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Require successful Linux and Windows library tests
        id: require-jvm-checks
        shell: bash
        env:
          JVM_CHECK_RESULT: ${{ needs.jvm-library-checks.result }}
        run: test "$JVM_CHECK_RESULT" = success

      - name: "Require the exact recipient route and predecessor result"
        id: "recipient-required"
        shell: "bash"
        env:
          INTERLOCK_RESULT: "${{ needs.initial-recipient-interlock.result }}"
          ROUTE_RESULT: "${{ needs.recipient-route.result }}"
          RECIPIENT_ORIGIN: "${{ needs.recipient-route.outputs.origin }}"
          ROUTE_SHA256: "${{ needs.recipient-route.outputs.route_sha256 }}"
          INITIAL_GATE_RESULT: "${{ needs.initial-recipient-gate.result }}"
          INITIAL_GATE_READY: "${{ needs.initial-recipient-gate.outputs.initial_gate_ready }}"
          INITIAL_GATE_SHA256: "${{ needs.initial-recipient-gate.outputs.initial_gate_sha256 }}"
        run: |
          test "$INTERLOCK_RESULT" = success
          test "$ROUTE_RESULT" = success
          [[ "$ROUTE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          case "$RECIPIENT_ORIGIN" in
            ordinary)
              test "$INITIAL_GATE_RESULT" = skipped
              test -z "$INITIAL_GATE_READY"
              test -z "$INITIAL_GATE_SHA256"
              ;;
            initial)
              test "$INITIAL_GATE_RESULT" = success
              test "$INITIAL_GATE_READY" = true
              [[ "$INITIAL_GATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              ;;
            *) exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify participating heavy-job queue policy
        run: ruby scripts/tests/check-heavy-job-queue-policy-test.rb

      - name: Verify development sample artifact policy
        run: |
          ruby scripts/tests/check-sample-app-workflow-policy-test.rb
          python3 -I -B scripts/tests/package-sample-apps-test.py

      - name: Verify private test-transcript custody controls
        run: python3 -I -B -S scripts/tests/test-transcript-custody-test.py

      - name: Verify ordinary custody caller policy
        run: |
          ruby scripts/tests/check-hosted-test-workflow-policy-test.rb
          python3 -I -B -S scripts/tests/hosted-test-identity-test.py
          python3 -I -B -S scripts/tests/check-hosted-test-composition-test.py
          python3 -I -B -S scripts/tests/hosted-controller-import-test.py
          python3 -I -B -S scripts/tests/hosted-canonical-python-test.py
          python3 -I -B -S scripts/tests/hosted-consume-delivery-test.py
          python3 -I -B -S scripts/tests/hosted-desktop-job-budget-test.py
          python3 -I -B -S scripts/tests/hosted-recipient-routing-test.py

      - name: Classify required-check scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/resolve-ci-scope.sh >> "$GITHUB_OUTPUT"

      - name: Verify committed and local whitespace
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: scripts/check-git-whitespace.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Verify dependency update completeness
        if: steps.scope.outputs.full == 'true'
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          scripts/check-dependency-update.sh "$BASE_SHA" "$HEAD_SHA"
          scripts/tests/check-dependency-update-policy-test.sh

      - name: Verify lightweight documentation change
        if: steps.scope.outputs.full != 'true'
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          scripts/tests/classify-ci-scope-test.sh
          scripts/tests/resolve-ci-scope-test.sh
          ruby scripts/tests/check-ci-scope-policy-test.rb
          scripts/tests/check-git-whitespace-test.sh
          scripts/check-release-metadata.sh
          scripts/tests/check-repository-layout.sh
          scripts/tests/check-markdown-links.sh

      - name: Hold ordinary full acquisition until cache qualification
        id: ordinary-activation
        if: ${{ success() && (steps.scope.outputs.full == 'true') }}
        shell: bash
        run: |
          echo 'ORDINARY_TEST_ACTIVATION=HOLD; QUALIFIED_DEPENDENCY_CACHE_REQUIRED' >&2
          exit 125

      - name: "Locate the fixed native custody session"
        id: "session-path"
        if: "${{ success() && (steps.scope.outputs.full == 'true') }}"
        shell: "bash"
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            macOS/ARM64) role=macos-arm64 ;;
            macOS/X64) role=macos-x64 ;;
            *) echo 'FATAL: unsupported ordinary native host' >&2; exit 1 ;;
          esac
          printf 'session_directory=%s/p2pkit-test-full-%s-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$role" >> "$GITHUB_OUTPUT"

      - name: Admit ordinary full source and trusted recipient policy
        id: ordinary-admission
        if: "${{ success() && (steps.scope.outputs.full == 'true') && needs.recipient-route.outputs.origin == 'ordinary' && steps.session-path.outcome == 'success' }}"
        shell: bash
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          case "$RUNNER_OS/$RUNNER_ARCH" in
            macOS/ARM64) role=macos-arm64 ;;
            macOS/X64) role=macos-x64 ;;
            *) echo 'FATAL: unsupported ordinary native host' >&2; exit 1 ;;
          esac
          "$python_bin" -I -B -S scripts/run-hosted-test-admission.py --profile full \
            --root "$GITHUB_WORKSPACE" \
            --evidence-directory "$RUNNER_TEMP/p2pkit-test-admission-full-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$role"

      - name: "Restore the exact ordinary dependency cohort through its native owner"
        id: "dependency-stage"
        if: "${{ success() && (steps.scope.outputs.full == 'true') && needs.recipient-route.outputs.origin == 'ordinary' && steps.session-path.outcome == 'success' && steps.ordinary-admission.outcome == 'success' }}"
        uses: ./.github/actions/ordinary-cache-provider
        with:
          profile: "full"
        env:
          P2PKIT_ACTIONS_READ_TOKEN: "${{ github.token }}"
          DEVELOPER_DIR: "/Applications/Xcode_26.5.app/Contents/Developer"

      - name: "Restore the exact initial dependency cohort through its native owner"
        id: "initial-dependency-stage"
        if: "${{ success() && (steps.scope.outputs.full == 'true') && needs.recipient-route.outputs.origin == 'initial' && steps.session-path.outcome == 'success' && steps.ordinary-admission.outcome == 'skipped' && steps.dependency-stage.outcome == 'skipped' }}"
        uses: ./.github/actions/initial-ordinary-cache-provider
        with:
          profile: "full"
        env:
          P2PKIT_ACTIONS_READ_TOKEN: "${{ github.token }}"
          DEVELOPER_DIR: "/Applications/Xcode_26.5.app/Contents/Developer"

      - name: "Require the selected native dependency provider"
        id: "dependency-ready"
        if: "${{ always() && (steps.scope.outputs.full == 'true') }}"
        shell: "bash"
        env:
          RECIPIENT_ORIGIN: "${{ needs.recipient-route.outputs.origin }}"
          ORDINARY_PROVIDER: "${{ steps.dependency-stage.outcome }}"
          ORDINARY_DEPENDENCY_SEED_READY: "${{ steps.dependency-stage.outputs.dependency_seed_ready }}"
          ORDINARY_DEPENDENCY_CACHE_READY: "${{ steps.dependency-stage.outputs.dependency_cache_ready }}"
          ORDINARY_NATIVE_PROVIDER_READY: "${{ steps.dependency-stage.outputs.native_provider_ready }}"
          ORDINARY_DEPENDENCY_SEED_HOME: "${{ steps.dependency-stage.outputs.dependency_seed_home }}"
          ORDINARY_DEPENDENCY_SEED_STAGING_SHA256: "${{ steps.dependency-stage.outputs.dependency_seed_staging_sha256 }}"
          ORDINARY_PREPARATION_SHA256: "${{ steps.dependency-stage.outputs.preparation_sha256 }}"
          ORDINARY_RESTORATION_SHA256: "${{ steps.dependency-stage.outputs.restoration_sha256 }}"
          ORDINARY_CACHE_KEY: "${{ steps.dependency-stage.outputs.cache_key }}"
          ORDINARY_CACHE_PATH: "${{ steps.dependency-stage.outputs.cache_path }}"
          INITIAL_PROVIDER: "${{ steps.initial-dependency-stage.outcome }}"
          INITIAL_DEPENDENCY_SEED_READY: "${{ steps.initial-dependency-stage.outputs.dependency_seed_ready }}"
          INITIAL_DEPENDENCY_CACHE_READY: "${{ steps.initial-dependency-stage.outputs.dependency_cache_ready }}"
          INITIAL_NATIVE_PROVIDER_READY: "${{ steps.initial-dependency-stage.outputs.native_provider_ready }}"
          INITIAL_DEPENDENCY_SEED_HOME: "${{ steps.initial-dependency-stage.outputs.dependency_seed_home }}"
          INITIAL_DEPENDENCY_SEED_STAGING_SHA256: "${{ steps.initial-dependency-stage.outputs.dependency_seed_staging_sha256 }}"
          INITIAL_PREPARATION_SHA256: "${{ steps.initial-dependency-stage.outputs.preparation_sha256 }}"
          INITIAL_RESTORATION_SHA256: "${{ steps.initial-dependency-stage.outputs.restoration_sha256 }}"
          INITIAL_CACHE_KEY: "${{ steps.initial-dependency-stage.outputs.cache_key }}"
          INITIAL_CACHE_PATH: "${{ steps.initial-dependency-stage.outputs.cache_path }}"
          INITIAL_INITIAL_CURRENT_HISTORY_SHA256: "${{ steps.initial-dependency-stage.outputs.initial_current_history_sha256 }}"
        run: |
          case "$RECIPIENT_ORIGIN" in
            ordinary)
              test "$ORDINARY_PROVIDER" = success
              test "$INITIAL_PROVIDER" = skipped
              test "$ORDINARY_DEPENDENCY_SEED_READY" = true
              test "$ORDINARY_DEPENDENCY_CACHE_READY" = true
              test "$ORDINARY_NATIVE_PROVIDER_READY" = true
              [[ "$ORDINARY_DEPENDENCY_SEED_STAGING_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$ORDINARY_PREPARATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$ORDINARY_RESTORATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -n "$ORDINARY_DEPENDENCY_SEED_HOME"
              test -n "$ORDINARY_CACHE_KEY"
              test -n "$ORDINARY_CACHE_PATH"
              test -z "$INITIAL_DEPENDENCY_SEED_READY"
              test -z "$INITIAL_DEPENDENCY_CACHE_READY"
              test -z "$INITIAL_NATIVE_PROVIDER_READY"
              test -z "$INITIAL_DEPENDENCY_SEED_HOME"
              test -z "$INITIAL_DEPENDENCY_SEED_STAGING_SHA256"
              test -z "$INITIAL_PREPARATION_SHA256"
              test -z "$INITIAL_RESTORATION_SHA256"
              test -z "$INITIAL_CACHE_KEY"
              test -z "$INITIAL_CACHE_PATH"
              test -z "$INITIAL_INITIAL_CURRENT_HISTORY_SHA256"
              ;;
            initial)
              test "$INITIAL_PROVIDER" = success
              test "$ORDINARY_PROVIDER" = skipped
              test "$INITIAL_DEPENDENCY_SEED_READY" = true
              test "$INITIAL_DEPENDENCY_CACHE_READY" = true
              test "$INITIAL_NATIVE_PROVIDER_READY" = true
              [[ "$INITIAL_DEPENDENCY_SEED_STAGING_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$INITIAL_PREPARATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$INITIAL_RESTORATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -n "$INITIAL_DEPENDENCY_SEED_HOME"
              test -n "$INITIAL_CACHE_KEY"
              test -n "$INITIAL_CACHE_PATH"
              [[ "$INITIAL_INITIAL_CURRENT_HISTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -z "$ORDINARY_DEPENDENCY_SEED_READY"
              test -z "$ORDINARY_DEPENDENCY_CACHE_READY"
              test -z "$ORDINARY_NATIVE_PROVIDER_READY"
              test -z "$ORDINARY_DEPENDENCY_SEED_HOME"
              test -z "$ORDINARY_DEPENDENCY_SEED_STAGING_SHA256"
              test -z "$ORDINARY_PREPARATION_SHA256"
              test -z "$ORDINARY_RESTORATION_SHA256"
              test -z "$ORDINARY_CACHE_KEY"
              test -z "$ORDINARY_CACHE_PATH"
              ;;
            *) exit 1 ;;
          esac

      - name: "Configure daemon Java 21 and wrapper Java 17"
        id: "java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: "temurin"
          java-version: |
            21
            17
        if: "${{ success() && (steps.scope.outputs.full == 'true') && steps.dependency-ready.outcome == 'success' }}"

      - name: Bind the native ordinary daemon JDK
        id: ordinary-jdk21
        if: "${{ success() && (steps.scope.outputs.full == 'true') && steps.dependency-ready.outcome == 'success' }}"
        shell: bash
        run: |
          case "$RUNNER_ARCH" in X64|ARM64) ;; *) echo 'FATAL: unsupported native Java architecture' >&2; exit 1 ;; esac
          daemon_variable="JAVA_HOME_21_${RUNNER_ARCH}"
          daemon_home="${!daemon_variable}"
          case "$daemon_home" in ''|*$'\n'*|*$'\r'*) echo 'FATAL: missing or invalid daemon JDK path' >&2; exit 1 ;; esac
          printf 'P2PKIT_AUDIT_JDK21=%s\n' "$daemon_home" >> "$GITHUB_ENV"

      - name: Install pinned XcodeGen
        id: ordinary-xcodegen
        if: "${{ success() && (steps.scope.outputs.full == 'true') && steps.dependency-ready.outcome == 'success' }}"
        run: |
          xcodegen_bin_dir="$(scripts/install-xcodegen.sh "$RUNNER_TEMP/p2pkit-xcodegen")"
          echo "$xcodegen_bin_dir" >> "$GITHUB_PATH"

      - name: Install Android SDK platforms
        id: ordinary-sdk
        if: "${{ success() && (steps.scope.outputs.full == 'true') && steps.dependency-ready.outcome == 'success' }}"
        run: |
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'platforms;android-37.0'
          grep -Fxq 'AndroidVersion.ApiLevel=36' "$ANDROID_HOME/platforms/android-36/source.properties"
          grep -Fxq 'AndroidVersion.ApiLevel=37.0' "$ANDROID_HOME/platforms/android-37.0/source.properties"

      - name: Verify repository entry points
        id: ordinary-entrypoints
        if: "${{ success() && (steps.scope.outputs.full == 'true') && steps.dependency-ready.outcome == 'success' }}"
        run: |
          scripts/check-gradle-wrapper.sh
          scripts/tests/check-gradle-wrapper-test.sh
          scripts/tests/check-release-tag-test.sh
          scripts/tests/check-release-identity-test.sh
          scripts/check-release-metadata.sh
          scripts/tests/check-maven-release-environment-test.sh
          scripts/tests/check-maven-namespace-access-test.sh
          scripts/tests/check-maven-central-version-test.sh
          scripts/tests/publish-central-portal-bundle-test.sh
          scripts/tests/install-xcodegen-test.sh
          scripts/tests/release-workflow-test.sh
          scripts/tests/check-sample-run-profiles.sh
          scripts/tests/check-repository-layout.sh
          scripts/tests/check-osv-lockfile-coverage.sh
          scripts/tests/check-markdown-links.sh
          scripts/tests/classify-ci-scope-test.sh
          scripts/tests/resolve-ci-scope-test.sh
          scripts/tests/check-git-whitespace-test.sh
          scripts/tests/check-kotlin-toolchain-policy-test.sh
          scripts/tests/run-ios-app-test.sh

      - name: "Run ordinary full with private custody"
        id: "ordinary-run"
        if: "${{ success() && (steps.scope.outputs.full == 'true') && needs.recipient-route.outputs.origin == 'ordinary' && steps.dependency-ready.outcome == 'success' && steps.dependency-stage.outcome == 'success' && steps.dependency-stage.outputs.dependency_seed_ready == 'true' && steps.dependency-stage.outputs.dependency_cache_ready == 'true' && steps.dependency-stage.outputs.native_provider_ready == 'true' }}"
        shell: "bash"
        env:
          P2PKIT_DEPENDENCY_SEED_STAGE_OUTCOME: "${{ steps.dependency-stage.outcome }}"
          P2PKIT_DEPENDENCY_SEED_STAGE_SHA256: "${{ steps.dependency-stage.outputs.dependency_seed_staging_sha256 }}"
          P2PKIT_HOSTED_PREPARE_OUTCOME: "${{ steps.dependency-stage.outcome }}"
          P2PKIT_HOSTED_PREPARE_SHA256: "${{ steps.dependency-stage.outputs.preparation_sha256 }}"
          P2PKIT_CACHE_GUARD_OUTCOME: "${{ steps.dependency-stage.outcome }}"
          P2PKIT_CACHE_RESTORATION_SHA256: "${{ steps.dependency-stage.outputs.restoration_sha256 }}"
          P2PKIT_NATIVE_PROVIDER_OUTCOME: "${{ steps.dependency-stage.outcome }}"
          DEVELOPER_DIR: "/Applications/Xcode_26.5.app/Contents/Developer"
        run: |
          python3 -I -B -S scripts/run-hosted-test-custody.py run --profile full --consume-dependencies

      - name: "Run initial full with private custody"
        id: "initial-run"
        if: "${{ success() && (steps.scope.outputs.full == 'true') && needs.recipient-route.outputs.origin == 'initial' && steps.dependency-ready.outcome == 'success' && steps.initial-dependency-stage.outcome == 'success' && steps.initial-dependency-stage.outputs.dependency_seed_ready == 'true' && steps.initial-dependency-stage.outputs.dependency_cache_ready == 'true' && steps.initial-dependency-stage.outputs.native_provider_ready == 'true' }}"
        shell: "bash"
        env:
          P2PKIT_DEPENDENCY_SEED_STAGE_OUTCOME: "${{ steps.initial-dependency-stage.outcome }}"
          P2PKIT_DEPENDENCY_SEED_STAGE_SHA256: "${{ steps.initial-dependency-stage.outputs.dependency_seed_staging_sha256 }}"
          P2PKIT_HOSTED_PREPARE_OUTCOME: "${{ steps.initial-dependency-stage.outcome }}"
          P2PKIT_HOSTED_PREPARE_SHA256: "${{ steps.initial-dependency-stage.outputs.preparation_sha256 }}"
