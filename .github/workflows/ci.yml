name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  # Pushes/manual runs must not cancel the weekly default-branch backstop.
  # Keep ordinary per-ref supersession, but let a running schedule finish.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || 'change' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  jvm-library-checks:
    name: JVM libraries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wrapper: ./gradlew
          - os: windows-latest
            wrapper: .\gradlew.bat
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Run library JVM tests on the host
        id: library-tests
        # Native runner defaults: Bash on Ubuntu, PowerShell on Windows.
        run: >-
          ${{ matrix.wrapper }} --no-daemon
          :p2p-core:jvmTest
          :p2p-transport-lan:jvmTest
          :p2p-rpc:jvmTest
          :p2p-sample-rpc:jvmTest
          :p2p-network-provisioning-desktop:test
          --continue --no-build-cache --dependency-verification strict
          --max-workers=2 --no-parallel --console=plain

      - name: Stop Gradle after tests
        id: stop-gradle
        if: ${{ always() }}
        run: ${{ matrix.wrapper }} --stop

      - name: Upload library JVM test evidence
        id: library-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-library-tests-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            library/p2p-core/build/test-results/jvmTest/**
            library/p2p-core/build/reports/tests/jvmTest/**
            library/p2p-transport-lan/build/test-results/jvmTest/**
            library/p2p-transport-lan/build/reports/tests/jvmTest/**
            library/p2p-rpc/build/test-results/jvmTest/**
            library/p2p-rpc/build/reports/tests/jvmTest/**
            samples/p2p-sample-rpc/build/test-results/jvmTest/**
            samples/p2p-sample-rpc/build/reports/tests/jvmTest/**
            library/p2p-network-provisioning-desktop/build/test-results/test/**
            library/p2p-network-provisioning-desktop/build/reports/tests/test/**
          # Compilation/setup failure can precede report creation; the test
          # step is blocking even when there is no report to upload.
          if-no-files-found: warn
          retention-days: 7

  # Script/fixture checks have their own build budget and toolchain. The
  # lock-policy and disposable-key bundle tests perform real Gradle builds.
  # They remain mandatory at the same workflow source, not a substitute for
  # the independent full platform/ABI/publication jobs below.
  repository-checks:
    outputs:
      full: ${{ steps.scope.outputs.full }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify required-check scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/resolve-ci-scope.sh >> "$GITHUB_OUTPUT"

      - name: Verify committed and local whitespace
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: scripts/check-git-whitespace.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Verify dependency update completeness
        if: steps.scope.outputs.full == 'true'
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          scripts/check-dependency-update.sh "$BASE_SHA" "$HEAD_SHA"
          scripts/tests/check-dependency-update-policy-test.sh

      - name: Verify lightweight documentation change
        if: steps.scope.outputs.full != 'true'
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          scripts/tests/classify-ci-scope-test.sh
          scripts/tests/resolve-ci-scope-test.sh
          ruby scripts/tests/check-ci-scope-policy-test.rb
          scripts/tests/check-git-whitespace-test.sh
          scripts/check-release-metadata.sh
          scripts/tests/check-repository-layout.sh
          scripts/tests/check-markdown-links.sh

      - name: Configure Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Install pinned XcodeGen
        run: |
          xcodegen_bin_dir="$(scripts/install-xcodegen.sh "$RUNNER_TEMP/p2pkit-xcodegen")"
          echo "$xcodegen_bin_dir" >> "$GITHUB_PATH"

      - name: Install Android SDK platforms
        run: |
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'platforms;android-37.0'

      - name: Verify repository script and policy entry points
        id: repository-tests
        run: |
          scripts/check-gradle-wrapper.sh
          scripts/tests/check-gradle-wrapper-test.sh
          scripts/tests/check-lock-write-policy-test.sh
          scripts/tests/check-release-tag-test.sh
          scripts/tests/check-release-identity-test.sh
          scripts/check-release-metadata.sh
          scripts/tests/check-maven-release-environment-test.sh
          scripts/tests/check-maven-namespace-access-test.sh
          scripts/tests/check-maven-central-version-test.sh
          scripts/tests/publish-central-portal-bundle-test.sh
          scripts/tests/build-central-portal-bundle-test.sh
          scripts/tests/install-xcodegen-test.sh
          scripts/tests/release-workflow-test.sh
          scripts/tests/check-sample-run-profiles.sh
          scripts/tests/check-repository-layout.sh
          scripts/tests/check-osv-lockfile-coverage.sh
          scripts/tests/check-markdown-links.sh
          scripts/tests/classify-ci-scope-test.sh
          scripts/tests/resolve-ci-scope-test.sh
          scripts/tests/check-git-whitespace-test.sh
          scripts/tests/check-kotlin-toolchain-policy-test.sh

  # Independent execution budgets: no phase consumes another phase's time.
  # The exact commands remain blocking; no build outputs are relayed between jobs.
  ios-checks:
    needs: repository-checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate same-source scope
        id: validate-scope
        shell: bash
        env:
          FULL_SCOPE: ${{ needs.repository-checks.outputs.full }}
          SOURCE_SHA: ${{ needs.repository-checks.outputs.head }}
        run: |
          case "$FULL_SCOPE" in true|false) ;; *) exit 1 ;; esac
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Configure Java 17
        if: needs.repository-checks.outputs.full == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and configure Gradle
        if: needs.repository-checks.outputs.full == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Kotlin 2.4.10 predates the build-cache deserialization fix. Keep
          # dependency/wrapper caching, but never persist or restore its local
          # build-cache metadata across trust boundaries (CVE-2026-53914).
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Install pinned XcodeGen
        if: needs.repository-checks.outputs.full == 'true'
        run: |
          xcodegen_bin_dir="$(scripts/install-xcodegen.sh "$RUNNER_TEMP/p2pkit-xcodegen")"
          echo "$xcodegen_bin_dir" >> "$GITHUB_PATH"

      - name: Install Android SDK platforms
        if: needs.repository-checks.outputs.full == 'true'
        run: |
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'platforms;android-37.0'

      - name: Verify iOS entry points
        if: needs.repository-checks.outputs.full == 'true'
        run: |
          python3 scripts/tests/ios-project-generation-test.py
          source scripts/run-ios-app.sh
          device_json="$(xcrun simctl list -j devices available)"
          SIM_UDID="$(select_latest_available_simulator_udid "iPhone 17" "$device_json")"
          export SIM_UDID
          echo "Selected exact iOS simulator UDID: $SIM_UDID"
          scripts/run-ios-ui-tests.sh
          scripts/tests/run-ios-app-test.sh

      - name: Upload iOS UI failure evidence
        if: ${{ failure() && needs.repository-checks.outputs.full == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ui-failure-${{ github.run_attempt }}
          path: samples/iosApp/build/ios-ui-run.*/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  platform-checks:
    needs: repository-checks
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate same-source scope
        id: validate-scope
        shell: bash
        env:
          FULL_SCOPE: ${{ needs.repository-checks.outputs.full }}
          SOURCE_SHA: ${{ needs.repository-checks.outputs.head }}
        run: |
          case "$FULL_SCOPE" in true|false) ;; *) exit 1 ;; esac
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      # The owned executor disables toolchain auto-download/discovery. Retain
      # daemon JDK21 explicitly, then restore JDK17 for the wrapper and library.
      - name: Configure Java 21 daemon toolchain
        if: needs.repository-checks.outputs.full == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Retain the daemon toolchain selection
        if: needs.repository-checks.outputs.full == 'true'
        run: printf 'P2PKIT_AUDIT_JDK21=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Configure Java 17
        if: needs.repository-checks.outputs.full == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Bind the pre-setup cache environment
        if: needs.repository-checks.outputs.full == 'true'
        run: exec python3 -I -B -S scripts/rpc_apple_ci_setup.py before

      - name: Validate wrapper and configure Gradle
        id: ci-gradle-setup
        if: needs.repository-checks.outputs.full == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Kotlin 2.4.10 predates the build-cache deserialization fix. Keep
          # dependency/wrapper caching, but never persist or restore its local
          # build-cache metadata across trust boundaries (CVE-2026-53914).
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Retain the exact setup cache-home witness
        if: needs.repository-checks.outputs.full == 'true'
        env:
          P2PKIT_CI_SETUP_OUTCOME: ${{ steps.ci-gradle-setup.outcome }}
          P2PKIT_CI_SETUP_CONCLUSION: ${{ steps.ci-gradle-setup.conclusion }}
        run: exec python3 -I -B -S scripts/rpc_apple_ci_setup.py after

      - name: Install pinned XcodeGen
        if: needs.repository-checks.outputs.full == 'true'
        run: |
          xcodegen_bin_dir="$(scripts/install-xcodegen.sh "$RUNNER_TEMP/p2pkit-xcodegen")"
          echo "$xcodegen_bin_dir" >> "$GITHUB_PATH"

      - name: Install Android SDK platforms
        if: needs.repository-checks.outputs.full == 'true'
        run: |
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'platforms;android-37.0'

      - name: Run complete module and platform checks
        id: platform-tests
        if: needs.repository-checks.outputs.full == 'true'
        run: python3 scripts/run-platform-tests.py full

      - name: Stop Gradle after platform tests
        id: stop-platform-gradle
        if: ${{ always() && needs.repository-checks.outputs.full == 'true' }}
        run: ./gradlew --stop

      - name: Upload platform test execution evidence
        id: platform-reports
        if: ${{ always() && needs.repository-checks.outputs.full == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-test-execution-${{ github.run_attempt }}
          path: |
            build/reports/platform-tests/**
            library/p2p-transport-lan/build/test-results/jvmTest/**
            library/p2p-transport-lan/build/reports/jmdns-close/**
          if-no-files-found: warn
          retention-days: 7

  artifact-checks:
    needs: repository-checks
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate same-source scope
        id: validate-scope
        shell: bash
        env:
          FULL_SCOPE: ${{ needs.repository-checks.outputs.full }}
          SOURCE_SHA: ${{ needs.repository-checks.outputs.head }}
        run: |
          case "$FULL_SCOPE" in true|false) ;; *) exit 1 ;; esac
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      # The owned executor disables toolchain auto-download/discovery. Retain
      # daemon JDK21 explicitly, then restore JDK17 for the wrapper and library.
      - name: Configure Java 21 daemon toolchain
        if: needs.repository-checks.outputs.full == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Retain the daemon toolchain selection
        if: needs.repository-checks.outputs.full == 'true'
        run: printf 'P2PKIT_AUDIT_JDK21=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Configure Java 17
        if: needs.repository-checks.outputs.full == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Bind the pre-setup cache environment
        if: needs.repository-checks.outputs.full == 'true'
        run: exec python3 -I -B -S scripts/rpc_apple_ci_setup.py before

      - name: Validate wrapper and configure Gradle
        id: ci-gradle-setup
        if: needs.repository-checks.outputs.full == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Kotlin 2.4.10 predates the build-cache deserialization fix. Keep
          # dependency/wrapper caching, but never persist or restore its local
          # build-cache metadata across trust boundaries (CVE-2026-53914).
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Retain the exact setup cache-home witness
        if: needs.repository-checks.outputs.full == 'true'
        env:
          P2PKIT_CI_SETUP_OUTCOME: ${{ steps.ci-gradle-setup.outcome }}
          P2PKIT_CI_SETUP_CONCLUSION: ${{ steps.ci-gradle-setup.conclusion }}
        run: exec python3 -I -B -S scripts/rpc_apple_ci_setup.py after

      - name: Install pinned XcodeGen
        if: needs.repository-checks.outputs.full == 'true'
        run: |
          xcodegen_bin_dir="$(scripts/install-xcodegen.sh "$RUNNER_TEMP/p2pkit-xcodegen")"
          echo "$xcodegen_bin_dir" >> "$GITHUB_PATH"

      - name: Install Android SDK platforms
        if: needs.repository-checks.outputs.full == 'true'
        run: |
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'platforms;android-37.0'

      - name: Verify Android ABI graph
        if: needs.repository-checks.outputs.full == 'true'
        run: |
          scripts/check-android-abi-guard.sh

      - name: Verify API, documentation, and SBOM
        if: needs.repository-checks.outputs.full == 'true'
        run: |
          ./gradlew :p2p-core:checkKotlinAbi :p2p-transport-lan:checkKotlinAbi :p2p-rpc:checkKotlinAbi :p2p-network-provisioning-android:checkKotlinAbi :p2p-network-provisioning-desktop:checkKotlinAbi :p2p-core:checkAndroidAbi :p2p-transport-lan:checkAndroidAbi :p2p-network-provisioning-android:checkAndroidAbi :p2p-rpc:checkAndroidAbi --console=plain
          ./gradlew :p2p-core:dokkaGeneratePublicationHtml :p2p-transport-lan:dokkaGeneratePublicationHtml :p2p-rpc:dokkaGeneratePublicationHtml :p2p-network-provisioning-android:dokkaGeneratePublicationHtml :p2p-network-provisioning-desktop:dokkaGeneratePublicationHtml --console=plain
          scripts/check-sbom.sh

      - name: Verify local release artifacts and consumers
        if: needs.repository-checks.outputs.full == 'true'
        run: |
          scripts/check-publish-artifacts.sh
          scripts/check-published-consumers.sh
          ./gradlew :p2p-transport-lan:verifyP2pKitSharedReleaseXCFrameworkProvenance --console=plain
          scripts/check-xcframework-minimum-os.sh

      - name: Upload SBOM evidence
        if: ${{ always() && needs.repository-checks.outputs.full == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom
          path: build/reports/cyclonedx/bom.*
          # `check-sbom.sh` is the blocking content/presence gate. A failure in
          # an earlier step has no SBOM to upload and must not manufacture a
          # second, misleading failure in this evidence-only step.
          if-no-files-found: warn

      - name: Upload XCFramework provenance evidence
        if: ${{ always() && needs.repository-checks.outputs.full == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcframework-provenance
          path: library/p2p-transport-lan/build/XCFrameworks/release/BUILD_*.txt
          if-no-files-found: warn

  # Keep the protected check name. Never turn missing/skipped work into a pass.
  complete-gate:
    needs: [jvm-library-checks, repository-checks, ios-checks, platform-checks, artifact-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful Linux and Windows library tests
        id: require-jvm-checks
        shell: bash
        env:
          JVM_CHECK_RESULT: ${{ needs.jvm-library-checks.result }}
        run: test "$JVM_CHECK_RESULT" = success

      - name: Require successful repository script and policy tests
        id: require-repository-checks
        shell: bash
        env:
          REPOSITORY_CHECK_RESULT: ${{ needs.repository-checks.result }}
        run: test "$REPOSITORY_CHECK_RESULT" = success

      - name: Require successful iOS checks
        id: require-ios-checks
        shell: bash
        env:
          IOS_CHECKS_RESULT: ${{ needs.ios-checks.result }}
        run: test "$IOS_CHECKS_RESULT" = success

      - name: Require successful platform checks
        id: require-platform-checks
        shell: bash
        env:
          PLATFORM_CHECKS_RESULT: ${{ needs.platform-checks.result }}
        run: test "$PLATFORM_CHECKS_RESULT" = success

      - name: Require successful artifact and consumer checks
        id: require-artifact-checks
        shell: bash
        env:
          ARTIFACT_CHECKS_RESULT: ${{ needs.artifact-checks.result }}
        run: test "$ARTIFACT_CHECKS_RESULT" = success
