name: CI — modular qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        description: all, or one component to execute independently
        default: all
        type: choice
        options: [all, source, dependencies, jvm-linux, jvm-windows, android, apple-arm64, apple-x64, desktop-linux, desktop-windows, desktop-macos, security, compatibility]
      qualification_selection:
        description: Optional exact-source selection JSON to aggregate previously successful components without rebuilding
        default: ''
        type: string
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
  actions: read
# Different components and RPC runs never cancel or block one another.
concurrency:
  group: modular-ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.component || 'all' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.components.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: components
        env:
          COMPONENT: ${{ inputs.component || 'all' }}
        run: echo "matrix=$(python3 -B scripts/ci_component.py --matrix "$COMPONENT")" >> "$GITHUB_OUTPUT"
  component:
    if: ${{ inputs.qualification_selection == '' }}
    needs: plan
    name: ${{ matrix.component }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/ci-component.yml
    with:
      component: ${{ matrix.component }}
      runner: ${{ matrix.os }}
      minutes: ${{ matrix.minutes }}
  qualify:
    name: Qualify release components
    needs: [plan, component]
    if: ${{ always() && needs.plan.result == 'success' && (inputs.qualification_selection != '' || ((inputs.component == 'all' || inputs.component == '') && needs.component.result == 'success')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact component artifacts and build an immutable qualification
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SELECTION: ${{ inputs.qualification_selection }}
        run: |
          python3 -B scripts/ci_qualification.py collect --source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/selection.json"
          python3 -B scripts/ci_qualification.py aggregate --source "$GITHUB_SHA" --selection "$RUNNER_TEMP/selection.json" --output "$RUNNER_TEMP/qualification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
  complete-gate:
    needs: [qualify]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.qualification_selection != '') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require real complete qualification, including all failed/skipped dependencies
        env:
          QUALIFICATION: ${{ needs.qualify.result }}
        run: test "$QUALIFICATION" = success
