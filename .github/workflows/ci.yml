name: CI — modular qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        description: all, one component, or a focused diagnostic (not qualification)
        default: all
        type: choice
        options: [all, source, dependencies, jvm-linux, jvm-windows, android, apple-arm64, apple-x64, desktop-linux, desktop-windows, desktop-macos, security, compatibility, consumers, macos-shared, bundle-diagnostic, jmdns-diagnostic, published-consumers-diagnostic, consumers-pom-diagnostic, apple-keyboard-diagnostic, apple-issue-diagnostic, android-ui-diagnostic, android-permission-diagnostic, android-legacy-task-preview, rpc-io]
      rpc_io_part:
        description: Scalable I/O implementation checks only (not release or physical qualification)
        default: all
        type: choice
        options: [all, jvm-linux, jvm-windows, macos, macos-abi, ios-phone, android-24, android-35]
      apple_operation:
        description: Apple diagnostic only (no release qualification or physical credit)
        default: both
        type: choice
        options: [both, iphoneos-product, swift-jvm-transfer]
      android_case:
        description: Android API 35 UI diagnostic only (issues 317 and 324, not 372)
        default: both
        type: choice
        options: [both, '317', '324']
      android_legacy_api:
        description: Legacy task-preview diagnostic API only (not qualification)
        default: both
        type: choice
        options: [both, '24', '32']
      qualification_selection:
        description: Optional exact-source selection JSON to aggregate previously successful components without rebuilding
        default: ''
        type: string
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
  actions: read
# Different components and RPC runs never cancel or block one another.
concurrency:
  group: modular-ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.component || 'all' }}-${{ inputs.component == 'rpc-io' && inputs.rpc_io_part || '' }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ inputs.component != 'rpc-io' && inputs.component != 'android-legacy-task-preview' && inputs.component != 'apple-issue-diagnostic' && inputs.component != 'android-permission-diagnostic' && inputs.component != 'android-ui-diagnostic' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.components.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: components
        env:
          COMPONENT: ${{ inputs.component || 'all' }}
        run: echo "matrix=$(python3 -B scripts/ci_component.py --matrix "$COMPONENT")" >> "$GITHUB_OUTPUT"
  component:
    if: ${{ inputs.component != 'rpc-io' && inputs.component != 'android-legacy-task-preview' && inputs.component != 'apple-issue-diagnostic' && inputs.component != 'android-permission-diagnostic' && inputs.component != 'android-ui-diagnostic' && inputs.qualification_selection == '' }}
    needs: plan
    name: ${{ matrix.component }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/ci-component.yml
    with:
      component: ${{ matrix.component }}
      runner: ${{ matrix.os }}
      minutes: ${{ matrix.minutes }}
      job_minutes: ${{ matrix.job_minutes }}
  # Reusable issue workflows come from this exact caller commit, not the default
  # branch. They never run the component matrix or mint qualification evidence.
  rpc-io:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.component == 'rpc-io' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rpc-io-validation.yml
    with:
      part: ${{ inputs.rpc_io_part }}
  apple-issue-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.component == 'apple-issue-diagnostic' }}
    permissions:
      contents: read
    uses: ./.github/workflows/apple-issue-validation.yml
    with:
      operation: ${{ inputs.apple_operation || 'both' }}
  android-ui-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.component == 'android-ui-diagnostic' }}
    permissions:
      contents: read
    uses: ./.github/workflows/android-ui-validation.yml
    with:
      case: ${{ inputs.android_case || 'both' }}
  android-legacy-task-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.component == 'android-legacy-task-preview' }}
    permissions:
      contents: read
    uses: ./.github/workflows/android-legacy-task-preview.yml
    with:
      api: ${{ inputs.android_legacy_api }}
  android-permission-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.component == 'android-permission-diagnostic' }}
    permissions:
      contents: read
    uses: ./.github/workflows/android-permission-validation.yml
  qualify:
    name: Qualify release components
    needs: [plan, component]
    if: ${{ always() && inputs.component != 'android-legacy-task-preview' && inputs.component != 'apple-issue-diagnostic' && inputs.component != 'android-permission-diagnostic' && inputs.component != 'android-ui-diagnostic' && inputs.component != 'published-consumers-diagnostic' && inputs.component != 'consumers-pom-diagnostic' && inputs.component != 'apple-keyboard-diagnostic' && inputs.component != 'rpc-io' && inputs.component != 'jmdns-diagnostic' && inputs.component != 'bundle-diagnostic' && needs.plan.result == 'success' && (inputs.qualification_selection != '' || ((inputs.component == 'all' || inputs.component == '') && needs.component.result == 'success')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact component artifacts and build an immutable qualification
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SELECTION: ${{ inputs.qualification_selection }}
        run: |
          python3 -B scripts/ci_qualification.py collect --source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/selection.json"
          python3 -B scripts/ci_qualification.py aggregate --source "$GITHUB_SHA" --selection "$RUNNER_TEMP/selection.json" --output "$RUNNER_TEMP/qualification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
  complete-gate:
    needs: [qualify]
    if: ${{ always() && inputs.component != 'android-legacy-task-preview' && inputs.component != 'apple-issue-diagnostic' && inputs.component != 'android-permission-diagnostic' && inputs.component != 'android-ui-diagnostic' && inputs.component != 'published-consumers-diagnostic' && inputs.component != 'consumers-pom-diagnostic' && inputs.component != 'apple-keyboard-diagnostic' && inputs.component != 'rpc-io' && inputs.component != 'jmdns-diagnostic' && inputs.component != 'bundle-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.qualification_selection != '') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require real complete qualification, including all failed/skipped dependencies
        env:
          QUALIFICATION: ${{ needs.qualify.result }}
        run: test "$QUALIFICATION" = success
