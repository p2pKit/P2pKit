name: Verify Maven Central namespace

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify the namespace, or diagnose token authentication without publishing
        type: choice
        options: [verify, auth-diagnostic]
        default: verify
        required: true

permissions:
  contents: read

jobs:
  verify-namespace:
    if: ${{ inputs.operation == 'verify' }}
    runs-on: macos-15
    timeout-minutes: 5
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/namespaces
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact namespace and token access
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_NAMESPACE: io.github.apdelrahman1911
        run: scripts/check-maven-namespace-access.sh

      - name: Upload sanitized namespace evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-central-namespace-access
          path: build/reports/maven-central/namespace-access.json
          if-no-files-found: warn

  auth-diagnostic:
    if: ${{ inputs.operation == 'auth-diagnostic' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/namespaces
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact clean diagnostic checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
      - name: Diagnose authentication with two read-only requests, not release qualification
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python3 -I -B -S scripts/diagnose-maven-central-auth.py
