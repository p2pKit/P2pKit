name: Desktop cross-host

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/desktop-cross-host.yml"
      - ".github/actions/ordinary-cache-provider/**"
      - ".github/actions/initial-ordinary-cache-provider/**"
      - ".github/test-evidence-recipient.json"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSE"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "buildSrc/**"
      - "gradle/**"
      - "scripts/**"
      - "gradle.lockfile"
      - "buildscript-gradle.lockfile"
      - "samples/p2p-sample-android/**"
      - "samples/sample-kmp-shared/**"
      - "samples/p2p-sample-desktop/**"
      - "samples/p2p-sample-desktop-ui/**"
      - "samples/p2p-sample-diagnostics/**"
      - "library/p2p-core/**"
      - "library/p2p-transport-lan/**"
      - "library/p2p-network-provisioning-desktop/**"
      - "library/p2p-network-provisioning-android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-cross-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initial-recipient-interlock:
    permissions: {}
    runs-on: "ubuntu-latest"
    timeout-minutes: 1
    steps:
      - name: "Hold whole JVM jobs until initial-recipient admission is implemented"
        shell: "bash"
        run: |
          echo 'INITIAL_RECIPIENT_STAGE2=HOLD; WHOLE_JVM_JOB_ADMISSION_REQUIRED' >&2
          exit 125
  recipient-route:
    needs: "initial-recipient-interlock"
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    timeout-minutes: 6
    outputs:
      origin: "${{ steps.source-mode.outputs.origin }}"
      route_sha256: "${{ steps.source-mode.outputs.route_sha256 }}"
    steps:
      - name: "Check out exact event source"
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: "Select trusted policy origin without worker authority"
        id: "source-mode"
        timeout-minutes: 3
        shell: "bash"
        run: "python3 -I -B -S scripts/run-hosted-recipient-routing.py source-mode --profile desktop"
  initial-recipient-gate:
    needs:
      - "initial-recipient-interlock"
      - "recipient-route"
    if: "${{ !cancelled() && needs.initial-recipient-interlock.result == 'success' && needs.recipient-route.result == 'success' && needs.recipient-route.outputs.origin == 'initial' }}"
    permissions:
      contents: "read"
      actions: "read"
    environment: "initial-recipient-execution"
    runs-on: "ubuntu-latest"
    timeout-minutes: 6
    outputs:
      initial_gate_ready: "${{ steps.initial-current.outputs.initial_gate_ready }}"
      initial_gate_sha256: "${{ steps.initial-current.outputs.initial_gate_sha256 }}"
    steps:
      - name: "Check out exact event source"
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: "Acquire the original protected initial-recipient gate"
        id: "initial-current"
        timeout-minutes: 3
        shell: "bash"
        env:
          P2PKIT_ACTIONS_READ_TOKEN: "${{ github.token }}"
        run: "python3 -I -B -S scripts/run-hosted-recipient-routing.py initial-gate --profile desktop"

  verify:
    needs: ["initial-recipient-interlock", "recipient-route", "initial-recipient-gate"]
    if: ${{ always() }}
    name: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: "Require the exact recipient route and predecessor result"
        id: "recipient-required"
        shell: "bash"
        env:
          INTERLOCK_RESULT: "${{ needs.initial-recipient-interlock.result }}"
          ROUTE_RESULT: "${{ needs.recipient-route.result }}"
          RECIPIENT_ORIGIN: "${{ needs.recipient-route.outputs.origin }}"
          ROUTE_SHA256: "${{ needs.recipient-route.outputs.route_sha256 }}"
          INITIAL_GATE_RESULT: "${{ needs.initial-recipient-gate.result }}"
          INITIAL_GATE_READY: "${{ needs.initial-recipient-gate.outputs.initial_gate_ready }}"
          INITIAL_GATE_SHA256: "${{ needs.initial-recipient-gate.outputs.initial_gate_sha256 }}"
        run: |
          test "$INTERLOCK_RESULT" = success
          test "$ROUTE_RESULT" = success
          [[ "$ROUTE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          case "$RECIPIENT_ORIGIN" in
            ordinary)
              test "$INITIAL_GATE_RESULT" = skipped
              test -z "$INITIAL_GATE_READY"
              test -z "$INITIAL_GATE_SHA256"
              ;;
            initial)
              test "$INITIAL_GATE_RESULT" = success
              test "$INITIAL_GATE_READY" = true
              [[ "$INITIAL_GATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              ;;
            *) exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hold ordinary desktop acquisition until cache qualification
        id: ordinary-activation
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          echo 'ORDINARY_TEST_ACTIVATION=HOLD; QUALIFIED_DEPENDENCY_CACHE_REQUIRED' >&2
          exit 125

      - name: "Locate the fixed native custody session"
        id: "session-path"
        if: "${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}"
        shell: "bash"
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) role=linux-x64 ;;
            Windows/X64) role=windows-x64 ;;
            macOS/ARM64) role=macos-arm64 ;;
            macOS/X64) role=macos-x64 ;;
            *) echo 'FATAL: unsupported ordinary native host' >&2; exit 1 ;;
          esac
          printf 'session_directory=%s/p2pkit-test-desktop-%s-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$role" >> "$GITHUB_OUTPUT"

      - name: Admit ordinary desktop source and trusted recipient policy
        id: ordinary-admission
        if: "${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.recipient-route.outputs.origin == 'ordinary' && steps.session-path.outcome == 'success' }}"
        shell: bash
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) role=linux-x64 ;;
            Windows/X64) role=windows-x64 ;;
            macOS/ARM64) role=macos-arm64 ;;
            macOS/X64) role=macos-x64 ;;
            *) echo 'FATAL: unsupported ordinary native host' >&2; exit 1 ;;
          esac
          "$python_bin" -I -B -S scripts/run-hosted-test-admission.py --profile desktop \
            --root "$GITHUB_WORKSPACE" \
            --evidence-directory "$RUNNER_TEMP/p2pkit-test-admission-desktop-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$role"

      - name: Bind fresh ordinary sample outputs to this run
        id: ordinary-output
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.ordinary-admission.outcome == 'success' && steps.ordinary-admission.outputs.sample_packaging_required == 'true' }}
        shell: bash
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/package-sample-apps.py prepare --output "$RUNNER_TEMP/p2pkit-sample-apps"

      - name: "Restore the exact ordinary dependency cohort through its native owner"
        id: "dependency-stage"
        if: "${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.recipient-route.outputs.origin == 'ordinary' && steps.session-path.outcome == 'success' && steps.ordinary-admission.outcome == 'success' }}"
        uses: ./.github/actions/ordinary-cache-provider
        with:
          profile: "desktop"
        env:
          P2PKIT_ACTIONS_READ_TOKEN: "${{ github.token }}"

      - name: "Restore the exact initial dependency cohort through its native owner"
        id: "initial-dependency-stage"
        if: "${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.recipient-route.outputs.origin == 'initial' && steps.session-path.outcome == 'success' && steps.ordinary-admission.outcome == 'skipped' && steps.dependency-stage.outcome == 'skipped' }}"
        uses: ./.github/actions/initial-ordinary-cache-provider
        with:
          profile: "desktop"
        env:
          P2PKIT_ACTIONS_READ_TOKEN: "${{ github.token }}"

      - name: "Require the selected native dependency provider"
        id: "dependency-ready"
        if: "${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}"
        shell: "bash"
        env:
          RECIPIENT_ORIGIN: "${{ needs.recipient-route.outputs.origin }}"
          ORDINARY_PROVIDER: "${{ steps.dependency-stage.outcome }}"
          ORDINARY_DEPENDENCY_SEED_READY: "${{ steps.dependency-stage.outputs.dependency_seed_ready }}"
          ORDINARY_DEPENDENCY_CACHE_READY: "${{ steps.dependency-stage.outputs.dependency_cache_ready }}"
          ORDINARY_NATIVE_PROVIDER_READY: "${{ steps.dependency-stage.outputs.native_provider_ready }}"
          ORDINARY_DEPENDENCY_SEED_HOME: "${{ steps.dependency-stage.outputs.dependency_seed_home }}"
          ORDINARY_DEPENDENCY_SEED_STAGING_SHA256: "${{ steps.dependency-stage.outputs.dependency_seed_staging_sha256 }}"
          ORDINARY_PREPARATION_SHA256: "${{ steps.dependency-stage.outputs.preparation_sha256 }}"
          ORDINARY_RESTORATION_SHA256: "${{ steps.dependency-stage.outputs.restoration_sha256 }}"
          ORDINARY_CACHE_KEY: "${{ steps.dependency-stage.outputs.cache_key }}"
          ORDINARY_CACHE_PATH: "${{ steps.dependency-stage.outputs.cache_path }}"
          INITIAL_PROVIDER: "${{ steps.initial-dependency-stage.outcome }}"
          INITIAL_DEPENDENCY_SEED_READY: "${{ steps.initial-dependency-stage.outputs.dependency_seed_ready }}"
          INITIAL_DEPENDENCY_CACHE_READY: "${{ steps.initial-dependency-stage.outputs.dependency_cache_ready }}"
          INITIAL_NATIVE_PROVIDER_READY: "${{ steps.initial-dependency-stage.outputs.native_provider_ready }}"
          INITIAL_DEPENDENCY_SEED_HOME: "${{ steps.initial-dependency-stage.outputs.dependency_seed_home }}"
          INITIAL_DEPENDENCY_SEED_STAGING_SHA256: "${{ steps.initial-dependency-stage.outputs.dependency_seed_staging_sha256 }}"
          INITIAL_PREPARATION_SHA256: "${{ steps.initial-dependency-stage.outputs.preparation_sha256 }}"
          INITIAL_RESTORATION_SHA256: "${{ steps.initial-dependency-stage.outputs.restoration_sha256 }}"
          INITIAL_CACHE_KEY: "${{ steps.initial-dependency-stage.outputs.cache_key }}"
          INITIAL_CACHE_PATH: "${{ steps.initial-dependency-stage.outputs.cache_path }}"
          INITIAL_INITIAL_CURRENT_HISTORY_SHA256: "${{ steps.initial-dependency-stage.outputs.initial_current_history_sha256 }}"
        run: |
          case "$RECIPIENT_ORIGIN" in
            ordinary)
              test "$ORDINARY_PROVIDER" = success
              test "$INITIAL_PROVIDER" = skipped
              test "$ORDINARY_DEPENDENCY_SEED_READY" = true
              test "$ORDINARY_DEPENDENCY_CACHE_READY" = true
              test "$ORDINARY_NATIVE_PROVIDER_READY" = true
              [[ "$ORDINARY_DEPENDENCY_SEED_STAGING_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$ORDINARY_PREPARATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$ORDINARY_RESTORATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -n "$ORDINARY_DEPENDENCY_SEED_HOME"
              test -n "$ORDINARY_CACHE_KEY"
              test -n "$ORDINARY_CACHE_PATH"
              test -z "$INITIAL_DEPENDENCY_SEED_READY"
              test -z "$INITIAL_DEPENDENCY_CACHE_READY"
              test -z "$INITIAL_NATIVE_PROVIDER_READY"
              test -z "$INITIAL_DEPENDENCY_SEED_HOME"
              test -z "$INITIAL_DEPENDENCY_SEED_STAGING_SHA256"
              test -z "$INITIAL_PREPARATION_SHA256"
              test -z "$INITIAL_RESTORATION_SHA256"
              test -z "$INITIAL_CACHE_KEY"
              test -z "$INITIAL_CACHE_PATH"
              test -z "$INITIAL_INITIAL_CURRENT_HISTORY_SHA256"
              ;;
            initial)
              test "$INITIAL_PROVIDER" = success
              test "$ORDINARY_PROVIDER" = skipped
              test "$INITIAL_DEPENDENCY_SEED_READY" = true
              test "$INITIAL_DEPENDENCY_CACHE_READY" = true
              test "$INITIAL_NATIVE_PROVIDER_READY" = true
              [[ "$INITIAL_DEPENDENCY_SEED_STAGING_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$INITIAL_PREPARATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$INITIAL_RESTORATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -n "$INITIAL_DEPENDENCY_SEED_HOME"
              test -n "$INITIAL_CACHE_KEY"
              test -n "$INITIAL_CACHE_PATH"
              [[ "$INITIAL_INITIAL_CURRENT_HISTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -z "$ORDINARY_DEPENDENCY_SEED_READY"
              test -z "$ORDINARY_DEPENDENCY_CACHE_READY"
              test -z "$ORDINARY_NATIVE_PROVIDER_READY"
              test -z "$ORDINARY_DEPENDENCY_SEED_HOME"
              test -z "$ORDINARY_DEPENDENCY_SEED_STAGING_SHA256"
              test -z "$ORDINARY_PREPARATION_SHA256"
              test -z "$ORDINARY_RESTORATION_SHA256"
              test -z "$ORDINARY_CACHE_KEY"
              test -z "$ORDINARY_CACHE_PATH"
              ;;
            *) exit 1 ;;
          esac

      - name: "Configure daemon Java 21 and wrapper Java 17"
        id: "java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: "temurin"
          java-version: |
            21
            17
        if: "${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.dependency-ready.outcome == 'success' }}"

      - name: Bind the native ordinary daemon JDK
        id: ordinary-jdk21
        if: "${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.dependency-ready.outcome == 'success' }}"
        shell: bash
        run: |
          case "$RUNNER_ARCH" in X64|ARM64) ;; *) echo 'FATAL: unsupported native Java architecture' >&2; exit 1 ;; esac
          daemon_variable="JAVA_HOME_21_${RUNNER_ARCH}"
          daemon_home="${!daemon_variable}"
          case "$daemon_home" in ''|*$'\n'*|*$'\r'*) echo 'FATAL: missing or invalid daemon JDK path' >&2; exit 1 ;; esac
          printf 'P2PKIT_AUDIT_JDK21=%s\n' "$daemon_home" >> "$GITHUB_ENV"

      - name: Verify the ordinary source wrapper
        id: ordinary-wrapper
        if: "${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.dependency-ready.outcome == 'success' }}"
        shell: bash
        run: scripts/check-gradle-wrapper.sh

      - name: Install Android compile platforms for the Linux APK producer
        id: sample-sdk
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.ordinary-admission.outcome == 'success' && steps.ordinary-admission.outputs.sample_packaging_required == 'true' && steps.dependency-ready.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'platforms;android-37.0'
          grep -Fxq 'AndroidVersion.ApiLevel=36' "$ANDROID_HOME/platforms/android-36/source.properties"
          grep -Fxq 'AndroidVersion.ApiLevel=37.0' "$ANDROID_HOME/platforms/android-37.0/source.properties"

      - name: "Run ordinary desktop with private custody"
        id: "ordinary-run"
        if: "${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.recipient-route.outputs.origin == 'ordinary' && steps.dependency-ready.outcome == 'success' && steps.dependency-stage.outcome == 'success' && steps.dependency-stage.outputs.dependency_seed_ready == 'true' && steps.dependency-stage.outputs.dependency_cache_ready == 'true' && steps.dependency-stage.outputs.native_provider_ready == 'true' }}"
        shell: "bash"
        env:
          P2PKIT_DEPENDENCY_SEED_STAGE_OUTCOME: "${{ steps.dependency-stage.outcome }}"
          P2PKIT_DEPENDENCY_SEED_STAGE_SHA256: "${{ steps.dependency-stage.outputs.dependency_seed_staging_sha256 }}"
          P2PKIT_HOSTED_PREPARE_OUTCOME: "${{ steps.dependency-stage.outcome }}"
          P2PKIT_HOSTED_PREPARE_SHA256: "${{ steps.dependency-stage.outputs.preparation_sha256 }}"
          P2PKIT_CACHE_GUARD_OUTCOME: "${{ steps.dependency-stage.outcome }}"
          P2PKIT_CACHE_RESTORATION_SHA256: "${{ steps.dependency-stage.outputs.restoration_sha256 }}"
          P2PKIT_NATIVE_PROVIDER_OUTCOME: "${{ steps.dependency-stage.outcome }}"
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/run-hosted-test-custody.py run --profile desktop --consume-dependencies

      - name: "Run initial desktop with private custody"
        id: "initial-run"
        if: "${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.recipient-route.outputs.origin == 'initial' && steps.dependency-ready.outcome == 'success' && steps.initial-dependency-stage.outcome == 'success' && steps.initial-dependency-stage.outputs.dependency_seed_ready == 'true' && steps.initial-dependency-stage.outputs.dependency_cache_ready == 'true' && steps.initial-dependency-stage.outputs.native_provider_ready == 'true' }}"
        shell: "bash"
        env:
          P2PKIT_DEPENDENCY_SEED_STAGE_OUTCOME: "${{ steps.initial-dependency-stage.outcome }}"
          P2PKIT_DEPENDENCY_SEED_STAGE_SHA256: "${{ steps.initial-dependency-stage.outputs.dependency_seed_staging_sha256 }}"
          P2PKIT_HOSTED_PREPARE_OUTCOME: "${{ steps.initial-dependency-stage.outcome }}"
          P2PKIT_HOSTED_PREPARE_SHA256: "${{ steps.initial-dependency-stage.outputs.preparation_sha256 }}"
          P2PKIT_CACHE_GUARD_OUTCOME: "${{ steps.initial-dependency-stage.outcome }}"
          P2PKIT_CACHE_RESTORATION_SHA256: "${{ steps.initial-dependency-stage.outputs.restoration_sha256 }}"
          P2PKIT_NATIVE_PROVIDER_OUTCOME: "${{ steps.initial-dependency-stage.outcome }}"
          P2PKIT_ACTIONS_READ_TOKEN: "${{ github.token }}"
          P2PKIT_INITIAL_CURRENT_HISTORY_SHA256: "${{ steps.initial-dependency-stage.outputs.initial_current_history_sha256 }}"
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/run-hosted-test-custody.py initial-run --profile desktop

      - name: "Seal ordinary desktop evidence after controller return"
        id: "ordinary-seal"
        if: "${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.recipient-route.outputs.origin == 'ordinary' && steps.ordinary-run.outcome == 'success' }}"
        timeout-minutes: 2
        shell: "bash"
        env:
          P2PKIT_HOSTED_TEST_RUN_OUTCOME: "${{ steps.ordinary-run.outcome }}"
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/run-hosted-test-custody.py validate-public --profile desktop

      - name: "Seal initial desktop evidence after controller return"
        id: "initial-seal"
        if: "${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.recipient-route.outputs.origin == 'initial' && steps.initial-run.outcome == 'success' }}"
        timeout-minutes: 2
        shell: "bash"
        env:
          P2PKIT_HOSTED_TEST_RUN_OUTCOME: "${{ steps.initial-run.outcome }}"
          P2PKIT_ACTIONS_READ_TOKEN: "${{ github.token }}"
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/run-hosted-test-custody.py initial-validate-public --profile desktop

      - name: "Admit the original ordinary DESKTOP evidence upload window"
        id: "ordinary-upload-before"
        if: "${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.recipient-route.outputs.origin == 'ordinary' && steps.ordinary-run.outcome == 'success' && steps.ordinary-seal.outcome == 'success' && steps.ordinary-seal.outputs.artifacts_ready == 'true' }}"
        shell: "bash"
        env:
          P2PKIT_HOSTED_TEST_RUN_OUTCOME: "${{ steps.ordinary-run.outcome }}"
          P2PKIT_HOSTED_TEST_SEAL_OUTCOME: "${{ steps.ordinary-seal.outcome }}"
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/run-hosted-test-custody.py upload-guard before --profile desktop

      - name: "Upload only sealed ordinary desktop evidence"
        id: "ordinary-evidence"
        if: "${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.recipient-route.outputs.origin == 'ordinary' && steps.ordinary-run.outcome == 'success' && steps.ordinary-seal.outcome == 'success' && steps.ordinary-seal.outputs.artifacts_ready == 'true' && steps.ordinary-upload-before.outcome == 'success' && steps.ordinary-upload-before.outputs.upload_ready == 'true' && (steps.ordinary-upload-before.outputs.upload_timeout_minutes == '1' || steps.ordinary-upload-before.outputs.upload_timeout_minutes == '2' || steps.ordinary-upload-before.outputs.upload_timeout_minutes == '3') }}"
        timeout-minutes: "${{ fromJSON(steps.ordinary-upload-before.outputs.upload_timeout_minutes) }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "ordinary-desktop-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            ${{ steps.session-path.outputs.session_directory }}/export/evidence.tar.gz.gpg
            ${{ steps.session-path.outputs.session_directory }}/export/manifest.json
          if-no-files-found: "error"
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
          overwrite: false

      - name: "Verify ordinary DESKTOP upload completed inside its original window"
        id: "ordinary-upload-after"
        if: "${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.recipient-route.outputs.origin == 'ordinary' && steps.ordinary-run.outcome == 'success' && steps.ordinary-seal.outcome == 'success' && steps.ordinary-seal.outputs.artifacts_ready == 'true' && steps.ordinary-upload-before.outcome == 'success' && steps.ordinary-upload-before.outputs.upload_ready == 'true' }}"
        shell: "bash"
        env:
