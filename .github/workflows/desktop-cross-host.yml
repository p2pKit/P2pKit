name: Desktop cross-host
on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        default: all
        options: [all, desktop-linux, desktop-windows, desktop-macos]
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.components.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: components
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          if [[ "$COMPONENT" == all ]]; then COMPONENT=desktop-linux,desktop-windows,desktop-macos; fi
          echo "matrix=$(python3 -B scripts/ci_component.py --matrix "$COMPONENT")" >> "$GITHUB_OUTPUT"
  component:
    name: ${{ matrix.component }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/ci-component.yml
    with:
      component: ${{ matrix.component }}
      runner: ${{ matrix.os }}
      minutes: ${{ matrix.minutes }}
