name: Desktop cross-host

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-cross-host.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "buildSrc/**"
      - "gradle/wrapper/**"
      - "gradle/libs.versions.toml"
      - "gradle/verification-metadata.xml"
      - "gradle.lockfile"
      - "buildscript-gradle.lockfile"
      - "samples/p2p-sample-desktop/**"
      - "samples/p2p-sample-desktop-ui/**"
      - "samples/p2p-sample-rpc/**"
      - "samples/p2p-sample-diagnostics/**"
      - "library/p2p-core/**"
      - "library/p2p-rpc/**"
      - "library/p2p-transport-lan/**"
      - "library/p2p-network-provisioning-desktop/**"
  workflow_dispatch:
    inputs:
      scope:
        description: Existing Desktop matrix or isolated Windows RPC validation (no publication)
        type: choice
        required: true
        default: desktop
        options: [desktop, rpc-windows, rpc-windows-environment]
      rpc_windows_mode:
        description: Windows only; full includes account feasibility, build-only has no account operations
        type: choice
        required: true
        default: full
        options: [full, build-only]
      rpc_windows_environment_case:
        description: Explicit isolated environment experiment; not protected-profile or release qualification
        type: choice
        required: true
        default: all
        options: [all, logon, profile, debug, inheritance, atomic-logon]

permissions:
  contents: read

concurrency:
  group: desktop-cross-host-${{ github.ref }}
  cancel-in-progress: ${{ inputs.scope != 'rpc-windows' && inputs.scope != 'rpc-windows-environment' }}

jobs:
  verify:
    if: ${{ inputs.scope != 'rpc-windows' && inputs.scope != 'rpc-windows-environment' }}
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Verify CLI, Desktop runtime, tests, Hot Reload tooling, and application images
        shell: bash
        run: |
          ./gradlew --no-daemon \
            :p2p-sample-desktop:check \
            :p2p-sample-desktop:installDist \
            :p2p-sample-desktop-ui:test \
            :p2p-sample-desktop-ui:checkRuntime \
            :p2p-sample-desktop-ui:hotRunArgfile \
            :p2p-sample-desktop-ui:createDistributable \
            --console=plain

  rpc-windows:
    name: >-
      ${{ inputs.rpc_windows_mode == 'build-only' &&
      'Windows RPC BUILD/JVM/POLICY UNITS - NOT profile runtime or release' ||
      'Windows RPC build, JVM, policy units and account feasibility - NOT profile runtime or release' }}
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.scope == 'rpc-windows' &&
      github.repository == 'p2pKit/P2pKit' &&
      github.ref == 'refs/heads/work/rpc-windows-validation-20261012'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RPC_WINDOWS_VALIDATION_MODE: ${{ inputs.rpc_windows_mode }}
    steps:
      - name: Check out the exact approved test revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Declare the selected non-release validation scope
        id: validation-scope
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RPC_WINDOWS_VALIDATION_MODE -cnotin @('full', 'build-only')) {
            throw 'Unknown Windows validation mode'
          }
          $scope = if ($env:RPC_WINDOWS_VALIDATION_MODE -ceq 'build-only') {
            'BUILD/JVM/POLICY UNITS; account feasibility: NOT_PERFORMED (explicitly not selected).'
          } else {
            'FULL HOSTED VALIDATION; account feasibility: selected, not yet performed.'
          }
          @($scope, 'Native storage: NOT_PERFORMED. Native runtime/release qualification: NOT_PERFORMED.',
            'Native policy execution is memory-only; no profile DLL or custody smoke executes.',
            'This job cannot satisfy the Windows native runtime or release gate.') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Configure installed Gradle daemon JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Retain daemon toolchain path
        run: '"RPC_WINDOWS_JDK21=$env:JAVA_HOME" >> $env:GITHUB_ENV'

      - name: Configure compiler and native JNI headers from JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate wrapper and reuse branch-scoped dependency caches
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false
          gradle-home-cache-excludes: |
            caches/build-cache-1
            init.d

      - name: Compile actual Win32 and JNI source with MSVC and the Windows SDK
        id: native-build
        timeout-minutes: 10
        run: >-
          ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-hosted-build.ps1

      - name: Compile and run 16 memory-only C policy units, not profile storage
        id: native-policy-units
        timeout-minutes: 10
        run: |
          ./scripts/tests/check-rpc-policy-command-test.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'p2pkit-windows-validation/policy-command-controls')
          ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-hosted-policy-tests.ps1

      - name: Verify standard-user test path refuses the elevated runner without creating accounts or children
        id: standard-user-refusal
        timeout-minutes: 2
        run: |
          ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-standard-user-refusal-test.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'p2pkit-windows-validation/refusal-parser-controls')
          ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-hosted-standard-user-refusal.ps1

      - name: Observe hosted token capabilities without modifying accounts or privileges
        id: account-capabilities
        if: ${{ inputs.rpc_windows_mode != 'build-only' }}
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'p2pkit-windows-validation/account-capabilities.json'
          if (Test-Path -LiteralPath $output) { throw 'Capability observation must be new' }
          ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-hosted-account-capabilities.ps1 |
            Set-Content -LiteralPath $output -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Read-only hosted capability probe failed' }

      - name: Probe atomic launch under a fresh standard account without P2pKit payloads
        id: account-admission
        if: ${{ inputs.rpc_windows_mode != 'build-only' }}
        timeout-minutes: 2
        run: >-
          ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-hosted-account-admission.ps1

      # Partial managed contracts only: no full-provider/profile or Windows runtime claim.
      # DesktopRpcProfileTest requires the POSIX provider; full Windows integration remains blocked.
      - name: Run focused JVM contracts with strict dependency verification
        id: jvm-controls
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          ./gradlew.bat --no-daemon --no-parallel --max-workers=2 --no-build-cache `
            --dependency-verification strict --warning-mode=fail --console=plain `
            "-Dorg.gradle.java.installations.paths=$env:JAVA_HOME,$env:RPC_WINDOWS_JDK21" `
            '-Dorg.gradle.java.installations.auto-download=false' `
            '-Pkotlin.compiler.execution.strategy=in-process' `
            :p2p-sample-rpc:jvmTest `
            --tests dev.p2pkit.sample.rpc.RpcDiscoveryCoordinatorTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileCustodyJniContractTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileCustodyBridgeTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileFilesTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileAcquisitionFailureTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileNativeUncertaintyTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileRecoveryAdmissionTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileStartupSyncTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileLeasePolicyTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileCustodyExceptionTest `
            --tests dev.p2pkit.sample.rpc.profile.ProfileLeaseCloseOwnerTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfilePeImageTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileByteManifestTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfilePinnedImageTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfilePackageStageTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileActualDllVerificationTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileIdentityAdmissionTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileTerminalCloseTest `
            --tests dev.p2pkit.sample.rpc.profile.WindowsProfileTerminalProcessTest `
            --tests dev.p2pkit.sample.rpc.lab.LabVaultCopyOwnershipTest `
            --tests dev.p2pkit.sample.rpc.lab.LabVaultInputValidationTest `
            --tests dev.p2pkit.sample.rpc.desktop.DesktopRpcPanelCloseOwnerTest `
            --tests dev.p2pkit.sample.rpc.desktop.DesktopRpcRunOwnerTest `
            --tests dev.p2pkit.sample.rpc.desktop.RpcDesktopPanelTest `
            --tests dev.p2pkit.sample.rpc.desktop.RpcDesktopWindowsRuntimeReadbackTest `
            --tests dev.p2pkit.sample.rpc.desktop.DesktopRpcProfileAttemptTest `
            --tests dev.p2pkit.sample.rpc.desktop.DesktopRpcPanelUnlockTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows JVM controls failed' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA -or (git status --porcelain)) {
            throw 'Source changed during Windows validation'
          }

      - name: Test Windows final-file sharing pins using synthetic bytes without DLL loading
        id: native-file-pin
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'p2pkit-windows-validation/final-file-pin'
          ./gradlew.bat --no-daemon --no-parallel --max-workers=2 --no-build-cache `
            --dependency-verification strict --warning-mode=fail --console=plain `
            "-Dorg.gradle.java.installations.paths=$env:JAVA_HOME,$env:RPC_WINDOWS_JDK21" `
            '-Dorg.gradle.java.installations.auto-download=false' `
            '-Pkotlin.compiler.execution.strategy=in-process' `
            :p2p-sample-rpc:verifyRpcWindowsPinnedImage "-PrpcWindowsPinOutput=$output"
          if ($LASTEXITCODE -ne 0) { throw 'Windows final-file pin controls failed' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA -or (git status --porcelain)) {
            throw 'Source changed during Windows final-file pin controls'
          }

      - name: Compile the maintained Desktop application and test terminal ownership
        id: desktop-controls
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          ./gradlew.bat --no-daemon --no-parallel --max-workers=2 --no-build-cache `
            --dependency-verification strict --warning-mode=fail --console=plain `
            "-Dorg.gradle.java.installations.paths=$env:JAVA_HOME,$env:RPC_WINDOWS_JDK21" `
            '-Dorg.gradle.java.installations.auto-download=false' `
            '-Pkotlin.compiler.execution.strategy=in-process' `
            :p2p-sample-desktop-ui:test `
            --tests dev.p2pkit.sample.desktop.ui.DesktopTerminalCleanupTest `
            --tests dev.p2pkit.sample.desktop.ui.DesktopSampleNavigationTest `
            --tests dev.p2pkit.sample.desktop.ui.DesktopSampleRunAdmissionTest `
            --tests dev.p2pkit.sample.desktop.ui.DesktopEntryActionTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows Desktop ownership controls failed' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA -or (git status --porcelain)) {
            throw 'Source changed during Windows Desktop controls'
          }

      - name: Run the complete RPC library JVM suite on Windows
        id: rpc-library
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          ./gradlew.bat --no-daemon --no-parallel --max-workers=2 --no-build-cache `
            --dependency-verification strict --warning-mode=fail --console=plain `
            "-Dorg.gradle.java.installations.paths=$env:JAVA_HOME,$env:RPC_WINDOWS_JDK21" `
            '-Dorg.gradle.java.installations.auto-download=false' `
            '-Pkotlin.compiler.execution.strategy=in-process' `
            :p2p-rpc:jvmTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows RPC library tests failed' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA -or (git status --porcelain)) {
            throw 'Source changed during Windows RPC library tests'
          }

      - name: Test isolated JDK21-preview module and refusal paths without Windows API calls
        id: loader-preview
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-runtime-preview-parser-test.ps1 |
            Set-Content -Encoding utf8 -LiteralPath (Join-Path $env:RUNNER_TEMP `
              'p2pkit-windows-validation/loader-preview-parser-controls.json')
          ./gradlew.bat --no-daemon --no-parallel --max-workers=2 --no-build-cache `
            --dependency-verification strict --warning-mode=fail --console=plain `
            "-Dorg.gradle.java.installations.paths=$env:JAVA_HOME,$env:RPC_WINDOWS_JDK21" `
            '-Dorg.gradle.java.installations.auto-download=false' `
            :p2p-sample-rpc:rpcWindowsLoaderJdk21Jar
          if ($LASTEXITCODE -ne 0) { throw 'Isolated adapter compilation failed' }
          python -I -B ./scripts/tests/check-rpc-windows-loader-jdk21.py `
            --java21 $env:RPC_WINDOWS_JDK21 --java17 $env:JAVA_HOME `
            --jar 'samples/p2p-sample-rpc/build/windows-loader-jdk21/p2pkit-windows-loader-jdk21.jar' `
            --output (Join-Path $env:RUNNER_TEMP 'p2pkit-windows-validation/loader-jdk21-controls')
          if ($LASTEXITCODE -ne 0) { throw 'JDK21-preview adapter controls failed' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA -or (git status --porcelain)) {
            throw 'Source changed during adapter validation'
          }

      # Independent byte evidence remains useful after account admission fails; that failure stays fatal.
      - name: Verify actual DLL bytes against compiler receipt without loading native code
        id: native-bytes
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && steps.jvm-controls.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'p2pkit-windows-validation'
          $receiptFile = Join-Path $output 'native-build.json'
          if ((Get-Item -LiteralPath $receiptFile).Length -gt 65536) { throw 'Oversized compiler receipt' }
          $receipt = Get-Content -Raw -LiteralPath $receiptFile | ConvertFrom-Json
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($receipt.source -cne $env:GITHUB_SHA -or $receipt.tree -cne $tree -or
              $receipt.nativeBuild -cne 'PASS' -or
              $receipt.scope -cne 'WINDOWS_NATIVE_BUILD_ONLY_NOT_RUNTIME_OR_RELEASE') {
            throw 'Compiler receipt is not bound to this exact successful build'
          }
          $dllRows = @($receipt.files | Where-Object { $_.name -ceq 'p2pkit-windows-profile.dll' })
          if ($dllRows.Count -ne 1 -or $dllRows[0].sha256 -notmatch '\A[0-9a-fA-F]{64}\z') {
            throw 'Expected one compiler-pinned DLL'
          }
          $dll = Join-Path $output 'dll/p2pkit-windows-profile.dll'
          $byteOutput = Join-Path $output 'byte-inspection'
          ./gradlew.bat --no-daemon --no-parallel --max-workers=2 --no-build-cache `
            --dependency-verification strict --warning-mode=fail --console=plain `
            "-Dorg.gradle.java.installations.paths=$env:JAVA_HOME,$env:RPC_WINDOWS_JDK21" `
            '-Dorg.gradle.java.installations.auto-download=false' `
            '-Pkotlin.compiler.execution.strategy=in-process' `
            :p2p-sample-rpc:verifyRpcWindowsProfileBytes `
            "-PrpcWindowsDll=$dll" "-PrpcWindowsSource=$env:GITHUB_SHA" "-PrpcWindowsTree=$tree" `
            "-PrpcWindowsSha256=$($dllRows[0].sha256.ToLowerInvariant())" "-PrpcWindowsByteOutput=$byteOutput"
          if ($LASTEXITCODE -ne 0) { throw 'Actual DLL byte verification failed' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA -or (git status --porcelain)) {
            throw 'Source changed during actual DLL byte verification'
          }

      - name: Build existing Windows app image and MSI with the staged component, without installation
        id: native-package
        if: ${{ !cancelled() && steps.desktop-controls.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          ./gradlew.bat --no-daemon --no-parallel --max-workers=2 --no-build-cache `
            --dependency-verification strict --warning-mode=fail --console=plain `
            "-Dorg.gradle.java.installations.paths=$env:JAVA_HOME,$env:RPC_WINDOWS_JDK21" `
            '-Dorg.gradle.java.installations.auto-download=false' `
            '-Pkotlin.compiler.execution.strategy=in-process' `
            '-Pp2pkit.rpc.windows.previewAdapter=true' `
            :p2p-sample-desktop-ui:createDistributable :p2p-sample-desktop-ui:packageMsi
          if ($LASTEXITCODE -ne 0) { throw 'Existing Windows package generation failed' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $base = 'samples/p2p-sample-desktop-ui/build'
          $installers = @(Get-ChildItem -LiteralPath "$base/compose/binaries/main/msi" -Filter '*.msi' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one existing MSI target output' }
          $receipt = Join-Path $env:RUNNER_TEMP 'p2pkit-windows-validation/app-image-inspection.json'
          python -I -B ./scripts/verify-rpc-windows-app-image.py `
            --image "$base/compose/binaries/main/app/P2pKit Sample" `
            --compiler "$base/rpc-windows-profile/$env:GITHUB_SHA/compiler/compiler.properties" `
            --msi $installers[0].FullName --source $env:GITHUB_SHA --tree $tree --output $receipt --preview-adapter `
            --diagnostics (Join-Path $env:RUNNER_TEMP 'p2pkit-windows-validation/app-image-diagnostics')
          if ($LASTEXITCODE -ne 0) { throw 'Existing Windows application byte inspection failed' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA -or (git status --porcelain)) {
            throw 'Source changed during existing Windows application packaging'
          }
          'MSI BUILT, NOT INSTALLED. Native component STAGED, NOT LOADED. Not runtime/release qualification.' |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Inspect existing MSI component payload statically without installation
        id: msi-payload
        if: ${{ !cancelled() && steps.native-package.outcome == 'success' }}
        timeout-minutes: 3
        run: ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-hosted-msi-payload.ps1

      - name: Resolve sharing-option classes using the existing build-image launcher
        id: runtime-readback
        if: ${{ !cancelled() && steps.native-package.outcome == 'success' }}
        timeout-minutes: 2
        run: ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-hosted-runtime-readback.ps1

      - name: Resolve disabled named preview adapter through the existing build-image launcher
        id: loader-runtime-readback
        if: ${{ !cancelled() && steps.native-package.outcome == 'success' && steps.loader-preview.outcome == 'success' }}
        timeout-minutes: 2
        run: ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-hosted-runtime-readback.ps1 -PreviewAdapter

      - name: Preserve native build and JVM evidence, never release artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-rpc-validation-${{ inputs.rpc_windows_mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p2pkit-windows-validation/
            samples/p2p-sample-rpc/build/test-results/jvmTest/
            samples/p2p-sample-desktop-ui/build/test-results/test/
            library/p2p-rpc/build/test-results/jvmTest/
          if-no-files-found: error
          retention-days: 7

  rpc-windows-environment:
    name: ${{ matrix.os }} ${{ inputs.rpc_windows_environment_case }} environment - NOT protected profile or release
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.scope == 'rpc-windows-environment' &&
      github.repository == 'p2pKit/P2pKit' &&
      github.ref == 'refs/heads/work/rpc-windows-validation-20261012'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      RPC_WINDOWS_ENVIRONMENT_IMAGE: ${{ matrix.os }}
    steps:
      - name: Check out exact non-release test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Probe disposable ordinary logon and unchanged same-token admission
        if: ${{ !cancelled() && (inputs.rpc_windows_environment_case == 'all' || inputs.rpc_windows_environment_case == 'logon') }}
        timeout-minutes: 5
        shell: pwsh
        run: ./samples/p2p-sample-rpc/native/windows-profile/tests/windows/check-hosted-logon-environment.ps1
      - name: Retain environment evidence including failures, never account profiles
        if: ${{ always() && (inputs.rpc_windows_environment_case == 'all' || inputs.rpc_windows_environment_case == 'logon') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpc-logon-environment-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p2pkit-logon-environment/environment-result.json
            ${{ runner.temp }}/p2pkit-logon-environment/compile.cmd
            ${{ runner.temp }}/p2pkit-logon-environment/p2pkit-logon-environment-probe.exe
            ${{ runner.temp }}/p2pkit-logon-environment/vswhere-stdout.log
            ${{ runner.temp }}/p2pkit-logon-environment/vswhere-stderr.log
            ${{ runner.temp }}/p2pkit-logon-environment/compile-stdout.log
            ${{ runner.temp }}/p2pkit-logon-environment/compile-stderr.log
            ${{ runner.temp }}/p2pkit-logon-environment/invalid-stdout.log
            ${{ runner.temp }}/p2pkit-logon-environment/invalid-stderr.log
            ${{ runner.temp }}/p2pkit-logon-environment/elevated-child-stdout.log
            ${{ runner.temp }}/p2pkit-logon-environment/elevated-child-stderr.log
            ${{ runner.temp }}/p2pkit-logon-environment/elevated-inner-stdout.log
            ${{ runner.temp }}/p2pkit-logon-environment/elevated-inner-stderr.log
            ${{ runner.temp }}/p2pkit-logon-environment/probe-stdout.log
            ${{ runner.temp }}/p2pkit-logon-environment/probe-stderr.log
          if-no-files-found: error
          retention-days: 14

      - name: Observe genuine OS profile setup and retirement without protected payload
        if: ${{ !cancelled() && (inputs.rpc_windows_environment_case == 'all' || inputs.rpc_windows_environment_case == 'profile') }}
        timeout-minutes: 5
        shell: pwsh
