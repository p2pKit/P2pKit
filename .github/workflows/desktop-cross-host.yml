name: Desktop cross-host

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-cross-host.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "buildSrc/**"
      - "gradle/wrapper/**"
      - "gradle/libs.versions.toml"
      - "gradle/verification-metadata.xml"
      - "gradle.lockfile"
      - "samples/p2p-sample-desktop-ui/**"
      - "samples/p2p-sample-diagnostics/**"
      - "library/p2p-core/**"
      - "library/p2p-transport-lan/**"
      - "library/p2p-network-provisioning-desktop/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-cross-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify Desktop runtime, tests, Hot Reload tooling, and application image
        shell: bash
        run: |
          ./gradlew --no-daemon \
            :p2p-sample-desktop-ui:test \
            :p2p-sample-desktop-ui:checkRuntime \
            :p2p-sample-desktop-ui:hotRunArgfile \
            :p2p-sample-desktop-ui:createDistributable \
            --console=plain
