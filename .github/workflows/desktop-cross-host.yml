name: Desktop cross-host

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/desktop-cross-host.yml"
      - ".github/test-evidence-recipient.json"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSE"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "buildSrc/**"
      - "gradle/wrapper/**"
      - "gradle/gradle-daemon-jvm.properties"
      - "gradle/libs.versions.toml"
      - "gradle/verification-metadata.xml"
      - "gradle/windows-directory-control.init.gradle"
      - "scripts/run-windows-directory-control.py"
      - "scripts/package-sample-apps.py"
      - "scripts/tests/package-sample-apps-test.py"
      - "scripts/check-sample-app-workflow-policy.rb"
      - "scripts/tests/check-sample-app-workflow-policy-test.rb"
      - "scripts/tests/run-windows-directory-control-test.py"
      - "scripts/tests/check-windows-directory-control-policy-test.rb"
      - "scripts/tests/fixtures/windows-directory-binding/settings.gradle"
      - "scripts/tests/fixtures/windows-directory-binding/build.gradle"
      - "gradle/test-transcript-custody.init.gradle"
      - "scripts/run-hosted-test-admission.py"
      - "scripts/run-hosted-test-custody.py"
      - "scripts/test-transcript-custody.py"
      - "scripts/run-audit-command.py"
      - "scripts/check-audit-receipt.py"
      - "scripts/audit_processes.py"
      - "scripts/hosted_dependency_seed.py"
      - "scripts/hosted_dependency_seed_files.py"
      - "scripts/hosted_evidence.py"
      - "scripts/hosted_full_job_budget.py"
      - "scripts/hosted_full_simulator.py"
      - "scripts/hosted_full_supplements.py"
      - "scripts/hosted_lock_resources.py"
      - "scripts/hosted_primary_abi.py"
      - "scripts/hosted_test_identity.py"
      - "scripts/hosted_test_query.py"
      - "scripts/hosted_test_evidence.py"
      - "scripts/hosted_windows_evidence.py"
      - "scripts/hosted_windows_files.py"
      - "scripts/check-gradle-wrapper.sh"
      - "scripts/check-hosted-test-workflow-policy.rb"
      - "scripts/check-hosted-test-composition.py"
      - "scripts/tests/check-hosted-test-workflow-policy-test.rb"
      - "scripts/tests/check-hosted-test-composition-test.py"
      - "gradle.lockfile"
      - "buildscript-gradle.lockfile"
      - "samples/p2p-sample-android/**"
      - "samples/sample-kmp-shared/**"
      - "samples/p2p-sample-desktop/**"
      - "samples/p2p-sample-desktop-ui/**"
      - "samples/p2p-sample-diagnostics/**"
      - "library/p2p-core/**"
      - "library/p2p-transport-lan/**"
      - "library/p2p-network-provisioning-desktop/**"
      - "library/p2p-network-provisioning-android/**"
  workflow_dispatch:
    inputs:
      operation:
        description: Sample apps, Windows witness/helpers, Mac capacity, an encrypted lock candidate, or unsigned iphoneos product proof
        type: choice
        options: [desktop, sample-apps, windows-directory-fsync-control, windows-helper-controls, macos-arm64-admission, macos-x64-admission, dependency-lock-candidate, dependency-lock-candidate-x64, dependency-lock-candidate-macos14, iphoneos-product]
        default: desktop
        required: true
      expected_sha:
        description: Exact reviewed source commit (required for witness, helper, capacity, lock-candidate, or iphoneos-product operations)
        type: string
        required: false
        default: ""
      expected_tree:
        description: Exact reviewed source tree (required for witness, helper, capacity, lock-candidate, or iphoneos-product operations)
        type: string
        required: false
        default: ""
      reviewed_base:
        description: Full independently reviewed base SHA; must equal expected_sha for this lock-only candidate
        type: string
        required: false
        default: ""
      evidence_public_key:
        description: ASCII-armored PUBLIC recipient key only; never submit a private key (lock candidate or Windows helper only)
        type: string
        required: false
        default: ""
      evidence_fingerprint:
        description: Exact full recipient public-key fingerprint (lock candidate or Windows helper only)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-cross-host-${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'iphoneos-product' && format('iphoneos-{0}-{1}', github.run_id, github.run_attempt) || github.event_name == 'workflow_dispatch' && (inputs.operation == 'dependency-lock-candidate' || inputs.operation == 'dependency-lock-candidate-x64' || inputs.operation == 'dependency-lock-candidate-macos14') && format('lock-{0}-{1}', github.run_id, github.run_attempt) || github.event_name == 'workflow_dispatch' && (inputs.operation == 'windows-directory-fsync-control' || inputs.operation == 'windows-helper-controls' || inputs.operation == 'macos-arm64-admission' || inputs.operation == 'macos-x64-admission') && format('control-{0}-{1}', github.run_id, github.run_attempt) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || (inputs.operation != 'windows-directory-fsync-control' && inputs.operation != 'windows-helper-controls' && inputs.operation != 'macos-arm64-admission' && inputs.operation != 'macos-x64-admission' && inputs.operation != 'dependency-lock-candidate' && inputs.operation != 'dependency-lock-candidate-x64' && inputs.operation != 'dependency-lock-candidate-macos14' && inputs.operation != 'iphoneos-product') }}

jobs:
  verify:
    name: ${{ matrix.os }}
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.operation != 'windows-directory-fsync-control' && inputs.operation != 'windows-helper-controls' && inputs.operation != 'macos-arm64-admission' && inputs.operation != 'macos-x64-admission' && inputs.operation != 'dependency-lock-candidate' && inputs.operation != 'dependency-lock-candidate-x64' && inputs.operation != 'dependency-lock-candidate-macos14' && inputs.operation != 'iphoneos-product') }}
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Reject unknown Desktop dispatch operations
        shell: bash
        env:
          P2PKIT_DESKTOP_OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$P2PKIT_DESKTOP_OPERATION" != desktop && "$P2PKIT_DESKTOP_OPERATION" != sample-apps ]]; then
            echo 'FATAL: unknown Desktop dispatch operation' >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hold ordinary desktop acquisition until cache qualification
        id: ordinary-activation
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') }}
        shell: bash
        run: |
          echo 'ORDINARY_TEST_ACTIVATION=HOLD; QUALIFIED_DEPENDENCY_CACHE_REQUIRED' >&2
          exit 125

      - name: Admit ordinary desktop source and trusted recipient policy
        id: ordinary-admission
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') }}
        shell: bash
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) role=linux-x64 ;;
            Windows/X64) role=windows-x64 ;;
            macOS/ARM64) role=macos-arm64 ;;
            macOS/X64) role=macos-x64 ;;
            *) echo 'FATAL: unsupported ordinary native host' >&2; exit 1 ;;
          esac
          "$python_bin" -I -B -S scripts/run-hosted-test-admission.py --profile desktop \
            --root "$GITHUB_WORKSPACE" \
            --evidence-directory "$RUNNER_TEMP/p2pkit-test-admission-desktop-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$role"
          printf 'session_directory=%s/p2pkit-test-desktop-%s-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$role" >> "$GITHUB_OUTPUT"

      - name: Bind fresh ordinary sample outputs to this run
        id: ordinary-output
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') }}
        shell: bash
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/package-sample-apps.py prepare --output "$RUNNER_TEMP/p2pkit-sample-apps"

      - name: Bind fresh sample outputs and Gradle home to this run
        id: preview-output
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'sample-apps' }}
        shell: bash
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/package-sample-apps.py prepare --output "$RUNNER_TEMP/p2pkit-sample-apps"
          # runner.temp is not available in job-level env; export after allocation.
          gradle_home="$RUNNER_TEMP/p2pkit-sample-gradle"
          if [[ -e "$gradle_home" || -L "$gradle_home" ]]; then
            echo 'FATAL: sample Gradle home already exists' >&2
            exit 1
          fi
          # Use the native API: Git Bash's mkdir -m can fail changing Windows ACLs.
          "$python_bin" -I -B -S -c 'from pathlib import Path; import sys; Path(sys.argv[1]).mkdir(mode=0o700)' "$gradle_home"
          printf 'GRADLE_USER_HOME=%s\n' "$gradle_home" >> "$GITHUB_ENV"

      - name: Allocate separate ordinary dependency staging
        id: dependency-stage
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') }}
        shell: bash
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/run-hosted-test-custody.py stage-dependencies --profile desktop

      - name: Configure daemon Java 21 and wrapper Java 17
        id: java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Bind the native ordinary daemon JDK
        id: ordinary-jdk21
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') }}
        shell: bash
        run: |
          case "$RUNNER_ARCH" in X64|ARM64) ;; *) echo 'FATAL: unsupported native Java architecture' >&2; exit 1 ;; esac
          daemon_variable="JAVA_HOME_21_${RUNNER_ARCH}"
          daemon_home="${!daemon_variable}"
          case "$daemon_home" in ''|*$'\n'*|*$'\r'*) echo 'FATAL: missing or invalid daemon JDK path' >&2; exit 1 ;; esac
          printf 'P2PKIT_AUDIT_JDK21=%s\n' "$daemon_home" >> "$GITHUB_ENV"

      - name: Validate wrapper and configure Gradle
        id: preview-gradle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'sample-apps' }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Verify the ordinary source wrapper
        id: ordinary-wrapper
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') }}
        shell: bash
        run: scripts/check-gradle-wrapper.sh

      - name: Install Android compile platforms for the Linux APK producer
        id: sample-sdk
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'platforms;android-37.0'
          grep -Fxq 'AndroidVersion.ApiLevel=36' "$ANDROID_HOME/platforms/android-36/source.properties"
          grep -Fxq 'AndroidVersion.ApiLevel=37.0' "$ANDROID_HOME/platforms/android-37.0/source.properties"

      - name: Verify CLI, Desktop runtime, tests, Hot Reload tooling, and application images
        id: sample-build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'sample-apps' }}
        shell: bash
        env:
          P2PKIT_SAMPLE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'sample-apps' }}
        run: |
          tasks=(
            :p2p-sample-desktop:check
            :p2p-sample-desktop:installDist
            :p2p-sample-desktop-ui:test
            :p2p-sample-desktop-ui:checkRuntime
            :p2p-sample-desktop-ui:hotRunArgfile
            :p2p-sample-desktop-ui:createDistributable
          )
          # The explicit build-only operation does not execute the CLI/UI test suites.
          # The ordinary Desktop and PR/main verification task set is unchanged.
          if [[ "$P2PKIT_SAMPLE_ONLY" == true ]]; then
            tasks=(
              :p2p-sample-desktop:installDist
              :p2p-sample-desktop-ui:checkRuntime
              :p2p-sample-desktop-ui:hotRunArgfile
              :p2p-sample-desktop-ui:createDistributable
            )
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            tasks+=(:p2p-sample-android:assembleDebug)
          fi
          case "$RUNNER_OS" in
            Linux) tasks+=(:p2p-sample-desktop-ui:packageDeb) ;;
            Windows) tasks+=(:p2p-sample-desktop-ui:packageMsi) ;;
            macOS) tasks+=(:p2p-sample-desktop-ui:packageDmg) ;;
            *) echo 'FATAL: unsupported installer host' >&2; exit 1 ;;
          esac
          ./gradlew --no-daemon "${tasks[@]}" \
            --dependency-verification strict --no-build-cache --max-workers=2 --no-parallel --console=plain \
            -Dorg.gradle.java.installations.auto-download=false \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_17_ARM64,JAVA_HOME_21_ARM64 \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Stop the sample job's Gradle home on every attempted build
        id: stop-sample-gradle
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'sample-apps' && (steps.sample-build.outcome == 'success' || steps.sample-build.outcome == 'failure' || steps.sample-build.outcome == 'cancelled') }}
        shell: bash
        run: |
          ./gradlew --stop --console=plain \
            -Dorg.gradle.java.installations.auto-download=false \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_17_ARM64,JAVA_HOME_21_ARM64

      - name: Run ordinary desktop with private custody
        id: ordinary-run
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') && steps.dependency-stage.outcome == 'success' && steps.dependency-stage.outputs.dependency_seed_ready == 'true' }}
        shell: bash
        env:
          P2PKIT_DEPENDENCY_SEED_STAGE_OUTCOME: ${{ steps.dependency-stage.outcome }}
          P2PKIT_DEPENDENCY_SEED_STAGE_SHA256: ${{ steps.dependency-stage.outputs.dependency_seed_staging_sha256 }}
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/run-hosted-test-custody.py run --profile desktop --seed-dependencies

      - name: Seal ordinary desktop evidence after controller return
        id: ordinary-seal
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') && steps.ordinary-run.outcome == 'success' }}
        shell: bash
        env:
          P2PKIT_HOSTED_TEST_RUN_OUTCOME: ${{ steps.ordinary-run.outcome }}
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/run-hosted-test-custody.py validate-public --profile desktop

      - name: Upload only sealed ordinary desktop evidence
        id: ordinary-evidence
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') && steps.ordinary-run.outcome == 'success' && steps.ordinary-seal.outcome == 'success' && steps.ordinary-seal.outputs.artifacts_ready == 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ordinary-desktop-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.ordinary-admission.outputs.session_directory }}/export/evidence.tar.gz.gpg
            ${{ steps.ordinary-admission.outputs.session_directory }}/export/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
          overwrite: false

      - name: Require the complete ordinary desktop result
        id: ordinary-required
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') }}
        shell: bash
        env:
          ORDINARY_ACTIVATION: ${{ steps.ordinary-activation.outcome }}
          ORDINARY_ADMISSION: ${{ steps.ordinary-admission.outcome }}
          DEPENDENCY_STAGE: ${{ steps.dependency-stage.outcome }}
          JAVA: ${{ steps.java.outcome }}
          ORDINARY_JDK21: ${{ steps.ordinary-jdk21.outcome }}
          ORDINARY_OUTPUT: ${{ steps.ordinary-output.outcome }}
          ORDINARY_WRAPPER: ${{ steps.ordinary-wrapper.outcome }}
          ORDINARY_RUN: ${{ steps.ordinary-run.outcome }}
          ORDINARY_SEAL: ${{ steps.ordinary-seal.outcome }}
          ORDINARY_EVIDENCE: ${{ steps.ordinary-evidence.outcome }}
          SEED_READY: ${{ steps.dependency-stage.outputs.dependency_seed_ready }}
          ARTIFACTS_READY: ${{ steps.ordinary-seal.outputs.artifacts_ready }}
          PROFILE_PASSED: ${{ steps.ordinary-seal.outputs.profile_passed }}
          SDK_OUTCOME: ${{ steps.sample-sdk.outcome }}
        run: |
          test "$ORDINARY_ACTIVATION" = success
          test "$ORDINARY_ADMISSION" = success
          test "$DEPENDENCY_STAGE" = success
          test "$JAVA" = success
          test "$ORDINARY_JDK21" = success
          test "$ORDINARY_OUTPUT" = success
          test "$ORDINARY_WRAPPER" = success
          test "$ORDINARY_RUN" = success
          test "$ORDINARY_SEAL" = success
          test "$ORDINARY_EVIDENCE" = success
          test "$SEED_READY" = true
          test "$ARTIFACTS_READY" = true
          test "$PROFILE_PASSED" = true
          case "$RUNNER_OS" in
            Linux) test "$SDK_OUTCOME" = success ;;
            Windows|macOS) test "$SDK_OUTCOME" = skipped ;;
            *) exit 1 ;;
          esac

      - name: Inspect and archive successful development sample apps
        id: sample-packaging
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.operation == 'sample-apps' && steps.sample-build.outcome == 'success' && steps.stop-sample-gradle.outcome == 'success') || ((github.event_name != 'workflow_dispatch' || inputs.operation == 'desktop') && steps.ordinary-required.outcome == 'success')) }}
        shell: bash
        run: |
          python_bin=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_bin=python; fi
          "$python_bin" -I -B -S scripts/package-sample-apps.py package --output "$RUNNER_TEMP/p2pkit-sample-apps"

      - name: Upload native Desktop development apps
        if: ${{ success() && steps.sample-packaging.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sample-desktop-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2pkit-sample-apps/desktop/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
          overwrite: false

      - name: Upload Android development APK
        if: ${{ success() && runner.os == 'Linux' && steps.sample-packaging.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sample-android-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2pkit-sample-apps/android/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
          overwrite: false

  windows-directory-fsync-control:
    name: windows-directory-fsync-control
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'windows-directory-fsync-control' }}
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      P2PKIT_OPERATION: ${{ inputs.operation }}
      P2PKIT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      P2PKIT_EXPECTED_TREE: ${{ inputs.expected_tree }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out exact reviewed control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Admit genuine dispatch and exact clean source
        shell: pwsh
        run: |
          python -B scripts/run-windows-directory-control.py admit
          exit $LASTEXITCODE

      - name: Configure native daemon Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64

      - name: Retain daemon JDK path
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME) -or $env:JAVA_HOME.Contains("`n") -or $env:JAVA_HOME.Contains("`r")) {
            throw 'Missing or invalid daemon JDK path'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "P2PKIT_AUDIT_JDK21=$env:JAVA_HOME"

      - name: Configure native wrapper and test Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      # No setup-gradle/cache action, publisher environment or secret is used.
      - name: Run current then method-preimage Windows witness
        id: control
        timeout-minutes: 92
        shell: pwsh
        run: |
          python -B scripts/run-windows-directory-control.py run
          exit $LASTEXITCODE

      - name: Retain nonprivate admission evidence
        if: ${{ always() && steps.control.outputs.artifacts_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-directory-fsync-admission-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.control.outputs.public_root }}/admission
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false

      - name: Retain nonprivate current-source evidence
        if: ${{ always() && steps.control.outputs.artifacts_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-directory-fsync-current-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.control.outputs.public_root }}/current
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false

      - name: Retain nonprivate preimage evidence
        if: ${{ always() && steps.control.outputs.artifacts_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-directory-fsync-preimage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.control.outputs.public_root }}/preimage
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false

      - name: Fail if safe retained evidence is unavailable
        if: ${{ always() && steps.control.outputs.artifacts_ready != 'true' }}
        shell: pwsh
        run: throw 'Windows control did not seal safe original evidence; no acceptance claim'

  windows-helper-controls:
    name: windows-helper-controls
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'windows-helper-controls' }}
    permissions:
      contents: read
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      P2PKIT_OPERATION: ${{ inputs.operation }}
      P2PKIT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      P2PKIT_EXPECTED_TREE: ${{ inputs.expected_tree }}
      P2PKIT_REVIEWED_BASE: ${{ inputs.reviewed_base }}
      P2PKIT_EVIDENCE_PUBLIC_KEY: ${{ inputs.evidence_public_key }}
      P2PKIT_EVIDENCE_FINGERPRINT: ${{ inputs.evidence_fingerprint }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out exact reviewed helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Installed native Python/Git/GPG only. No SDK, Gradle, cache, installer,
      # credential scope, private key, ordinary-policy bootstrap or publication.
      - name: Run fixed native Windows helper controls with private custody
        id: control
        timeout-minutes: 21
        shell: pwsh
        run: |
          python -I -B -S scripts/run-hosted-windows-helper-controls.py run
          exit $LASTEXITCODE

      - name: Seal exact ciphertext after the helper interpreter returns
        id: seal
        if: ${{ always() }}
        timeout-minutes: 2
        shell: pwsh
        env:
          P2PKIT_HELPER_RUN_OUTCOME: ${{ steps.control.outcome }}
        run: |
          python -I -B -S scripts/run-hosted-windows-helper-controls.py validate-public
          exit $LASTEXITCODE

      - name: Retain only sealed encrypted helper evidence
        id: ciphertext
        if: ${{ always() && steps.seal.outcome == 'success' && steps.seal.outputs.artifacts_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-helper-controls-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p2pkit-windows-helper-export-${{ github.run_id }}-${{ github.run_attempt }}/evidence.tar.gz.gpg
            ${{ runner.temp }}/p2pkit-windows-helper-export-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false

      - name: Require passing controls and complete encrypted retention
        if: ${{ always() && (steps.control.outcome != 'success' || steps.seal.outcome != 'success' || steps.seal.outputs.artifacts_ready != 'true' || steps.seal.outputs.controls_passed != 'true' || steps.ciphertext.outcome != 'success') }}
        shell: pwsh
        run: throw 'Windows helper controls or encrypted retention failed; private review is still required'

  mac-host-admission-probe:
    name: mac-host-admission-probe
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'macos-arm64-admission' || inputs.operation == 'macos-x64-admission') }}
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    runs-on: ${{ inputs.operation == 'macos-arm64-admission' && 'macos-26' || 'macos-15-intel' }}
    timeout-minutes: 5
    env:
      P2PKIT_OPERATION: ${{ inputs.operation }}
      P2PKIT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      P2PKIT_EXPECTED_TREE: ${{ inputs.expected_tree }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out exact reviewed capacity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # This collector creates no children and does not admit native ownership,
      # toolchains, simulators or the dependency writer. No cache or secret scope.
      - name: Observe no-child Mac OS and capacity metadata
        id: snapshot
        timeout-minutes: 2
        shell: bash
        run: exec python3 -I -B -S scripts/run-mac-host-admission.py run

      - name: Validate exact public capacity evidence
        id: public
        if: ${{ always() }}
        timeout-minutes: 2
        shell: bash
        run: exec python3 -I -B -S scripts/run-mac-host-admission.py validate-public

      - name: Retain nonprivate capacity metadata
        if: ${{ always() && steps.public.outputs.artifacts_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-host-capacity-${{ inputs.operation }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2pkit-mac-host-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false

      - name: Fail if safe capacity evidence is unavailable
        if: ${{ always() && steps.public.outputs.artifacts_ready != 'true' }}
        shell: bash
        run: |
          echo 'FATAL: no safe complete capacity evidence; no host admission claim' >&2
          exit 1

  dependency-lock-candidate:
    name: dependency-lock-candidate
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'dependency-lock-candidate' || inputs.operation == 'dependency-lock-candidate-x64' || inputs.operation == 'dependency-lock-candidate-macos14') }}
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ${{ inputs.operation == 'dependency-lock-candidate-macos14' && 'macos-14' || inputs.operation == 'dependency-lock-candidate-x64' && 'macos-15-intel' || 'macos-26' }}
    timeout-minutes: 195
    env:
      DEVELOPER_DIR: ${{ inputs.operation == 'dependency-lock-candidate-macos14' && '/Applications/Xcode_16.2.app/Contents/Developer' || inputs.operation == 'dependency-lock-candidate-x64' && '/Applications/Xcode_26.3.app/Contents/Developer' || '/Applications/Xcode_26.5.app/Contents/Developer' }}
      P2PKIT_OPERATION: ${{ inputs.operation }}
      P2PKIT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      P2PKIT_EXPECTED_TREE: ${{ inputs.expected_tree }}
      P2PKIT_REVIEWED_BASE: ${{ inputs.reviewed_base }}
      P2PKIT_EVIDENCE_PUBLIC_KEY: ${{ inputs.evidence_public_key }}
      P2PKIT_EVIDENCE_FINGERPRINT: ${{ inputs.evidence_fingerprint }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out exact reviewed lock-candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # No tool installers, cache restores, publisher credentials or raw-log
      # uploads. The mutable controller admits the real host before the writer.
      - name: Admit host and generate private full-lock candidate
        id: candidate
        timeout-minutes: 170
        shell: bash
        run: exec "$DEVELOPER_DIR/usr/bin/python3" -I -B -S scripts/run-hosted-lock-candidate.py run

      - name: Seal private original evidence after controller exit
        id: seal
        if: ${{ always() }}
        timeout-minutes: 15
        shell: bash
        run: exec "$DEVELOPER_DIR/usr/bin/python3" -I -B -S scripts/run-hosted-lock-candidate.py seal

      - name: Validate exact encrypted public evidence
        id: public
        if: ${{ always() }}
        timeout-minutes: 2
        shell: bash
        run: exec "$DEVELOPER_DIR/usr/bin/python3" -I -B -S scripts/run-hosted-lock-candidate.py validate-public

      - name: Retain encrypted lock-candidate evidence
        if: ${{ always() && steps.public.outputs.artifacts_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encrypted-lock-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2pkit-lock-export-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
          overwrite: false

      - name: Fail if encrypted retained evidence is unavailable
        if: ${{ always() && steps.public.outputs.artifacts_ready != 'true' }}
        shell: bash
        run: |
          echo 'FATAL: no safe encrypted lock-candidate evidence; no acceptance claim' >&2
          exit 1

  iphoneos-product:
    name: iphoneos-product
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'iphoneos-product' }}
    permissions:
      contents: read
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      P2PKIT_OPERATION: ${{ inputs.operation }}
      P2PKIT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      P2PKIT_EXPECTED_TREE: ${{ inputs.expected_tree }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out exact reviewed iphoneos recipe source
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Admit exact manual iphoneos product dispatch
        timeout-minutes: 1
        shell: bash
        run: exec "$DEVELOPER_DIR/usr/bin/python3" -I -B -S scripts/run-hosted-iphoneos-product.py admit

      - name: Configure native iphoneos producer JDKs
        timeout-minutes: 10
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          architecture: arm64
          java-version: |
            21
            17

      - name: Bind native daemon JDK path
        timeout-minutes: 1
        shell: bash
        run: |
          jdk="${JAVA_HOME_21_ARM64:?Missing native daemon JDK}"
          [[ "$jdk" == /* && "$jdk" != *$'\n'* && "$jdk" != *$'\r'* ]]
          printf 'P2PKIT_AUDIT_JDK21=%s\n' "$jdk" >> "$GITHUB_ENV"

      # No device/runtime, SDK-license acceptance, cache import or signing scope.
      # Both literal Android compile SDKs must already be present; otherwise HOLD.
      - name: Build and inspect fresh unsigned iphoneos recipe product
        id: product
        timeout-minutes: 155
        shell: bash
        run: exec "$DEVELOPER_DIR/usr/bin/python3" -I -B -S scripts/run-hosted-iphoneos-product.py run

      - name: Validate exact original iphoneos metadata after driver return
        id: public
        if: ${{ always() }}
        timeout-minutes: 2
        shell: bash
        env:
          P2PKIT_IPHONEOS_RUN_OUTCOME: ${{ steps.product.outcome }}
        run: exec "$DEVELOPER_DIR/usr/bin/python3" -I -B -S scripts/run-hosted-iphoneos-product.py validate-public

      - name: Retain only allowlisted iphoneos recipe evidence
        id: evidence
        if: ${{ always() && steps.public.outcome == 'success' && steps.public.outputs.artifacts_ready == 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iphoneos-product-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2pkit-iphoneos-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          compression-level: 0

      - name: Require actual product proof and retained evidence
        if: ${{ always() && (steps.product.outcome != 'success' || steps.public.outcome != 'success' || steps.public.outputs.product_passed != 'true' || steps.public.outputs.artifacts_ready != 'true' || steps.evidence.outcome != 'success') }}
        timeout-minutes: 1
        shell: bash
        run: |
          echo 'FATAL: iphoneos recipe product or original evidence incomplete; no acceptance claim' >&2
          exit 1
