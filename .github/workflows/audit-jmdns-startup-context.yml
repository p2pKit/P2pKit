name: Direct Java JmDNS startup diagnostic

# Registration only: a push never starts the diagnostic or a build.
# Diagnostic-only: never a generated dependency candidate or Release qualification.
on:
  push:
    branches: ['work/release-foundation-dependency-context-startup-*']
    paths: [.github/workflows/audit-jmdns-startup-context.yml]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact independently reviewed controller and Java diagnostic commit at this ref
        required: true
        type: string
      source_tree:
        description: Exact independently reviewed controller and Java diagnostic tree
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  jmdns_startup:
    if: ${{ github.repository == 'p2pKit/P2pKit' && github.event_name == 'workflow_dispatch' && github.actor == 'Apdelrahman1911' && github.actor_id == '104788132' && github.triggering_actor == 'Apdelrahman1911' }}
    concurrency:
      group: p2pkit-nonphysical-heavy
      queue: max
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 210
    defaults:
      run:
        shell: bash
    steps:
      - name: Allocate the original bounded private Java diagnostic
        timeout-minutes: 1
        shell: /Library/Developer/CommandLineTools/usr/bin/python3 -I -B -S {0}
        env:
          P2PKIT_JMDNS_STARTUP_REQUEST: ${{ toJSON(inputs) }}
        run: |
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import stat
          import sys
          import tempfile
          import time

          UINT64 = (1 << 64) - 1
          CLOCK_SCHEMA = 2
          CLOCK_DOMAIN = 'darwin.clock_gettime_ns(CLOCK_MONOTONIC_RAW)'
          SCOPE = 'DIRECT_JAVA_STARTUP_DIAGNOSTIC_V1'

          def require(value):
              if not value:
                  raise ValueError('REFUSED')

          def shared_raw_ns():
              require(sys.platform == 'darwin' and callable(getattr(time, 'clock_gettime_ns', None)) and
                      type(getattr(time, 'CLOCK_MONOTONIC_RAW', None)) is int)
              value = time.clock_gettime_ns(time.CLOCK_MONOTONIC_RAW)
              require(type(value) is int and 0 <= value <= UINT64)
              return value

          def unique(pairs):
              value = {}
              for key, item in pairs:
                  require(key not in value)
                  value[key] = item
              return value

          def parsed(raw):
              return json.loads(raw, object_pairs_hook=unique,
                                parse_constant=lambda _: require(False))

          def physical(value):
              path = Path(value)
              require(type(value) is str and path.is_absolute() and not value.startswith('//') and
                      str(path) == value and '..' not in path.parts and
                      all(ord(char) >= 32 and ord(char) != 127 for char in value))
              require(all(not item.is_symlink() for item in (path, *path.parents)))
              return path

          try:
              started, wall = shared_raw_ns(), time.time_ns()
              os.umask(0o077)
              env = os.environ
              require(sys.platform == 'darwin' and platform.machine() == 'arm64' and
                      env.get('RUNNER_OS') == 'macOS' and env.get('RUNNER_ARCH') == 'ARM64' and
                      env.get('RUNNER_ENVIRONMENT') == 'github-hosted' and
                      env.get('GITHUB_ACTIONS') == 'true' and env.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and
                      env.get('GITHUB_REPOSITORY') == 'p2pKit/P2pKit' and
                      env.get('GITHUB_JOB') == 'jmdns_startup' and
                      env.get('GITHUB_ACTOR') == env.get('GITHUB_TRIGGERING_ACTOR') == 'Apdelrahman1911' and
                      env.get('GITHUB_ACTOR_ID') == '104788132' and
                      0 < os.getuid() == os.geteuid() and os.getgid() == os.getegid())
              request_raw = env['P2PKIT_JMDNS_STARTUP_REQUEST']
              require(len(request_raw.encode('utf-8')) <= 16384)
              request = parsed(request_raw)
              require(type(request) is dict and set(request) == {'source_sha', 'source_tree'} and
                      all(type(value) is str and re.fullmatch(r'[0-9a-f]{40}', value) for value in request.values()))
              ref = env['GITHUB_REF']
              require(re.fullmatch(r'refs/heads/work/release-foundation-dependency-context-startup-[A-Za-z0-9-]+', ref) and
                      request['source_sha'] == env['GITHUB_SHA'] == env['GITHUB_WORKFLOW_SHA'] and
                      env['GITHUB_WORKFLOW_REF'] ==
                      'p2pKit/P2pKit/.github/workflows/audit-jmdns-startup-context.yml@' + ref and
                      all(re.fullmatch(r'[1-9][0-9]{0,19}', env[name])
                          for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')))
              # Existing policy's full-job entry cutoff, not a renewed lifetime.
              require(wall < 1792508160 * 1000000000)
              event_path = physical(env['GITHUB_EVENT_PATH'])
              fd = os.open(event_path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as event:
                  before = os.fstat(event.fileno())
                  require(stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid() and before.st_nlink == 1 and
                          not before.st_mode & 0o022 and 0 < before.st_size <= 2 * 1024 * 1024)
                  raw = event.read(2 * 1024 * 1024 + 1)
                  stamp = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_nlink,
                                     s.st_size, s.st_mtime_ns, s.st_ctime_ns)
                  require(len(raw) == before.st_size and stamp(before) == stamp(os.fstat(event.fileno())) ==
                          stamp(event_path.lstat()) and parsed(raw)['inputs'] == request)
              require(not any(name in env for name in ('P2PKIT_AUDIT_JOB_ID',
                      'P2PKIT_AUDIT_OWNERSHIP_CHAIN', 'P2PKIT_AUDIT_OWNERSHIP_DOMAINS',
                      'P2PKIT_AUDIT_STATE_DIR', 'GRADLE_USER_HOME')))
              temporary = physical(env['RUNNER_TEMP'])
              require(temporary.is_dir())
              parent = Path(tempfile.mkdtemp(prefix='p2pkit-jmdns-startup-', dir=temporary))
              allocation = dict(schema=CLOCK_SCHEMA, clockDomain=CLOCK_DOMAIN, scope=SCOPE,
                                source=request['source_sha'], sourceTree=request['source_tree'],
                                runId=env['GITHUB_RUN_ID'], runAttempt=env['GITHUB_RUN_ATTEMPT'],
                                startedMonotonicNs=started, startedEpochNs=wall)
              with (parent / 'allocation.json').open('x', encoding='ascii') as output:
                  json.dump(allocation, output, sort_keys=True, separators=(',', ':'), allow_nan=False)
                  output.write('\n')
                  output.flush()
                  os.fsync(output.fileno())
              require(0 <= shared_raw_ns() - started < 60 * 1000000000)
              command = physical(env['GITHUB_ENV'])
              fd = os.open(command, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
              with os.fdopen(fd, 'wb') as output:
                  before = os.fstat(output.fileno())
                  require(stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid() and before.st_nlink == 1 and
                          not before.st_mode & 0o022 and before.st_size <= 65536 and
                          stamp(before) == stamp(command.lstat()))
                  update = ('P2PKIT_JMDNS_STARTUP_OPERATION=' + str(parent) + '\n').encode('utf-8')
                  require(output.write(update) == len(update))
                  output.flush()
                  os.fsync(output.fileno())
                  after = os.fstat(output.fileno())
                  require(stamp(after) == stamp(command.lstat()) and stamp(before)[:5] == stamp(after)[:5] and
                          after.st_size == before.st_size + len(update))
              require(0 <= shared_raw_ns() - started < 60 * 1000000000)
          except BaseException:
              print('P2PKIT_JMDNS_STARTUP_FAILURE|PREPARE|REFUSED')
              raise SystemExit(125)

      - name: Check out the exact reviewed controller without credentials
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Fetch full source ancestry with heads-only no-tag refspecs
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse --is-shallow-repository)" = true
          test -z "$(git -C controller for-each-ref --format='%(refname)' refs/tags)"
          git -C controller fetch --no-tags --no-recurse-submodules --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git -C controller rev-parse --is-shallow-repository)" = false
          test -z "$(git -C controller for-each-ref --format='%(refname)' refs/tags)"

      - name: Configure admitted Java 21 daemon toolchain
        timeout-minutes: 5
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Retain installed daemon toolchain path
        timeout-minutes: 1
        run: printf 'P2PKIT_AUDIT_JDK21=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Configure Java 17 compiler and lifecycle runtime
        timeout-minutes: 5
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile unchanged Java once and run the eight fixed lifecycle modes
        id: startup
        timeout-minutes: 165
        env:
          P2PKIT_JMDNS_STARTUP_REQUEST: ${{ toJSON(inputs) }}
        run: /Library/Developer/CommandLineTools/usr/bin/python3 -I -B -S controller/scripts/run-hosted-jmdns-startup.py run

      - name: Admit original successful diagnostic encryption return
        id: success_guard
        timeout-minutes: 1
        env:
          P2PKIT_JMDNS_STARTUP_REQUEST: ${{ toJSON(inputs) }}
          P2PKIT_JMDNS_STARTUP_OUTCOME: ${{ steps.startup.outcome }}
          P2PKIT_JMDNS_STARTUP_SUCCESS_SHA256: ${{ steps.startup.outputs.successSha256 }}
          P2PKIT_JMDNS_STARTUP_FAILED_SHA256: ${{ steps.startup.outputs.failedProductSha256 }}
        run: /Library/Developer/CommandLineTools/usr/bin/python3 -I -B -S controller/scripts/run-hosted-jmdns-startup.py before-upload

      - name: Retain only encrypted successful diagnostic originals
        id: encrypted
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jmdns-startup-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.P2PKIT_JMDNS_STARTUP_OPERATION }}/outputs/encrypted/evidence.tar.gz.gpg
            ${{ env.P2PKIT_JMDNS_STARTUP_OPERATION }}/outputs/encrypted/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Verify successful upload return and unchanged encrypted bytes
        timeout-minutes: 1
        env:
          P2PKIT_JMDNS_STARTUP_REQUEST: ${{ toJSON(inputs) }}
          P2PKIT_JMDNS_STARTUP_OUTCOME: ${{ steps.startup.outcome }}
          P2PKIT_JMDNS_STARTUP_SUCCESS_SHA256: ${{ steps.startup.outputs.successSha256 }}
          P2PKIT_JMDNS_STARTUP_FAILED_SHA256: ${{ steps.startup.outputs.failedProductSha256 }}
          P2PKIT_JMDNS_STARTUP_UPLOAD_OUTCOME: ${{ steps.encrypted.outcome }}
          P2PKIT_JMDNS_STARTUP_ARTIFACT_ID: ${{ steps.encrypted.outputs.artifact-id }}
          P2PKIT_JMDNS_STARTUP_ARTIFACT_DIGEST: ${{ steps.encrypted.outputs.artifact-digest }}
        run: /Library/Developer/CommandLineTools/usr/bin/python3 -I -B -S controller/scripts/run-hosted-jmdns-startup.py after-upload

      - name: Admit only a known-closed failed-product diagnostic
        id: failed_guard
        if: ${{ failure() && !cancelled() && steps.startup.outcome == 'failure' && steps.startup.outputs.failedProductSha256 != '' && steps.startup.outputs.successSha256 == '' }}
        timeout-minutes: 1
        env:
          P2PKIT_JMDNS_STARTUP_REQUEST: ${{ toJSON(inputs) }}
          P2PKIT_JMDNS_STARTUP_OUTCOME: ${{ steps.startup.outcome }}
          P2PKIT_JMDNS_STARTUP_SUCCESS_SHA256: ${{ steps.startup.outputs.successSha256 }}
          P2PKIT_JMDNS_STARTUP_FAILED_SHA256: ${{ steps.startup.outputs.failedProductSha256 }}
        run: /Library/Developer/CommandLineTools/usr/bin/python3 -I -B -S controller/scripts/run-hosted-jmdns-startup.py before-failed-upload

      - name: Retain only encrypted failed-product diagnostic originals
        id: failed_encrypted
        if: ${{ failure() && !cancelled() && steps.startup.outcome == 'failure' && steps.startup.outputs.failedProductSha256 != '' && steps.startup.outputs.successSha256 == '' && steps.failed_guard.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jmdns-startup-failed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.P2PKIT_JMDNS_STARTUP_OPERATION }}/outputs/failed-encrypted/evidence.tar.gz.gpg
            ${{ env.P2PKIT_JMDNS_STARTUP_OPERATION }}/outputs/failed-encrypted/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Verify original failed-product upload without changing its failure
        if: ${{ failure() && !cancelled() && steps.startup.outcome == 'failure' && steps.startup.outputs.failedProductSha256 != '' && steps.startup.outputs.successSha256 == '' && steps.failed_guard.outcome == 'success' && steps.failed_encrypted.outcome == 'success' }}
        timeout-minutes: 1
        env:
          P2PKIT_JMDNS_STARTUP_REQUEST: ${{ toJSON(inputs) }}
          P2PKIT_JMDNS_STARTUP_OUTCOME: ${{ steps.startup.outcome }}
          P2PKIT_JMDNS_STARTUP_SUCCESS_SHA256: ${{ steps.startup.outputs.successSha256 }}
          P2PKIT_JMDNS_STARTUP_FAILED_SHA256: ${{ steps.startup.outputs.failedProductSha256 }}
          P2PKIT_JMDNS_STARTUP_UPLOAD_OUTCOME: ${{ steps.failed_encrypted.outcome }}
          P2PKIT_JMDNS_STARTUP_ARTIFACT_ID: ${{ steps.failed_encrypted.outputs.artifact-id }}
          P2PKIT_JMDNS_STARTUP_ARTIFACT_DIGEST: ${{ steps.failed_encrypted.outputs.artifact-digest }}
        run: /Library/Developer/CommandLineTools/usr/bin/python3 -I -B -S controller/scripts/run-hosted-jmdns-startup.py after-failed-upload
