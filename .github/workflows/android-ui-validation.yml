name: Android rendered UI validation
on:
  workflow_call:
    inputs:
      case:
        description: UI witness only (317, 324, or both)
        required: false
        default: both
        type: string
  workflow_dispatch:
    inputs:
      case:
        description: UI witness (not physical or API37 LAN acceptance)
        required: true
        default: both
        type: choice
        options: ['both', '317', '324']
permissions:
  contents: read
concurrency:
  group: android-ui-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CI_EVIDENCE_RECIPIENT_SHA256: ${{ vars.CI_EVIDENCE_RECIPIENT_SHA256 }}
      CI_EVIDENCE_RECIPIENT_FINGERPRINT: ${{ vars.CI_EVIDENCE_RECIPIENT_FINGERPRINT }}
    steps:
      - name: Check out exact event source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure Java 21 daemon/runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Java 17 library toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Select job-owned optional Gradle cache
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
      - name: Configure optional verified dependency cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/build-cache-1
            caches/*/kotlin-dsl
            caches/*/scripts
            caches/*/groovy-dsl
      - name: Install exact producer NDK and API35 witness image
        timeout-minutes: 12
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'platforms;android-37.0' 'ndk;29.0.14206865' \
            'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Admit KVM for this hosted job user
        id: kvm
        run: |
          test -c /dev/kvm
          getfacl -p /dev/kvm > "$RUNNER_TEMP/android-ui-kvm-original.acl"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build exact APKs and run fresh owned UI witnesses
        id: execution
        env:
          UI_CASE: ${{ inputs.case || 'both' }}
        run: |
          python3 -B scripts/ci_evidence.py --component android-ui --timeout-seconds 3600 \
            --output-dir "$RUNNER_TEMP/android-ui-evidence" \
            --report-glob 'build/reports/android-ui/**/*' -- \
            python3 -B scripts/run-android-ui-validation.py --case "$UI_CASE"
      - name: Restore the original hosted KVM access policy
        if: ${{ always() && steps.kvm.outcome != 'skipped' }}
        run: |
          original="$RUNNER_TEMP/android-ui-kvm-original.acl"
          if test -f "$original"; then
            sudo setfacl --restore="$original"
            getfacl -p /dev/kvm > "$RUNNER_TEMP/android-ui-kvm-final.acl"
            cmp "$original" "$RUNNER_TEMP/android-ui-kvm-final.acl"
          fi
      - name: Retain encrypted original evidence, including failures
        if: ${{ always() && steps.execution.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-ui-evidence/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false
