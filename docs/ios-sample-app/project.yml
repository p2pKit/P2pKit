# XcodeGen project spec for the P2pKit iOS sample.
#
# Usage:
#   1. Drop a built P2pKitShared.framework next to this file.
#   2. `xcodegen generate`
#   3. `open p2pkit-sample.xcodeproj`
#
# The framework path is set up for the simulator-arm64 debug build by
# default; switch to releaseFramework/iosArm64 when building for a real
# iPhone, OR build an XCFramework with both slices and reference that.

name: p2pkit-sample
options:
  bundleIdPrefix: dev.p2pkit
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

targets:
  p2pkit-sample:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - P2pKitSampleApp.swift
      - ContentView.swift
      - KitController.swift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.p2pkit.sample
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: Info.plist
        # Embed the Kotlin-generated framework. Adjust the path if you
        # copied it elsewhere.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)"
        OTHER_LDFLAGS: "-framework P2pKitShared"
    dependencies:
      - framework: P2pKitShared.framework
        embed: true
        codeSign: true
