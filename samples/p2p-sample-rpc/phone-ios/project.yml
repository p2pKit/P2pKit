name: p2pkit-rpc-phone
options:
  bundleIdPrefix: dev.p2pkit.rpc
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
targets:
  p2pkit-rpc-phone:
    type: application
    platform: iOS
    sources:
      - samples/p2p-sample-rpc/phone-ios/Sources
    info:
      # Run XcodeGen with the repository as --project-root. All generated files
      # stay under the existing, precisely owned module build output directory.
      path: samples/p2p-sample-rpc/build/phone-ios/Info.plist
      properties:
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: "Run explicitly selected, authenticated RPC tests inside your approved local network."
        NSBonjourServices:
          - "_p2pkit2._tcp"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.p2pkit.rpc.phonelab
        PRODUCT_MODULE_NAME: P2pKitRpcPhone
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      # Framework references (unlike sources) are relative to the generated project.
      - framework: ../XCFrameworks/debug/P2pKitRpcExample.xcframework
        embed: false
    preBuildScripts:
      - name: "Verify current-source RPC example XCFramework"
        script: sh "$SRCROOT/../../phone-ios/check-xcframework.sh"
        basedOnDependencyAnalysis: false
  p2pkit-rpc-phone-tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - samples/p2p-sample-rpc/phone-ios/Tests
    dependencies:
      - target: p2pkit-rpc-phone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.p2pkit.rpc.phonelab.tests
        GENERATE_INFOPLIST_FILE: YES
  p2pkit-rpc-phone-uitests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - samples/p2p-sample-rpc/phone-ios/UITests
    dependencies:
      - target: p2pkit-rpc-phone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.p2pkit.rpc.phonelab.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  p2pkit-rpc-phone:
    build:
      targets:
        p2pkit-rpc-phone: all
    run:
      config: Debug
  p2pkit-rpc-phone-controls:
    build:
      targets:
        p2pkit-rpc-phone: all
        p2pkit-rpc-phone-tests: [test]
        p2pkit-rpc-phone-uitests: [test]
    test:
      targets:
        - p2pkit-rpc-phone-tests
        - p2pkit-rpc-phone-uitests
