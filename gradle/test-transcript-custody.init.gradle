// Opt-in only, installed by scripts/test-transcript-custody.py in an owned home.
// Configure forked Test JVMs, not the daemon. Never change tasks/filters/deadlines.
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.StandardOpenOption
import java.security.MessageDigest
import org.gradle.api.Action
import org.gradle.api.GradleException
import org.gradle.api.tasks.testing.Test

// Kept in this hash-bound initializer. The isolated hosted API fixture compiles
// this whole file and loads this helper without executing the request entrypoint.
class TranscriptTestCustody {
    private static final String TEMP_ARGUMENT = "-Djava.io.tmpdir"

    private static void demand(boolean condition, String message) {
        if (!condition) throw new GradleException("Transcript custody: " + message)
    }

    static String selectedScope(Test task, File root, Map projects, Set requested) {
        if (task.project.rootProject.projectDir.canonicalFile != root.canonicalFile) return null
        def scope = projects.find { key, value -> value == task.path }?.key
        scope != null && requested.contains(scope) ? scope as String : null
    }

    static List<String> temporaryArguments(Test task) {
        // allJvmArgs expands providers; Test's real fork expands them again.
        // A stateful provider cannot be frozen by observing it twice. This finite
        // two-task profile rejects providers without ever evaluating them.
        demand(task.jvmArgumentProviders.isEmpty(), "test argument providers are not admitted")
        task.allJvmArgs.findAll { it == TEMP_ARGUMENT || it.startsWith(TEMP_ARGUMENT + "=") }
    }

    static void verifyTemporary(Test task, String temporary) {
        demand(temporaryArguments(task) == [TEMP_ARGUMENT + "=" + temporary],
               "effective test temporary argument changed")
    }

    static void configureTemporary(Test task, String temporary) {
        // Gradle 9.7 stores java.io.tmpdir in immutable fork options. The public
        // systemProperties getter and parsed jvmArgs alone do not expose it.
        def before = temporaryArguments(task)
        demand(before.isEmpty() || before == [TEMP_ARGUMENT + "=" + temporary],
               "conflicting effective test temporary argument")
        task.systemProperty("java.io.tmpdir", temporary)
        verifyTemporary(task, temporary)
    }

    static void verifyGuard(Map owner) {
        def actions = owner.task.actions.toList()
        def guardPositions = (0..<actions.size()).findAll { actions[it].is(owner.guard) }
        def stockPositions = (0..<actions.size()).findAll { actions[it].is(owner.stock) }
        demand(guardPositions.size() == 1 && stockPositions.size() == 1 &&
               stockPositions[0] == guardPositions[0] + 1, "Test guard is not immediately before its original action")
    }

    static Map installGuard(Test task, String temporary, Closure ready) {
        // Register before project plugins configure these finite Test tasks.
        // Never guess, move or replace a framework action if this layout changes.
        def original = task.actions.toList()
        demand(original.size() == 1, "unsupported initial Test action layout")
        def owner = [task: task, stock: original[0], guard: null, temporary: temporary]
        task.doFirst("P2pKit transcript custody", { current ->
            demand(current.is(task), "wrong guarded Test task")
            verifyGuard(owner)
            verifyTemporary(task, temporary)
            ready.call()
        } as Action)
        // doFirst wraps the supplied Action. Bind the actual list identity, not
        // the unwrapped closure; later doFirst setup stays ahead of this guard.
        owner.guard = task.actions[0]
        demand(task.actions.size() == 2 && task.actions[1].is(owner.stock), "Test action installation changed")
        owner
    }
}

def demand = { condition, message ->
    if (!condition) throw new GradleException("Transcript custody: " + message)
}
def physical = { File file ->
    def path = file.toPath().toAbsolutePath().normalize()
    demand(path.toRealPath().equals(path), "nonphysical path")
    for (def part = path; part != null; part = part.parent) {
        demand(!Files.isSymbolicLink(part), "linked path")
    }
    path
}
def readBounded = { File file ->
    physical(file)
    demand(file.isFile() && file.length() <= 1024 * 1024, "unbounded request/input")
    file.bytes
}
def sha = { byte[] bytes -> MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString() }
demand(gradle.ext.has("p2pkitCustodyRequest") && gradle.ext.has("p2pkitCustodyRequestSha256"), "missing request")
def requestFile = new File(gradle.ext.p2pkitCustodyRequest as String)
def requestHash = gradle.ext.p2pkitCustodyRequestSha256 as String
def raw = readBounded(requestFile)
demand(sha(raw) == requestHash, "request changed")
def request = new JsonSlurper().parse(raw)
demand(request.schema == 1 && request.token ==~ /[0-9a-f]{32}/, "invalid request identity")
def root = new File(request.root as String)
def directory = new File(request.directory as String)
def home = new File(request.home as String)
def projects = [cli: ":p2p-sample-desktop:test", diagnostics: ":p2p-sample-diagnostics:test"]
demand(request.roots.keySet() == (["cli"] as Set) || request.roots.keySet() == (["cli", "diagnostics"] as Set),
       "unknown test scope")
def ownerDomain = {
    def chain = System.getenv("P2PKIT_AUDIT_OWNERSHIP_CHAIN")
    def encoded = System.getenv("P2PKIT_AUDIT_OWNERSHIP_DOMAINS")
    demand(chain != null && chain ==~ /[0-9a-f]{32}(?::[0-9a-f]{32}){0,31}/ &&
           encoded != null && encoded.length() <= 512 * 1024, "missing or unbounded native ownership")
    def ids = chain.split(":") as List
    def domains = new JsonSlurper().parseText(encoded)
    demand(domains instanceof List && domains.size() == ids.size() && ids.toSet().size() == ids.size(),
           "invalid native ownership chain")
    domains.eachWithIndex { domain, index ->
        demand(domain instanceof Map && domain.keySet() == (["id", "job", "state", "home"] as Set) &&
               domain.id == ids[index] && domain.job instanceof String && domain.job ==~ /[0-9a-f]{32}/ &&
               [domain.state, domain.home].every { it instanceof String && it.length() > 0 && !it.contains("\u0000") },
               "invalid native ownership domain")
    }
    def expected = [id: request.owner.productInvocation, job: request.owner.job,
                    state: request.ownerState, home: request.home]
    def actual = domains.last()
    demand(actual == expected && System.getenv("P2PKIT_AUDIT_JOB_ID") == actual.job &&
           System.getenv("P2PKIT_AUDIT_STATE_DIR") == actual.state &&
           System.getenv("GRADLE_USER_HOME") == actual.home, "wrong native product domain")
    // Only the direct reserved product domain is admitted. A nested leaf needs
    // its own prepared request; an ancestor receipt is not its retirement proof.
    actual
}
def validate = {
    demand(sha(readBounded(requestFile)) == requestHash, "request changed")
    demand(physical(home) == physical(gradle.gradleUserHomeDir), "wrong Gradle home")
    physical(directory)
    request.inputs.each { name, hash ->
        demand(!name.startsWith("/") && !name.contains(".."), "invalid source input")
        demand(sha(readBounded(new File(root, name as String))) == hash, "bound input changed")
    }
    request.roots.each { scope, entry ->
        def temp = new File(entry.path as String)
        demand(physical(temp).startsWith(physical(directory)), "temporary path escaped custody")
        demand(new String(readBounded(new File(temp, "owner.token")), "UTF-8") == request.token + "\n",
               "temporary ownership changed")
        if (Files.getFileStore(temp.toPath()).supportsFileAttributeView("unix")) {
            def ids = Files.readAttributes(temp.toPath(), "unix:dev,ino", LinkOption.NOFOLLOW_LINKS)
            demand(ids.dev == entry.identity.device && ids.ino == entry.identity.inode, "temporary root replaced")
        }
        // fileKey() is diagnostic only; Windows may legitimately return null.
    }
    demand(System.getenv("_JAVA_OPTIONS") == null, "late JVM-option override is not admitted")
    ownerDomain()
}
def event = { scope, suffix, fields ->
    validate()
    def data = [schema: 1, token: request.token, requestSha256: requestHash, task: projects[scope],
                ownerDomain: ownerDomain()] + fields
    def path = new File(directory, "events/${scope}-${suffix}.json").toPath()
    physical(path.parent.toFile())
    def bytes = (JsonOutput.toJson(data) + "\n").getBytes("UTF-8")
    Files.write(path, bytes, StandardOpenOption.CREATE_NEW, StandardOpenOption.WRITE)
}

// Included builds (including buildSrc) share init.d. Filter by root before task
// configuration. Install early so later normal doFirst setup runs BEFORE the
// guard, which checks its adjacency to the original Test action at execution.
def guarded = [:]
gradle.beforeProject { project ->
    if (project.rootProject.projectDir.canonicalFile != root.canonicalFile) return
    project.tasks.withType(Test).configureEach { task ->
        def scope = TranscriptTestCustody.selectedScope(task, root, projects, request.roots.keySet())
        if (scope == null) return
        demand(!guarded.containsKey(scope), "duplicate guarded Test task")
        def temporary = request.roots[scope].path as String
        guarded[scope] = TranscriptTestCustody.installGuard(task, temporary) {
            validate()
            def key = Files.readAttributes(new File(temporary).toPath(), "basic:fileKey", LinkOption.NOFOLLOW_LINKS).fileKey
            event(scope, "start", [temporary: temporary, fileKey: key == null ? null : key.toString()])
        }
    }
}
gradle.projectsEvaluated {
    if (gradle.rootProject.projectDir.canonicalFile != root.canonicalFile) return
    validate()
    request.roots.each { scope, entry ->
        def task = gradle.rootProject.tasks.getByPath(projects[scope])
        demand(task instanceof Test, "expected an actual Test task")
        demand(guarded[scope]?.task?.is(task), "Test task missed early custody registration")
        TranscriptTestCustody.configureTemporary(task, entry.path as String)
        TranscriptTestCustody.verifyGuard(guarded[scope])
    }
}
gradle.taskGraph.afterTask { task, state ->
    if (task.project.rootProject.projectDir.canonicalFile != root.canonicalFile) return
    def scope = projects.find { key, value -> value == task.path }?.key
    if (scope != null && request.roots.containsKey(scope)) {
        event(scope, "finish", [executed: state.executed && !state.skipped && !state.noSource,
                               failed: state.failure != null])
    }
}
