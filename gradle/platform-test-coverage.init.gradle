// Invocation-local evidence. Only scripts/run-platform-tests.py supplies the
// fresh token/output path; included builds must not overwrite the root report.
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.time.OffsetDateTime
import java.time.ZoneOffset
import java.util.concurrent.ConcurrentHashMap
import java.util.concurrent.atomic.AtomicLong
import org.gradle.api.tasks.testing.AbstractTestTask
import org.gradle.api.tasks.testing.TestDescriptor
import org.gradle.api.tasks.testing.TestListener
import org.gradle.api.tasks.testing.TestResult
import org.gradle.api.provider.Property

gradle.projectsLoaded {
    def root = gradle.rootProject
    def properties = gradle.startParameter.projectProperties
    if (root.rootDir.absolutePath != properties['p2pkit.testCoverageRoot']) return
    def token = properties['p2pkit.testCoverageToken']
    if (!(token ==~ /[0-9a-f]{32}/)) throw new GradleException('Missing test-coverage invocation token')
    def output = new File(root.rootDir, "build/reports/platform-tests/${token}/execution.json")
    def model = [:]
    def records = new ConcurrentHashMap()
    def counts = new ConcurrentHashMap()
    def graph = Collections.synchronizedSet(new HashSet())
    def selected = [:]
    def simulatorConfigured = [:]
    def simulatorGraph = [:]
    def simulatorType = 'org.jetbrains.kotlin.gradle.targets.native.tasks.KotlinNativeSimulatorTest'
    def expectedSimulators = [':p2p-core:iosSimulatorArm64Test', ':p2p-core:iosX64Test',
                              ':p2p-transport-lan:iosSimulatorArm64Test', ':p2p-transport-lan:iosX64Test'] as Set
    def sha256 = { byte[] raw -> MessageDigest.getInstance('SHA-256').digest(raw).encodeHex().toString() }
    def readOriginal = { File file ->
        def path = file.toPath()
        for (def parent = path; parent != null; parent = parent.parent) {
            if (Files.isSymbolicLink(parent)) throw new GradleException('Linked ordinary simulator receipt')
        }
        if (!file.isAbsolute() || file.absolutePath != file.canonicalPath || !Files.isRegularFile(path) ||
            file.length() <= 0 || file.length() > 4 * 1024 * 1024) {
            throw new GradleException('Missing or invalid ordinary simulator receipt')
        }
        def raw = Files.newInputStream(path, java.nio.file.StandardOpenOption.READ,
            java.nio.file.LinkOption.NOFOLLOW_LINKS).withCloseable { stream -> stream.readNBytes(4 * 1024 * 1024 + 1) }
        if (raw.length == 0 || raw.length > 4 * 1024 * 1024) {
            throw new GradleException('Ordinary simulator receipt exceeds its bound')
        }
        raw
    }
    def bindingPath = properties['p2pkit.ordinarySimulatorBinding']
    def bindingHash = properties['p2pkit.ordinarySimulatorSha256']
    def startHash = properties['p2pkit.ordinarySimulatorStartSha256']
    def prelaunchHash = properties['p2pkit.ordinarySimulatorPrelaunchSha256']
    def statePath = System.getenv('P2PKIT_AUDIT_STATE_DIR')
    def parentContext = statePath == null ? null : new File(new File(statePath).parentFile, 'run-context.json')
    def ordinaryRequired = bindingPath != null || bindingHash != null || startHash != null || prelaunchHash != null ||
        System.getenv('P2PKIT_ORDINARY_FULL_SIMULATOR') != null ||
        System.getenv('P2PKIT_ORDINARY_FULL_SIMULATOR_SHA256') != null ||
        (System.getenv('GITHUB_ACTIONS') == 'true' && System.getenv('GITHUB_JOB') == 'complete-gate')
    if (parentContext != null && parentContext.exists()) {
        def context = new JsonSlurper().parse(readOriginal(parentContext))
        ordinaryRequired |= context.scope == 'CLOSED_ORDINARY_TEST_CONTROLLER' && context.profile == 'full'
    }
    def intelTasks = [':p2p-core:iosX64Test', ':p2p-transport-lan:iosX64Test']
    def intelBindingPath = properties['p2pkit.intelSimulatorBinding']
    def intelBindingHash = properties['p2pkit.intelSimulatorSha256']
    def intelRequired = intelBindingPath != null || intelBindingHash != null ||
        gradle.startParameter.taskNames == intelTasks
    if (intelRequired && ordinaryRequired) throw new GradleException('Intel and ordinary simulator modes overlap')
    def binding = null
    def originalHashes = [:]
    if (ordinaryRequired) {
        if (gradle.startParameter.taskNames != ['check'] || parentContext == null ||
            bindingPath != new File(parentContext.parentFile, 'evidence/simulator/binding.json').absolutePath ||
            bindingPath != System.getenv('P2PKIT_ORDINARY_FULL_SIMULATOR') ||
            !(bindingHash ==~ /[0-9a-f]{64}/) || bindingHash != System.getenv('P2PKIT_ORDINARY_FULL_SIMULATOR_SHA256') ||
            !(startHash ==~ /[0-9a-f]{64}/) || !(prelaunchHash ==~ /[0-9a-f]{64}/)) {
            throw new GradleException('Primary ordinary FULL simulator binding required')
        }
        def file = new File(bindingPath)
        def raw = readOriginal(file)
        if (sha256(raw) != bindingHash) throw new GradleException('Ordinary simulator binding bytes changed')
        binding = new JsonSlurper().parse(raw)
        def role = ['arm64', 'aarch64'].contains(System.getProperty('os.arch')) ? 'macos-arm64' :
            ['amd64', 'x86_64'].contains(System.getProperty('os.arch')) ? 'macos-x64' : 'unsupported'
        if (binding.schema != 1 || binding.scope != 'RESERVED_PRIMARY_ORDINARY_FULL_SIMULATOR' ||
            binding.profile != 'full' || binding.root != root.rootDir.canonicalPath || binding.role != role ||
            !['Mac OS X', 'Darwin'].contains(System.getProperty('os.name')) ||
            binding.state != statePath || binding.session != parentContext.parentFile.canonicalPath ||
            binding.home != System.getenv('GRADLE_USER_HOME') || binding.job != System.getenv('P2PKIT_AUDIT_JOB_ID') ||
            binding.developerDir != System.getenv('DEVELOPER_DIR') || binding.selected.device.state != 'Shutdown' ||
            !(binding.selected.device.udid ==~ /[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}/)) {
            throw new GradleException('Ordinary simulator context differs')
        }
        def domains = new JsonSlurper().parseText(System.getenv('P2PKIT_AUDIT_OWNERSHIP_DOMAINS') ?: '[]')
        def controllerContext = new JsonSlurper().parse(readOriginal(parentContext))
        def expected = [id: binding.productInvocation, job: binding.job, state: binding.state, home: binding.home]
        if (!(domains instanceof List) || domains.size() < 2 || domains.last() != expected ||
            domains.collect { it.id }.join(':') != System.getenv('P2PKIT_AUDIT_OWNERSHIP_CHAIN') ||
            domains.take(domains.size() - 2).collect { it.id } != controllerContext.ancestorInvocationIds ||
            ['job', 'state', 'home'].any { domains[-2][it] != expected[it] }) {
            throw new GradleException('Simulator receipt is not this reserved primary invocation')
        }
        originalHashes[file] = bindingHash
        originalHashes[parentContext] = binding.contextSha256
        originalHashes[new File(statePath, 'context.json')] = binding.canonicalContextSha256
        originalHashes[new File(parentContext.parentFile, 'evidence/custody/request.json')] = binding.custodyRequestSha256
        originalHashes[new File(parentContext.parentFile, 'evidence/simulator/admission.json')] = binding.admissionSha256
        def startFile = new File(statePath, "evidence/${binding.productInvocation}/start.json")
        def prelaunchFile = new File(parentContext.parentFile, 'evidence/simulator/prelaunch.json')
        originalHashes[startFile] = startHash
        originalHashes[prelaunchFile] = prelaunchHash
        def actualStart = new JsonSlurper().parse(readOriginal(startFile))
        def expectedStart = [schema: 1, id: binding.productInvocation, purpose: 'ordinary-full', kind: 'command',
            requestedArgv: ['python3', 'scripts/run-platform-tests.py', 'full'], cwd: binding.root,
            wrapper: binding.root + '/gradlew', host: binding.role, jobId: binding.job, gradleHome: binding.home,
            ancestorInvocationIds: domains.take(domains.size() - 1).collect { it.id }, sourceBefore: null, sourceAfter: null,
            productExitCode: null, stopExitCode: null, finalExitCode: 125, sourceUnchanged: false,
            ownedSurvivors: [], errors: [], evidenceDirectory: startFile.parentFile.absolutePath]
        def expectedStartKeys = (expectedStart.keySet() + ['controllerPid', 'startedUtc']) as Set
        if (!(actualStart instanceof Map) || actualStart.keySet() != expectedStartKeys ||
            expectedStart.any { key, value -> actualStart[key] != value } ||
            !(actualStart.controllerPid instanceof Number) || actualStart.controllerPid.longValue() <= 0 ||
            !(actualStart.controllerPid.toString() ==~ /[1-9][0-9]*/) || !(actualStart.startedUtc instanceof String)) {
            throw new GradleException('Actual primary canonical start differs')
        }
        def before = new JsonSlurper().parse(readOriginal(prelaunchFile))
        if (before.schema != 1 || before.scope != 'CURRENT_SHUTDOWN_BEFORE_PRIMARY_LAUNCH' ||
            before.bindingSha256 != bindingHash || before.device != binding.selected.device) {
            throw new GradleException('Current prelaunch Shutdown observation differs')
        }
    }
    def verifySimulatorOriginals = {
        originalHashes.each { file, hash ->
            if (sha256(readOriginal(file)) != hash) throw new GradleException('Original simulator binding changed')
        }
    }
    verifySimulatorOriginals()
    def deviceRecord = { entry ->
        def device = entry.task.getDevice().get()
        if (device != binding.selected.device.udid) throw new GradleException('Simulator device Property changed')
        [device: device, type: entry.type]
    }

    // The Intel caller owns boot/readiness/retirement. This disjoint branch only
    // validates its frozen context and binds the two real KGP task Properties.
    def intelBinding = null
    def intelIdentity = null
    def intelSelected = [:]
    def intelTypes = [] as Set
    def intelConfigured = [:]
    def intelGraph = [:]
    def intelOriginalHashes = [:]
    def intelDirectory = new File(output.parentFile, 'intel-simulator')
    def intelOwner = null
    def readIntelOriginal = { File file, int limit, boolean allowEmpty ->
        try {
            def path = file.toPath()
            for (def parent = path; parent != null; parent = parent.parent) {
                if (Files.isSymbolicLink(parent)) throw new GradleException('Linked Intel simulator original')
            }
            def before = Files.readAttributes(path, 'unix:dev,ino,mode,nlink,uid,size,lastModifiedTime,ctime',
                java.nio.file.LinkOption.NOFOLLOW_LINKS)
            if (!file.isAbsolute() || file.absolutePath != file.canonicalPath ||
                !Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS) || before.nlink != 1 ||
                (before.mode.intValue() & 0777) != 0400 || Files.getOwner(path) != intelOwner ||
                before.size < (allowEmpty ? 0 : 1) || before.size > limit) {
                throw new GradleException('Invalid Intel simulator original')
            }
            def raw = Files.newInputStream(path, java.nio.file.StandardOpenOption.READ,
                java.nio.file.LinkOption.NOFOLLOW_LINKS).withCloseable { stream -> stream.readNBytes(limit + 1) }
            def after = Files.readAttributes(path, 'unix:dev,ino,mode,nlink,uid,size,lastModifiedTime,ctime',
                java.nio.file.LinkOption.NOFOLLOW_LINKS)
            if (before != after || raw.length != before.size || raw.length > limit) {
                throw new GradleException('Intel simulator original changed during read')
            }
            raw
        } catch (Exception ignored) {
            throw new GradleException('Intel simulator original read refused')
        }
    }
    def intelSorted
    intelSorted = { value ->
        value instanceof Map ? value.keySet().sort().collectEntries { [(it): intelSorted(value[it])] } :
            value instanceof List ? value.collect { intelSorted(it) } : value
    }
    def intelRecord = { byte[] raw ->
        try {
            if (raw.length == 0 || raw.length > 64 * 1024 || raw.any { (it & 0xff) > 127 }) {
                throw new GradleException('Intel simulator JSON bound differs')
            }
            def value = new JsonSlurper().parse(raw)
            // Exact canonical re-encoding also rejects duplicate keys and
            // noncanonical numbers/escapes instead of silently normalizing them.
            def canonical = JsonOutput.toJson(intelSorted(value)).replaceAll(/[\u007f-\uffff]/) { character ->
                String.format('\\u%04x', (int) character.charAt(0))
            } + '\n'
            if (!(value instanceof Map) || !Arrays.equals(raw, canonical.getBytes('US-ASCII'))) {
                throw new GradleException('Intel simulator JSON is not canonical')
            }
            value
        } catch (Exception ignored) {
            throw new GradleException('Intel simulator JSON refused')
        }
    }
    def intelFields = { value, fields ->
        if (!(value instanceof Map) || value.keySet() != (fields as Set)) {
            throw new GradleException('Intel simulator record fields differ')
        }
    }
    def intelCount = { value, maximum ->
        (value instanceof Integer || value instanceof Long) && value >= 0 && value <= maximum
    }
    if (intelRequired) {
        if (gradle.startParameter.taskNames != intelTasks ||
            intelBindingPath != new File(intelDirectory, 'binding.json').absolutePath ||
            !(intelBindingHash ==~ /[0-9a-f]{64}/) ||
            !['Mac OS X', 'Darwin'].contains(System.getProperty('os.name')) ||
            !['amd64', 'x86_64'].contains(System.getProperty('os.arch'))) {
            throw new GradleException('Caller-managed Intel simulator binding required')
        }
        intelOwner = intelDirectory.toPath().fileSystem.userPrincipalLookupService.lookupPrincipalByName(
            System.getProperty('user.name'))
        if (!Files.isDirectory(intelDirectory.toPath(), java.nio.file.LinkOption.NOFOLLOW_LINKS) ||
            Files.getOwner(intelDirectory.toPath()) != intelOwner ||
            ((Files.getAttribute(intelDirectory.toPath(), 'unix:mode') as int) & 0777) != 0700) {
            throw new GradleException('Intel simulator evidence directory differs')
        }
        def file = new File(intelBindingPath)
        def raw = readIntelOriginal(file, 64 * 1024, false)
        if (sha256(raw) != intelBindingHash) throw new GradleException('Intel simulator binding bytes changed')
        intelBinding = intelRecord(raw)
        intelFields(intelBinding, ['schema', 'scope', 'profile', 'role', 'root', 'token', 'source', 'developerDir',
                                  'github', 'tasks', 'standalone', 'selected', 'bootedDevice', 'originals'])
        def github = ['actions': 'GITHUB_ACTIONS', 'repository': 'GITHUB_REPOSITORY', 'runId': 'GITHUB_RUN_ID',
                      'runAttempt': 'GITHUB_RUN_ATTEMPT', 'sha': 'GITHUB_SHA', 'ref': 'GITHUB_REF', 'job': 'GITHUB_JOB']
            .collectEntries { key, variable -> [(key): System.getenv(variable)] }
        intelFields(intelBinding.source, ['commit', 'tree', 'status', 'diffSha256'])
        if (!(intelBinding.schema instanceof Integer) || intelBinding.schema != 1 ||
            intelBinding.scope != 'CALLER_MANAGED_INTEL_SIMULATOR_V1' || intelBinding.profile != 'ios-x64' ||
            intelBinding.role != 'macos-x64' || intelBinding.root != root.rootDir.canonicalPath ||
            intelBinding.token != token || intelBinding.tasks != intelTasks ||
            !(intelBinding.standalone instanceof Boolean) || intelBinding.standalone != false ||
            intelBinding.developerDir != System.getenv('DEVELOPER_DIR') || intelBinding.github != github ||
            !(intelBinding.source.commit ==~ /[0-9a-f]{40}/) || !(intelBinding.source.tree ==~ /[0-9a-f]{40}/) ||
            intelBinding.source.status != '' || intelBinding.source.diffSha256 != sha256(new byte[0])) {
            throw new GradleException('Intel simulator source or invocation context differs')
        }
        if (github.actions == 'true' && (github.values().any { !(it instanceof String) || it.isEmpty() } ||
            !(github.runId ==~ /[1-9][0-9]*/) || !(github.runAttempt ==~ /[1-9][0-9]*/) ||
            !(github.job ==~ /[A-Za-z_][A-Za-z0-9_-]*/) || github.sha != intelBinding.source.commit)) {
            throw new GradleException('Intel simulator hosted identity differs')
        }
        intelFields(intelBinding.selected, ['runtime', 'device'])
        intelFields(intelBinding.selected.device, ['udid', 'name', 'deviceTypeIdentifier', 'isAvailable', 'state'])
        def device = intelBinding.selected.device
        if (intelBinding.selected.runtime != [identifier: 'com.apple.CoreSimulator.SimRuntime.iOS-26-2',
                version: '26.2', isAvailable: true] ||
            !(device.udid ==~ /[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}/) || device.name != 'iPhone 17' ||
            device.deviceTypeIdentifier != 'com.apple.CoreSimulator.SimDeviceType.iPhone-17' ||
            !(device.isAvailable instanceof Boolean) || device.isAvailable != true || device.state != 'Shutdown' ||
            intelBinding.bootedDevice != (device + [state: 'Booted'])) {
            throw new GradleException('Intel simulator selected or prelaunch device differs')
        }
        def phases = [
            'simulator-macos-version': ['/usr/bin/sw_vers', '-productVersion'],
            'simulator-xcode-version': ['/usr/bin/xcodebuild', '-version'],
            'simulator-first-launch': ['/usr/bin/xcodebuild', '-checkFirstLaunchStatus'],
            'simulator-runtimes': ['/usr/bin/xcrun', 'simctl', 'list', '--json', 'runtimes'],
            'intel-bootstatus-help': ['/usr/bin/xcrun', 'simctl', 'help', 'bootstatus'],
            'simulator-devices': ['/usr/bin/xcrun', 'simctl', 'list', '--json', 'devices', 'available'],
            'intel-boot': ['/usr/bin/xcrun', 'simctl', 'boot', device.udid],
            'intel-bootstatus': ['/usr/bin/xcrun', 'simctl', 'bootstatus', device.udid],
            'intel-prelaunch': ['/usr/bin/xcrun', 'simctl', 'list', '--json', 'devices', 'available'],
        ]
        def expectedOriginals = phases.keySet().collectMany { label ->
            ['result.json', 'stdout.bin', 'stderr.bin'].collect { "${label}/${it}".toString() }
        } as Set
        intelFields(intelBinding.originals, expectedOriginals)
        def originals = [:]
        intelBinding.originals.each { path, reference ->
            intelFields(reference, ['bytes', 'sha256'])
            def limit = path.endsWith('/stdout.bin') ? 1024 * 1024 : 64 * 1024
            def allowEmpty = path.endsWith('.bin')
            if (!intelCount(reference.bytes, limit) || (!allowEmpty && reference.bytes == 0) ||
                !(reference.sha256 ==~ /[0-9a-f]{64}/)) {
                throw new GradleException('Intel simulator original reference differs')
            }
            def originalFile = new File(intelDirectory, path)
            def bytes = readIntelOriginal(originalFile, limit, allowEmpty)
            if (bytes.length != reference.bytes || sha256(bytes) != reference.sha256) {
                throw new GradleException('Intel simulator original bytes changed')
            }
            originals[path] = bytes
            intelOriginalHashes[originalFile] = reference + [limit: limit, allowEmpty: allowEmpty]
        }
        def finished = null
        phases.each { label, argv ->
            def phase = intelRecord(originals["${label}/result.json".toString()])
            intelFields(phase, ['schema', 'label', 'argv', 'cwd', 'startedUtc', 'finishedUtc', 'exitCode',
                               'timedOut', 'outputLimitExceeded', 'ownedGroupDrained',
                               'stdoutBytes', 'stdoutSha256', 'stderrBytes', 'stderrSha256'])
            if (!(phase.schema instanceof Integer) || phase.schema != 1 || phase.label != label ||
                phase.argv != argv || phase.cwd != intelBinding.root ||
                !(phase.exitCode instanceof Integer) || phase.exitCode != 0 ||
                !(phase.timedOut instanceof Boolean) || phase.timedOut != false ||
                !(phase.outputLimitExceeded instanceof Boolean) || phase.outputLimitExceeded != false ||
                !(phase.ownedGroupDrained instanceof Boolean) || phase.ownedGroupDrained != true) {
                throw new GradleException('Intel simulator phase did not complete successfully')
            }
            ['stdout', 'stderr'].each { stream ->
                def reference = intelBinding.originals["${label}/${stream}.bin".toString()]
                if (!intelCount(phase[stream + 'Bytes'], reference.bytes) ||
                    phase[stream + 'Bytes'] != reference.bytes || phase[stream + 'Sha256'] != reference.sha256) {
                    throw new GradleException('Intel simulator phase stream identity differs')
                }
            }
            try {
                def startedAt = OffsetDateTime.parse(phase.startedUtc)
                def finishedAt = OffsetDateTime.parse(phase.finishedUtc)
                if (startedAt.offset != ZoneOffset.UTC || finishedAt.offset != ZoneOffset.UTC ||
                    finishedAt.isBefore(startedAt) || (finished != null && startedAt.isBefore(finished))) {
                    throw new GradleException('Intel simulator phase order differs')
                }
                finished = finishedAt
            } catch (Exception ignored) {
                throw new GradleException('Intel simulator phase time refused')
            }
        }
        intelOriginalHashes[file] = [bytes: raw.length, sha256: intelBindingHash, limit: 64 * 1024, allowEmpty: false]
        intelIdentity = [scope: intelBinding.scope, bindingSha256: intelBindingHash,
            prelaunchSha256: intelBinding.originals['intel-prelaunch/result.json'].sha256, token: token,
            device: device.udid, runtime: intelBinding.selected.runtime.identifier, standalone: false]
    }
    def verifyIntelOriginals = {
        intelOriginalHashes.each { file, reference ->
            def raw = readIntelOriginal(file, reference.limit, reference.allowEmpty)
            if (raw.length != reference.bytes || sha256(raw) != reference.sha256) {
                throw new GradleException('Original Intel simulator binding changed')
            }
        }
    }
    def intelDeviceRecord = { entry ->
        def device = entry.task.getDevice().get()
        def standalone = entry.task.getStandalone().get()
        if (device != intelBinding.selected.device.udid || !(standalone instanceof Boolean) || standalone != false ||
            entry.type != simulatorType || !entry.actualType.isInstance(entry.task)) {
            throw new GradleException('Intel simulator task Properties changed')
        }
        [device: device, type: entry.type, standalone: standalone]
    }
    verifyIntelOriginals()

    root.allprojects { project ->
        if (binding != null) {
            project.plugins.withId('org.jetbrains.kotlin.multiplatform') { plugin ->
                // Reuse the real pinned project's typed KGP seam. Do not install
                // the mutable writer or modify enabled/standalone/filters/timeouts.
                Class actualType = plugin.class.classLoader.loadClass(simulatorType)
                if (!Property.isAssignableFrom(actualType.getMethod('getDevice').returnType)) {
                    throw new GradleException('Pinned simulator getDevice is not a Property')
                }
                project.tasks.withType(actualType).configureEach { task ->
                    task.getDevice().set(binding.selected.device.udid)
                    selected[task.path] = [task: task, type: actualType.name]
                }
                project.afterEvaluate {
                    project.tasks.withType(actualType).each { task ->
                        if (task.getDevice().get() != binding.selected.device.udid) {
                            throw new GradleException('Simulator binding overwritten during evaluation')
                        }
                    }
                }
            }
        }
        if (intelBinding != null) {
            project.plugins.withId('org.jetbrains.kotlin.multiplatform') { plugin ->
                Class actualType = plugin.class.classLoader.loadClass(simulatorType)
                if (!Property.isAssignableFrom(actualType.getMethod('getDevice').returnType) ||
                    !Property.isAssignableFrom(actualType.getMethod('getStandalone').returnType)) {
                    throw new GradleException('Pinned Intel simulator getters are not Properties')
                }
                intelTypes.add(actualType)
                project.tasks.withType(actualType).configureEach { task ->
                    if (!intelTasks.contains(task.path)) return
                    task.getDevice().set(intelBinding.selected.device.udid)
                    task.getStandalone().set(false)
                    intelSelected[task.path] = [task: task, type: actualType.name, actualType: actualType]
                }
                project.afterEvaluate {
                    project.tasks.withType(actualType).each { task ->
                        if (intelTasks.contains(task.path)) intelDeviceRecord(intelSelected[task.path])
                    }
                }
            }
        }
        project.tasks.withType(AbstractTestTask).configureEach { task ->
            def counters = ['SUCCESS', 'FAILURE', 'SKIPPED'].collectEntries { [(it): new AtomicLong()] }
            counts[task.path] = counters
            task.addTestListener(new TestListener() {
                void beforeSuite(TestDescriptor descriptor) {}
                void afterSuite(TestDescriptor descriptor, TestResult result) {}
                void beforeTest(TestDescriptor descriptor) {}
                void afterTest(TestDescriptor descriptor, TestResult result) {
                    counters[result.resultType.toString()].incrementAndGet()
                }
            })
        }
    }

    gradle.projectsEvaluated {
        if (binding != null) {
            verifySimulatorOriginals()
            if (selected.keySet() != expectedSimulators) throw new GradleException('Review changed simulator task model')
            selected.each { path, entry ->
                simulatorConfigured[path] = deviceRecord(entry)
                entry.task.getDevice().disallowChanges()
            }
        }
        if (intelBinding != null) {
            verifyIntelOriginals()
            if (intelSelected.keySet() != (intelTasks as Set)) {
                throw new GradleException('Review changed Intel simulator task model')
            }
            intelSelected.each { path, entry ->
                intelConfigured[path] = intelDeviceRecord(entry)
                entry.task.getDevice().disallowChanges()
                entry.task.getStandalone().disallowChanges()
            }
        }
        root.allprojects { project ->
            def kotlin = project.extensions.findByName('kotlin')
            def targets = [:]
            if (kotlin != null) {
                if (kotlin.hasProperty('targets')) {
                    kotlin.targets.each { targets[it.name] = it.platformType.toString() }
                } else if (kotlin.hasProperty('target')) {
                    def platform = kotlin.target.platformType.toString()
                    targets[platform == 'androidJvm' ? 'android' : platform] = platform
                } else {
                    targets['UNCLASSIFIED'] = kotlin.class.name
                }
            }
            def tests = project.tasks.withType(AbstractTestTask).collect { it.path }.sort()
            model[project.path] = [targets: targets, tests: tests]
        }
    }
    gradle.taskGraph.whenReady { taskGraph ->
        graph.addAll(taskGraph.allTasks.collect { it.path })
        if (binding != null) {
            verifySimulatorOriginals()
            taskGraph.allTasks.each { task ->
                if (selected.containsKey(task.path)) simulatorGraph[task.path] = deviceRecord(selected[task.path])
            }
        }
        if (intelBinding != null) {
            verifyIntelOriginals()
            taskGraph.allTasks.each { task ->
                if (intelSelected.containsKey(task.path)) {
                    if (!intelSelected[task.path].task.is(task)) {
                        throw new GradleException('Intel simulator graph task identity changed')
                    }
                    intelGraph[task.path] = intelDeviceRecord(intelSelected[task.path])
                } else if (intelTypes.any { it.isInstance(task) }) {
                    throw new GradleException('Unexpected Intel simulator graph task')
                }
            }
            if (intelGraph.keySet() != (intelTasks as Set)) {
                throw new GradleException('Intel simulator graph differs')
            }
        }
    }
    gradle.taskGraph.afterTask { task, state ->
        if (!(task instanceof AbstractTestTask)) return
        records[task.path] = state.failure != null ? 'FAILED' :
            state.noSource ? 'NO_SOURCE' :
            state.skipped ? (state.skipMessage ?: 'SKIPPED') : 'EXECUTED'
    }
    gradle.buildFinished { result ->
        def tests = [:]
        root.allprojects { project ->
            project.tasks.withType(AbstractTestTask).each { task ->
                def counters = counts[task.path]
                tests[task.path] = [
                    outcome: records[task.path] ?: (graph.contains(task.path) ? 'NOT_COMPLETED' : 'NOT_REQUESTED'),
                    enabled: task.enabled,
                    inGraph: graph.contains(task.path),
                    passed: counters?.get('SUCCESS')?.get() ?: 0,
                    failed: counters?.get('FAILURE')?.get() ?: 0,
                    skipped: counters?.get('SKIPPED')?.get() ?: 0,
                ]
            }
        }
        def report = [schema: 1, token: token, buildFailed: result.failure != null,
                      dryRun: gradle.startParameter.dryRun,
                      host: [os: System.getProperty('os.name'), arch: System.getProperty('os.arch')],
                      model: model, tests: tests]
        if (binding != null) {
            verifySimulatorOriginals()
            selected.values().each { deviceRecord(it) }
            report.ordinarySimulator = [bindingSha256: bindingHash, admissionSha256: binding.admissionSha256,
                canonicalContextSha256: binding.canonicalContextSha256, job: binding.job,
                canonicalStartSha256: startHash, prelaunchSha256: prelaunchHash,
                productInvocation: binding.productInvocation, device: binding.selected.device.udid,
                runtime: binding.selected.runtime.identifier, configured: simulatorConfigured,
                inGraph: simulatorGraph, unchanged: true]
        }
        if (intelBinding != null) {
            verifyIntelOriginals()
            intelSelected.values().each { intelDeviceRecord(it) }
            if (intelConfigured.keySet() != (intelTasks as Set) || intelGraph.keySet() != (intelTasks as Set)) {
                throw new GradleException('Intel simulator final task model differs')
            }
            report.intelSimulator = intelIdentity + [configured: intelConfigured, inGraph: intelGraph, unchanged: true]
        }
        output.parentFile.mkdirs()
        def temporary = new File(output.parentFile, 'execution.json.tmp')
        temporary.setText(JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n', 'UTF-8')
        Files.move(temporary.toPath(), output.toPath(), StandardCopyOption.REPLACE_EXISTING)
    }
}
