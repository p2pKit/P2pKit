kotlin.code.style=official
# Maven coordinates — single source of truth for publishable artifacts, applied
# to every module from the root build's `allprojects` block, producing
# io.github.apdelrahman1911:<module>:<version>. maven-publish + POM are wired on all four
# library modules; artifact signing is wired centrally (conditional on a PGP
# key) in the root build. See docs/STABILIZATION_AND_RELEASE.md for the release
# recipe. The repository can build a signed Central Portal bundle locally;
# namespace ownership, credentials, and the final upload/publish remain
# maintainer-controlled external release gates.
GROUP=io.github.apdelrahman1911
VERSION_NAME=0.7.0-rc3
LATEST_PUBLISHED_VERSION=0.7.0-rc2
# Kotlin 2.4 raises its default iOS deployment floor to 15. Keep P2pKit's
# documented 0.7-line compatibility floor explicit for every linked binary.
IOS_MIN_VERSION=14.0
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# REL-GATE-01 (BUILD-14): make Gradle API deprecations fail in every local/CI
# invocation instead of relying on callers to remember --warning-mode=fail.
org.gradle.warning.mode=fail
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.enableCInteropCommonization=true
# Apple Silicon can cross-compile and publish iosX64, but cannot execute its
# x64-only Kotlin/Native test binary. Suppress only that host-mismatch warning;
# release publication and the fat simulator XCFramework still compile/inspect
# the iosX64 slice, while iosSimulatorArm64 tests execute on the host.
kotlin.native.ignoreDisabledTargets=true
