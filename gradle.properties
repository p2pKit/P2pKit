kotlin.code.style=official
# Maven coordinates — single source of truth for publishable artifacts, applied
# to every module from the root build's `allprojects` block, producing
# dev.p2pkit:<module>:<version>. maven-publish + POM are wired on all four
# library modules; artifact signing is wired centrally (conditional on a PGP
# key) in the root build. See docs/STABILIZATION_AND_RELEASE.md for the release
# recipe. NOTE: a remote Central/Sonatype repository is not yet configured, so
# `publishToMavenLocal` works today but Central upload still needs wiring.
GROUP=dev.p2pkit
VERSION_NAME=0.6.0
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.enableCInteropCommonization=true
