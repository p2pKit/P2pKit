kotlin.code.style=official
# Maven coordinates — single source of truth for publishable artifacts.
# See PROBLEMS_P2PKIT.md (no-publishing-plugin / no-pom-metadata): the library
# modules still need a publishing plugin (maven-publish or com.vanniktech.maven.publish)
# + POM + signing wired up before `publish` can produce artifacts.
GROUP=dev.p2pkit
VERSION_NAME=0.6.0
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.enableCInteropCommonization=true
